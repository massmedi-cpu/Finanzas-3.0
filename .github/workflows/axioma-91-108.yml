name: PRE-037 Axioma 91-108

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/layout.tsx"
      - "app/visual-preferences.tsx"
      - "app/visual-preferences.css"
      - "app/configuration/appearance/**"
      - "app/configuration/configuration-area-nav.tsx"
      - "scripts/verify-axioma-91-108.mjs"
      - "scripts/verify-bundle-budget.mjs"
      - "tests/e2e/visual-preferences-pre037.spec.ts"
      - ".github/workflows/axioma-91-108.yml"
      - ".github/workflows/navigation-performance.yml"
      - ".github/workflows/responsive-matrix-10.0.49.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Axioma 91-108 static contract
        run: node scripts/verify-axioma-91-108.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Client bundle budget
        run: node scripts/verify-bundle-budget.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Preferences, responsive and navigation performance
        run: >-
          npx playwright test
          tests/e2e/visual-preferences-pre037.spec.ts
          tests/e2e/navigation-performance-10.0.30.spec.ts
          --project=chromium-desktop
          --project=chromium-mobile
          --workers=2
