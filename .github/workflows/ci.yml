name: Finanzas 3.0 CI

on:
  pull_request:
    branches:
      - main
      - 'develop/**'
  push:
    branches:
      - 'develop/**'
      - 'audit/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Project invariants
        run: npm run audit:invariants

      - name: Finance regression tests
        run: npm test

      - name: Long-horizon regression tests
        run: npx tsx scripts/long-horizon-tests.mjs

      - name: Month-close regression tests
        run: npx tsx scripts/month-close-tests.mjs

      - name: Classification rule regression tests
        run: npx tsx scripts/classification-rule-tests.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Built app smoke test
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/finanzas-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          if ! npm run test:smoke; then
            cat /tmp/finanzas-next.log
            exit 1
          fi
