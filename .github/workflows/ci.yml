name: Financial App CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Verify manifest and lockfile version
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');const root=l.packages?.[''];if(!root||p.name!==l.name||p.version!==l.version||p.version!==root.version){console.error('package.json y package-lock.json no coinciden');process.exit(1)};console.log('Lockfile coherente · '+p.name+' '+p.version)"
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Verify dependency tree
        run: npm ls --depth=0
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Regression tests
        run: npm run test:regression
      - name: Analysis runtime performance contract
        run: node scripts/audit-analysis-deferred-runtime.mjs
      - name: Document matching index-path contract
        run: node scripts/audit-document-matching-index-path-v900.mjs
      - name: Document matching OCR readiness
        run: node scripts/audit-document-matching-ocr-readiness-v900.mjs
      - name: OCR operational status semantics
        run: ./node_modules/.bin/tsx scripts/ocr-operational-status-tests.ts
      - name: OCR dimension-aware transport
        run: node scripts/ocr-loader-dimension-tests.mjs
      - name: OCR loader cache freshness
        run: node scripts/ocr-loader-cache-policy-tests.mjs
      - name: OCR runtime provenance truth
        run: ./node_modules/.bin/tsx scripts/ocr-runtime-provenance-tests.ts
      - name: Canonical document OCR pipeline
        run: node scripts/audit-canonical-document-ocr-v900.mjs
      - name: OCR financial summary rows
        run: ./node_modules/.bin/tsx scripts/ocr-financial-summary-row-tests.ts
      - name: OCR commercial header recovery
        run: ./node_modules/.bin/tsx scripts/ocr-commercial-header-recovery-tests.ts
      - name: OCR parser revision
        run: ./node_modules/.bin/tsx scripts/ocr-parser-revision-tests.ts
      - name: OCR document type confidence
        run: ./node_modules/.bin/tsx scripts/ocr-document-type-confidence-tests.ts
      - name: OCR production concatenated date
        run: ./node_modules/.bin/tsx scripts/ocr-production-concatenated-date-tests.ts
      - name: OCR invoice amount confidence
        run: ./node_modules/.bin/tsx scripts/ocr-invoice-amount-confidence-tests.ts
      - name: OCR safe automatic reprocessing
        run: node scripts/ocr-safe-auto-reprocessing-tests.mjs
      - name: OCR merchant metadata confidence
        run: ./node_modules/.bin/tsx scripts/ocr-merchant-metadata-confidence-tests.ts
      - name: OCR explicit manual review
        run: ./node_modules/.bin/tsx scripts/ocr-explicit-review-tests.ts
      - name: OCR provisional values UX
        run: node scripts/ocr-provisional-values-ux-tests.mjs
      - name: OCR manual review completeness
        run: ./node_modules/.bin/tsx scripts/ocr-manual-review-completeness-tests.ts
      - name: OCR bulk recovery policy
        run: ./node_modules/.bin/tsx scripts/ocr-bulk-reprocessing-tests.ts
      - name: OCR server recovery safety
        run: ./node_modules/.bin/tsx scripts/ocr-server-reprocess-safety-tests.ts
      - name: OCR bulk recovery trust UX
        run: node scripts/ocr-bulk-recovery-trust-ux-tests.mjs
      - name: Archive pending reason trust UX
        run: node scripts/archive-pending-reasons-trust-tests.mjs
      - name: Archive duplicate review safety
        run: ./node_modules/.bin/tsx scripts/archive-duplicate-review-tests.ts
      - name: Movement selection performance and safety
        run: ./node_modules/.bin/tsx scripts/movement-selection-performance-tests.ts
      - name: Document link trust unification
        run: ./node_modules/.bin/tsx scripts/document-link-trust-unification-tests.ts
      - name: Sync observability and verification
        run: ./node_modules/.bin/tsx scripts/sync-observability-tests.ts
      - name: Forecast automatic precision
        run: node scripts/forecast-automatic-precision-tests.mjs
      - name: Forecast projection trust
        run: node scripts/forecast-projection-trust-tests.mjs
      - name: Forecast obligation identity
        run: node scripts/forecast-obligation-identity-tests.mjs
      - name: Forecast obligation identity performance
        run: node scripts/forecast-obligation-performance-tests.mjs
      - name: Static type and unused-code checks
        run: npm run lint
      - name: Production build and release gates
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ulxsvuksrghjgcjfuegv.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Release reproducibility gate
        run: |
          test -f package-lock.json
          git diff --exit-code -- package.json package-lock.json
          echo 'Release reproducible: package-lock presente, coherente y sin mutaciones del CI.'
