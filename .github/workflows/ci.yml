name: Financial App CI
on:
  pull_request:
    branches:
      - main
      - 'develop/**'
  push:
    branches:
      - 'financial-app-rebuild'
      - 'develop/v2.2.0-analytics'
      - 'develop/v2.3.0-intelligence'
      - 'develop/v2.4.0-long-horizon'
      - 'develop/v2.5.0-month-close'
      - 'develop/v2.6.0-rules'
      - 'develop/v2.7.0-explainability-rebuild'
      - 'develop/v2.8.0-integrity-rebuild'
      - 'develop/v2.8.1-chart-hotfix'
      - 'develop/v3.0.0-foundation'
      - 'hotfix/v3.0.1-sync'
      - 'hotfix/v3.0.2-ticket-ocr'
      - 'release/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify manifest and lockfile version
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');const root=l.packages?.[''];if(!root||p.name!==l.name||p.version!==l.version||p.version!==root.version){console.error('package.json y package-lock.json no coinciden');process.exit(1)};console.log('Lockfile coherente · '+p.name+' '+p.version)"
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Verify dependency tree
        run: npm ls --depth=0
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Structural Axioma audit
        run: npm run audit:structure
      - name: Architecture 1.7 regression audit
        run: npm run audit:v17
      - name: Recovery 1.8 audit
        run: npm run audit:v18
      - name: Document engine 1.9 guarantee audit
        run: npm run audit:v19
      - name: Unified Plan 2.0 audit
        run: npm run audit:v20
      - name: Stabilization 2.0.1 audit
        run: npm run audit:v201
      - name: Evolution 2.1 audit
        run: npm run audit:v210
      - name: Analytics 2.2 audit
        run: npm run audit:v220
      - name: Analytics calculation tests
        run: npm run test:analytics
      - name: Intelligence 2.3 audit
        run: npm run audit:v230
      - name: Intelligence decision tests
        run: npm run test:intelligence
      - name: Long horizon 2.4 audit
        run: npm run audit:v240
      - name: Long horizon calculation tests
        run: npm run test:horizon
      - name: Month close and Spanish format 2.5 audit
        run: npm run audit:v250
      - name: Spanish Spain number format tests
        run: npm run test:format
      - name: Full codebase 2.6 audit
        run: npm run audit:v260
      - name: Europe/Madrid time tests
        run: npm run test:time
      - name: Explainability 2.7 audit
        run: npm run audit:v270
      - name: Explainability decision tests
        run: npm run test:explainability
      - name: System integrity 2.8 audit
        run: npm run audit:v280
      - name: System integrity deterministic tests
        run: npm run test:integrity
      - name: Cash Flow chart 2.8.1 audit
        run: npm run audit:v281
      - name: Visual foundation 3.0 audit
        run: npm run audit:v300
      - name: Source sync regression audit
        run: npm run audit:sync
      - name: Ticket OCR pipeline audit
        run: npm run audit:ocr
      - name: Ticket OCR metadata tests
        run: npm run test:ocr
      - name: Backup recovery unit tests
        run: npm run test:backup
      - name: Accessibility regression audit
        run: npm run audit:a11y
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ulxsvuksrghjgcjfuegv.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Release reproducibility gate
        if: startsWith(github.ref, 'refs/heads/release/') || github.base_ref == 'main' || startsWith(github.base_ref, 'develop/') || startsWith(github.ref, 'refs/heads/develop/') || startsWith(github.ref, 'refs/heads/hotfix/')
        run: |
          test -f package-lock.json
          git diff --exit-code -- package.json package-lock.json
          echo 'Release reproducible: package-lock presente, coherente y sin mutaciones del CI.'
