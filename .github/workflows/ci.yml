name: Financial App CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: write
  pull-requests: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: One-time semantic accent migration
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/rename-gold-tokens-2026-08-31'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -Il -- '--gold-' app components lib scripts | grep -v '^scripts/audit-visual-debt.mjs$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No quedan archivos que migrar.'
          else
            printf 'Migrando %s archivos de runtime/auditoría.\n' "${#files[@]}"
            for file in "${files[@]}"; do
              sed -i \
                -e 's/--gold-primary/--accent-primary/g' \
                -e 's/--gold-light/--accent-light/g' \
                -e 's/--gold-dark/--accent-dark/g' \
                -e 's/--gold-muted/--accent-muted/g' \
                -e 's/--gold-hover/--accent-hover/g' \
                -e 's/--gold-active/--accent-active/g' \
                "$file"
            done
          fi
          node <<'NODE'
          const fs=require('node:fs');
          const path='scripts/audit-visual-debt.mjs';
          let source=fs.readFileSync(path,'utf8');
          for(const [oldName,newName] of [
            ['--gold-primary:','--accent-primary:'],
            ['--gold-light:','--accent-light:'],
            ['--gold-dark:','--accent-dark:'],
            ['--gold-muted:','--accent-muted:'],
            ['--gold-hover:','--accent-hover:'],
            ['--gold-active:','--accent-active:'],
          ]) source=source.replaceAll(`"${oldName}"`,`"${newName}"`);
          fs.writeFileSync(path,source);
          NODE
          if git grep -n -- '--gold-' app components lib scripts ':!scripts/audit-visual-debt.mjs'; then
            echo 'Quedan referencias --gold-* fuera del detector permanente.' >&2
            exit 1
          fi
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name 'massmedi-cpu'
          git config user.email 'massmedi@gmail.com'
          git add app components lib scripts .github/workflows/ci.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'La migración ya estaba aplicada.'
          else
            git commit -m 'Rename legacy gold tokens to semantic accents'
            git push origin HEAD:"$HEAD_BRANCH"
          fi
      - name: Verify manifest and lockfile version
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');const root=l.packages?.[''];if(!root||p.name!==l.name||p.version!==l.version||p.version!==root.version){console.error('package.json y package-lock.json no coinciden');process.exit(1)};console.log('Lockfile coherente · '+p.name+' '+p.version)"
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Verify dependency tree
        run: npm ls --depth=0
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Regression tests
        run: npm run test:regression
      - name: Static type and unused-code checks
        run: npm run lint
      - name: Production build and release gates
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ulxsvuksrghjgcjfuegv.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Release reproducibility gate
        run: |
          test -f package-lock.json
          git diff --exit-code -- package.json package-lock.json
          echo 'Release reproducible: package-lock presente, coherente y sin mutaciones del CI.'
