name: Financial App CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'financial-app-rebuild'
      - 'release/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact declared dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Structural Axioma audit
        run: npm run audit:structure

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ulxsvuksrghjgcjfuegv.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Release reproducibility gate
        if: startsWith(github.ref, 'refs/heads/release/') || github.base_ref == 'main'
        run: |
          test -f package-lock.json || { echo 'Falta package-lock.json: no se puede promover a release/main'; exit 1; }
