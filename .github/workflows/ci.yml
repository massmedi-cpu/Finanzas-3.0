name: Financial App CI
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'financial-app-rebuild'
      - 'release/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify manifest and lockfile version
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');const root=l.packages?.[''];if(!root||p.name!==l.name||p.version!==l.version||p.version!==root.version){console.error('package.json y package-lock.json no coinciden');process.exit(1)};console.log('Lockfile coherente · '+p.name+' '+p.version)"
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Verify dependency tree
        run: npm ls --depth=0
      - name: Structural Axioma audit
        run: npm run audit:structure
      - name: Architecture 1.7 regression audit
        run: npm run audit:v17
      - name: Recovery 1.8 audit
        run: node scripts/audit-v18.mjs
      - name: Backup recovery command tests
        run: npx tsx scripts/backup-recovery-tests.ts
      - name: Accessibility regression audit
        run: npm run audit:a11y
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ulxsvuksrghjgcjfuegv.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Release reproducibility gate
        if: startsWith(github.ref, 'refs/heads/release/') || github.base_ref == 'main'
        run: |
          test -f package-lock.json
          git diff --exit-code -- package.json package-lock.json
          echo 'Release reproducible: package-lock presente, coherente y sin mutaciones del CI.'
