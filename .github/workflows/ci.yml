name: Finanzas 3.0 CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'develop/**'
      - 'audit/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit validated lockfile on audit branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/audit/v2.0.1'
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: lock validated npm dependency graph"
            git push
          fi

      - name: Finance regression tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
