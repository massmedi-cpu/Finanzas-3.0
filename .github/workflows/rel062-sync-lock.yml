name: REL-062 Sync Lockfile

on:
  push:
    branches:
      - release/rel-062-art-009
    paths:
      - .github/workflows/rel062-sync-lock.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/rel-062-art-009
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Synchronize package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify 10.0.62 identity
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!=='10.0.62'||l.version!=='10.0.62'||l.packages[''].version!=='10.0.62')process.exit(1)"
      - name: Commit lockfile only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "REL-062 · sync package-lock 10.0.62"
          git push origin HEAD:release/rel-062-art-009
