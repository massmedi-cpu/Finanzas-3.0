name: Analysis Version Bump Once

on:
  push:
    branches:
      - audit/analysis-legibility-10.0.11
    paths:
      - ".github/workflows/analysis-version-bump-once.yml"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/analysis-legibility-10.0.11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set package version 10.0.11
        run: npm version 10.0.11 --no-git-tag-version
      - name: Commit synchronized version files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): set version 10.0.11"
          git push origin HEAD:audit/analysis-legibility-10.0.11
