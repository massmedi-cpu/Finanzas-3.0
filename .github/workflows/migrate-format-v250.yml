name: Migrate 2.5 Spanish format
on:
  push:
    branches: [develop/v2.5.0-month-close]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'centralize Spanish number formatting') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic formatter migration
        run: node scripts/migrate-format-v250.mjs
      - name: Commit migration
        run: |
          git config user.name "financial-app-2.5-bot"
          git config user.email "financial-app-2.5-bot@users.noreply.github.com"
          git add app components lib
          git diff --cached --quiet && exit 0
          git commit -m "refactor(2.5): centralize Spanish number formatting [skip ci]"
          git push origin HEAD:develop/v2.5.0-month-close
