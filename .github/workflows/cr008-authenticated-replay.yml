name: CR008 Authenticated Replay

on:
  push:
    branches:
      - 'ci/cr008-authenticated-replay-gate'
    paths:
      - '.github/workflows/cr008-authenticated-replay.yml'
      - 'scripts/verify-authenticated-ocr-replay-contract.mjs'
      - 'scripts/cr008-authenticated-replay.sh'
      - 'docs/CR008_AUTHENTICATED_REPLAY.md'
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Exact protected Vercel Preview URL to certify'
        required: true
        type: string
      expected_sha:
        description: 'Exact 40-character commit SHA deployed in that Preview'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cr008-authenticated-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout gate source
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify authenticated replay contract
        run: |
          node scripts/verify-authenticated-ocr-replay-contract.mjs
          bash -n scripts/cr008-authenticated-replay.sh

      - name: Typecheck gate source
        run: npm run typecheck

  authenticated-replay:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[cr008-auth-replay]'))
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: read
      id-token: write
    env:
      FINANCIAL_APP_QA_EMAIL: ${{ secrets.FINANCIAL_APP_QA_EMAIL }}
      FINANCIAL_APP_QA_PASSWORD: ${{ secrets.FINANCIAL_APP_QA_PASSWORD }}
      FINANCIAL_APP_DB_PASSWORD: ${{ secrets.FINANCIAL_APP_DB_PASSWORD }}
      FINANCIAL_APP_SUPABASE_PROJECT_REF: btzukbfesxdratqnxuoj
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout gate source
        uses: actions/checkout@v6

      - name: Generate ephemeral GitHub OIDC token
        id: oidc
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Resolve exact replay target
        id: target
        uses: actions/github-script@v8
        env:
          INPUT_PREVIEW_URL: ${{ inputs.preview_url }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              const url = (process.env.INPUT_PREVIEW_URL || '').replace(/\/$/, '');
              const sha = process.env.INPUT_EXPECTED_SHA || '';
              if (!/^https:\/\/[A-Za-z0-9.-]+\.vercel\.app$/i.test(url)) {
                core.setFailed('preview_url must be an HTTPS vercel.app URL.');
                return;
              }
              if (!/^[0-9a-f]{40}$/i.test(sha)) {
                core.setFailed('expected_sha must be a full 40-character commit SHA.');
                return;
              }
              core.setOutput('url', url);
              core.setOutput('sha', sha);
              core.info(`Manual replay target: ${url} @ ${sha}`);
              return;
            }

            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const expectedSha = context.sha;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            for (let attempt = 1; attempt <= 60; attempt += 1) {
              const deployments = await github.rest.repos.listDeployments({ owner, repo, sha: expectedSha, per_page: 30 });
              for (const deployment of deployments.data) {
                const statuses = await github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id: deployment.id, per_page: 30 });
                const status = statuses.data.find((candidate) => {
                  const url = candidate.environment_url || candidate.target_url || '';
                  return candidate.state === 'success' && /\.vercel\.app\/?$/i.test(url);
                });
                if (status) {
                  const url = (status.environment_url || status.target_url).replace(/\/$/, '');
                  core.setOutput('url', url);
                  core.setOutput('sha', expectedSha);
                  core.info(`Exact pre-merge replay target discovered on attempt ${attempt}: ${url} @ ${expectedSha}`);
                  return;
                }
              }
              if (attempt < 60) await sleep(5000);
            }
            core.setFailed(`No successful Vercel Preview was found for exact SHA ${expectedSha}.`);

      - name: Install PostgreSQL client for canonical document lookup
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Resolve unique canonical CR-008 document read-only
        id: document
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FINANCIAL_APP_DB_PASSWORD" || { echo 'FINANCIAL_APP_DB_PASSWORD secret is required'; exit 1; }
          echo "::add-mask::$FINANCIAL_APP_DB_PASSWORD"
          export PGPASSWORD="$FINANCIAL_APP_DB_PASSWORD"
          export PGSSLMODE=require
          export PGOPTIONS='-c default_transaction_read_only=on'

          direct_host="db.${FINANCIAL_APP_SUPABASE_PROJECT_REF}.supabase.co"
          pooler_host="aws-1-eu-west-3.pooler.supabase.com"
          selected_host=''
          selected_user=''

          if psql --host "$direct_host" --port 5432 --username postgres --dbname postgres --no-password --tuples-only --command 'select 1;' >/dev/null 2>&1; then
            selected_host="$direct_host"
            selected_user='postgres'
          else
            for attempt in 1 2 3 4 5; do
              if psql --host "$pooler_host" --port 5432 --username "postgres.${FINANCIAL_APP_SUPABASE_PROJECT_REF}" --dbname postgres --no-password --tuples-only --command 'select 1;' >/dev/null 2>&1; then
                selected_host="$pooler_host"
                selected_user="postgres.${FINANCIAL_APP_SUPABASE_PROJECT_REF}"
                break
              fi
              sleep 5
            done
          fi

          test -n "$selected_host" || { echo 'production_database_route_unavailable'; exit 1; }
          document_id="$(psql --host "$selected_host" --port 5432 --username "$selected_user" --dbname postgres --no-password \
            --no-align --tuples-only --set ON_ERROR_STOP=1 \
            --command "select id::text from financial_app.documents where workspace_id = '00000000-0000-4000-8000-000000000101'::uuid and size_bytes = 2258072 and lower(coalesce(mime_type, '')) = 'image/jpeg';")"
          match_count="$(printf '%s\n' "$document_id" | grep -Ec '^[0-9a-fA-F-]{36}$' || true)"
          test "$match_count" = '1' || { echo "canonical_document_match_count=$match_count"; exit 1; }
          [[ "$document_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]] || { echo 'canonical document id is not a UUID'; exit 1; }
          echo "::add-mask::$document_id"
          echo "document_id=$document_id" >> "$GITHUB_OUTPUT"
          echo 'canonical_document_resolution=unique_read_only_match'

      - name: Fail closed unless legitimate replay inputs exist
        env:
          PREVIEW_URL: ${{ steps.target.outputs.url }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          RESOLVED_DOCUMENT_ID: ${{ steps.document.outputs.document_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL" || { echo 'resolved preview URL is required'; exit 1; }
          test -n "$EXPECTED_SHA" || { echo 'resolved expected SHA is required'; exit 1; }
          test -n "$FINANCIAL_APP_QA_EMAIL" || { echo 'FINANCIAL_APP_QA_EMAIL secret is required'; exit 1; }
          test -n "$FINANCIAL_APP_QA_PASSWORD" || { echo 'FINANCIAL_APP_QA_PASSWORD secret is required'; exit 1; }
          test -n "$RESOLVED_DOCUMENT_ID" || { echo 'resolved canonical document id is required'; exit 1; }

      - name: Replay canonical document through real Financial App session
        env:
          PREVIEW_URL: ${{ steps.target.outputs.url }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          FINANCIAL_APP_CR008_DOCUMENT_ID: ${{ steps.document.outputs.document_id }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: bash scripts/cr008-authenticated-replay.sh

      - name: Upload sanitized replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: cr008-authenticated-replay-${{ steps.target.outputs.sha }}
          path: cr008-authenticated-replay-evidence.json
          retention-days: 30
          if-no-files-found: error
