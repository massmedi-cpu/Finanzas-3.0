name: CR008 Authenticated Replay

on:
  push:
    branches:
      - 'ci/cr008-authenticated-replay-gate'
    paths:
      - '.github/workflows/cr008-authenticated-replay.yml'
      - 'scripts/verify-authenticated-ocr-replay-contract.mjs'
      - 'scripts/cr008-authenticated-replay.sh'
      - 'docs/CR008_AUTHENTICATED_REPLAY.md'
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Exact protected Vercel Preview URL to certify'
        required: true
        type: string
      expected_sha:
        description: 'Exact 40-character commit SHA deployed in that Preview'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cr008-authenticated-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout gate source
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify authenticated replay contract
        run: |
          node scripts/verify-authenticated-ocr-replay-contract.mjs
          bash -n scripts/cr008-authenticated-replay.sh

      - name: Typecheck gate source
        run: npm run typecheck

  authenticated-replay:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[cr008-auth-replay]'))
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: read
      id-token: write
    env:
      FINANCIAL_APP_QA_EMAIL: ${{ secrets.FINANCIAL_APP_QA_EMAIL }}
      FINANCIAL_APP_QA_PASSWORD: ${{ secrets.FINANCIAL_APP_QA_PASSWORD }}
      FINANCIAL_APP_DB_PASSWORD: ${{ secrets.FINANCIAL_APP_DB_PASSWORD }}
      FINANCIAL_APP_SUPABASE_PROJECT_REF: btzukbfesxdratqnxuoj
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout gate source
        uses: actions/checkout@v6

      - name: Generate ephemeral GitHub OIDC token
        id: oidc
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Resolve exact replay target
        id: target
        uses: actions/github-script@v8
        env:
          INPUT_PREVIEW_URL: ${{ inputs.preview_url }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              const url = (process.env.INPUT_PREVIEW_URL || '').replace(/\/$/, '');
              const sha = process.env.INPUT_EXPECTED_SHA || '';
              if (!/^https:\/\/[A-Za-z0-9.-]+\.vercel\.app$/i.test(url)) {
                core.setFailed('preview_url must be an HTTPS vercel.app URL.');
                return;
              }
              if (!/^[0-9a-f]{40}$/i.test(sha)) {
                core.setFailed('expected_sha must be a full 40-character commit SHA.');
                return;
              }
              core.setOutput('url', url);
              core.setOutput('sha', sha);
              core.info(`Manual replay target: ${url} @ ${sha}`);
              return;
            }

            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const expectedSha = context.sha;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            for (let attempt = 1; attempt <= 60; attempt += 1) {
              const deployments = await github.rest.repos.listDeployments({ owner, repo, sha: expectedSha, per_page: 30 });
              for (const deployment of deployments.data) {
                const statuses = await github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id: deployment.id, per_page: 30 });
                const status = statuses.data.find((candidate) => {
                  const url = candidate.environment_url || candidate.target_url || '';
                  return candidate.state === 'success' && /\.vercel\.app\/?$/i.test(url);
                });
                if (status) {
                  const url = (status.environment_url || status.target_url).replace(/\/$/, '');
                  core.setOutput('url', url);
                  core.setOutput('sha', expectedSha);
                  core.info(`Exact pre-merge replay target discovered on attempt ${attempt}: ${url} @ ${expectedSha}`);
                  return;
                }
              }
              if (attempt < 60) await sleep(5000);
            }
            core.setFailed(`No successful Vercel Preview was found for exact SHA ${expectedSha}.`);

      - name: Install PostgreSQL client for safe QA lookup
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Resolve isolated QA identity and canonical document read-only
        id: context
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FINANCIAL_APP_DB_PASSWORD" || { echo 'FINANCIAL_APP_DB_PASSWORD secret is required'; exit 1; }
          test -n "$FINANCIAL_APP_QA_EMAIL" || { echo 'FINANCIAL_APP_QA_EMAIL secret is required'; exit 1; }
          test -n "$FINANCIAL_APP_QA_PASSWORD" || { echo 'FINANCIAL_APP_QA_PASSWORD secret is required'; exit 1; }
          [[ "$FINANCIAL_APP_QA_EMAIL" =~ ^[^@+]+\+financialapp-cr008-qa@gmail\.com$ ]] || { echo 'QA email must be the dedicated +financialapp-cr008-qa Gmail alias'; exit 1; }
          echo "::add-mask::$FINANCIAL_APP_DB_PASSWORD"
          export PGPASSWORD="$FINANCIAL_APP_DB_PASSWORD"
          export PGSSLMODE=require
          export PGOPTIONS='-c default_transaction_read_only=on'

          direct_host="db.${FINANCIAL_APP_SUPABASE_PROJECT_REF}.supabase.co"
          pooler_host="aws-1-eu-west-3.pooler.supabase.com"
          selected_host=''
          selected_user=''
          if psql --host "$direct_host" --port 5432 --username postgres --dbname postgres --no-password --tuples-only --command 'select 1;' >/dev/null 2>&1; then
            selected_host="$direct_host"
            selected_user='postgres'
          else
            for attempt in 1 2 3 4 5; do
              if psql --host "$pooler_host" --port 5432 --username "postgres.${FINANCIAL_APP_SUPABASE_PROJECT_REF}" --dbname postgres --no-password --tuples-only --command 'select 1;' >/dev/null 2>&1; then
                selected_host="$pooler_host"
                selected_user="postgres.${FINANCIAL_APP_SUPABASE_PROJECT_REF}"
                break
              fi
              sleep 5
            done
          fi
          test -n "$selected_host" || { echo 'production_database_route_unavailable'; exit 1; }

          qa_user_id="$(psql --host "$selected_host" --port 5432 --username "$selected_user" --dbname postgres --no-password \
            --no-align --tuples-only --set ON_ERROR_STOP=1 --set qa_email="$FINANCIAL_APP_QA_EMAIL" \
            --command "select id::text from auth.users where lower(email) = lower(:'qa_email');")"
          qa_count="$(printf '%s\n' "$qa_user_id" | grep -Ec '^[0-9a-fA-F-]{36}$' || true)"
          test "$qa_count" = '1' || { echo "qa_auth_identity_match_count=$qa_count"; exit 1; }
          echo "::add-mask::$qa_user_id"

          active_allowlist="$(psql --host "$selected_host" --port 5432 --username "$selected_user" --dbname postgres --no-password --no-align --tuples-only --set ON_ERROR_STOP=1 \
            --command "select count(*) from financial_app.authorized_users where user_id = '$qa_user_id'::uuid and active;")"
          active_memberships="$(psql --host "$selected_host" --port 5432 --username "$selected_user" --dbname postgres --no-password --no-align --tuples-only --set ON_ERROR_STOP=1 \
            --command "select count(*) from financial_app.workspace_memberships where user_id = '$qa_user_id'::uuid and active;")"
          test "$active_allowlist" = '0' || { echo 'QA identity must be inactive before replay'; exit 1; }
          test "$active_memberships" = '0' || { echo 'QA identity must have no active workspace membership before replay'; exit 1; }

          document_id="$(psql --host "$selected_host" --port 5432 --username "$selected_user" --dbname postgres --no-password \
            --no-align --tuples-only --set ON_ERROR_STOP=1 \
            --command "select id::text from financial_app.documents where workspace_id = '00000000-0000-4000-8000-000000000101'::uuid and size_bytes = 2258072 and lower(coalesce(mime_type, '')) = 'image/jpeg';")"
          document_count="$(printf '%s\n' "$document_id" | grep -Ec '^[0-9a-fA-F-]{36}$' || true)"
          test "$document_count" = '1' || { echo "canonical_document_match_count=$document_count"; exit 1; }
          echo "::add-mask::$document_id"

          echo "db_host=$selected_host" >> "$GITHUB_OUTPUT"
          echo "db_user=$selected_user" >> "$GITHUB_OUTPUT"
          echo "qa_user_id=$qa_user_id" >> "$GITHUB_OUTPUT"
          echo "document_id=$document_id" >> "$GITHUB_OUTPUT"
          echo 'qa_context_resolution=isolated_read_only_success'

      - name: Temporarily authorize QA identity for the replay only
        id: authorize
        env:
          DB_HOST: ${{ steps.context.outputs.db_host }}
          DB_USER: ${{ steps.context.outputs.db_user }}
          QA_USER_ID: ${{ steps.context.outputs.qa_user_id }}
        shell: bash
        run: |
          set -euo pipefail
          unset PGOPTIONS
          export PGPASSWORD="$FINANCIAL_APP_DB_PASSWORD"
          export PGSSLMODE=require
          psql --host "$DB_HOST" --port 5432 --username "$DB_USER" --dbname postgres --no-password --set ON_ERROR_STOP=1 --set qa_user_id="$QA_USER_ID" <<'SQL'
          begin;
          insert into financial_app.authorized_users(user_id, active)
          values (:'qa_user_id'::uuid, true)
          on conflict (user_id) do update set active = true, updated_at = now();
          insert into financial_app.workspace_memberships(workspace_id, user_id, role, active, is_default)
          values ('00000000-0000-4000-8000-000000000101'::uuid, :'qa_user_id'::uuid, 'member', true, true)
          on conflict (workspace_id, user_id) do update
            set role = 'member', active = true, is_default = true, updated_at = now();
          commit;
          SQL
          echo 'activated=true' >> "$GITHUB_OUTPUT"
          echo 'qa_authorization=temporary_active'

      - name: Replay canonical document through real Financial App session
        env:
          PREVIEW_URL: ${{ steps.target.outputs.url }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          FINANCIAL_APP_CR008_DOCUMENT_ID: ${{ steps.context.outputs.document_id }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: bash scripts/cr008-authenticated-replay.sh

      - name: Upload sanitized replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: cr008-authenticated-replay-${{ steps.target.outputs.sha }}
          path: cr008-authenticated-replay-evidence.json
          retention-days: 30
          if-no-files-found: error

      - name: Revoke QA app authorization even when replay fails
        if: always() && steps.authorize.outputs.activated == 'true'
        env:
          DB_HOST: ${{ steps.context.outputs.db_host }}
          DB_USER: ${{ steps.context.outputs.db_user }}
          QA_USER_ID: ${{ steps.context.outputs.qa_user_id }}
        shell: bash
        run: |
          set -euo pipefail
          unset PGOPTIONS
          export PGPASSWORD="$FINANCIAL_APP_DB_PASSWORD"
          export PGSSLMODE=require
          psql --host "$DB_HOST" --port 5432 --username "$DB_USER" --dbname postgres --no-password --set ON_ERROR_STOP=1 --set qa_user_id="$QA_USER_ID" <<'SQL'
          begin;
          update financial_app.workspace_memberships
             set active = false, is_default = false, updated_at = now()
           where user_id = :'qa_user_id'::uuid
             and workspace_id = '00000000-0000-4000-8000-000000000101'::uuid;
          update financial_app.authorized_users
             set active = false, updated_at = now()
           where user_id = :'qa_user_id'::uuid;
          commit;
          SQL
          export PGOPTIONS='-c default_transaction_read_only=on'
          active_allowlist="$(psql --host "$DB_HOST" --port 5432 --username "$DB_USER" --dbname postgres --no-password --no-align --tuples-only --command "select count(*) from financial_app.authorized_users where user_id = '$QA_USER_ID'::uuid and active;")"
          active_memberships="$(psql --host "$DB_HOST" --port 5432 --username "$DB_USER" --dbname postgres --no-password --no-align --tuples-only --command "select count(*) from financial_app.workspace_memberships where user_id = '$QA_USER_ID'::uuid and active;")"
          test "$active_allowlist" = '0'
          test "$active_memberships" = '0'
          echo 'qa_authorization=revoked_verified'
