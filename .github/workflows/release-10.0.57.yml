name: Release 10.0.57

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/app-shell.tsx"
      - "app/mobile-navigation.tsx"
      - "app/global-search.tsx"
      - "app/pwa-install-button.tsx"
      - "src/design/product-icons.tsx"
      - "scripts/verify-product-icon-system.mjs"
      - "docs/precommercial-audit/07e-iconography-system-10.0.57.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release-10.0.57.yml"

permissions:
  contents: read

concurrency:
  group: release-10.0.57-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Require exact 10.0.57 package identity
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='10.0.57'||l.version!=='10.0.57'||l.packages[''].version!=='10.0.57'){console.error({package:p.version,lock:l.version,root:l.packages[''].version});process.exit(1)}"

      - name: Product icon system guard
        run: npm run verify:product-icons

      - name: Responsive breakpoint governance
        run: npm run verify:responsive-breakpoints

      - name: Semantic design token guard
        run: npm run verify:semantic-design

      - name: Premium design guard
        run: npm run verify:premium-design

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive and mobile navigation regression
        run: npm run test:responsive-matrix

      - name: Global search regression
        run: npx playwright test tests/e2e/global-search.spec.ts --project=chromium-desktop --project=chromium-mobile --workers=2
