name: Sync package lock version
on:
  push:
    branches: [financial-app-rebuild]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: financial-app-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align package-lock version only
        run: |
          VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          if [ "$VERSION" = "$LOCK_VERSION" ]; then
            echo "package-lock already aligned: $VERSION"
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(1.8): align lockfile metadata"
          git push origin HEAD:financial-app-rebuild
