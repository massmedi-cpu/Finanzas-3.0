name: Financial App Production Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: financial-app-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production responds
        env:
          BASE_URL: https://finanzas-3-0.vercel.app
        run: |
          for attempt in $(seq 1 60); do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' -L --max-redirs 2 "$BASE_URL/login" || true)
            if [ "$code" = "200" ]; then
              grep -qi "Financial App" /tmp/body && exit 0
            fi
            sleep 2
          done
          echo "Production smoke failed"
          cat /tmp/body || true
          exit 1
