name: Finanzas 3.0 Production Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finanzas-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify deployed production
        env:
          SMOKE_BASE_URL: https://finanzas-3-0.vercel.app
          SMOKE_ATTEMPTS: '180'
          SMOKE_INTERVAL_MS: '1000'
        run: npm run test:smoke
