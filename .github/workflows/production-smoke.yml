name: Production smoke

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://financialapp-home.vercel.app
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v6

      - name: Resolve expected production version
        shell: bash
        run: |
          set -euo pipefail
          expected=$(sed -nE 's/^export const APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)" as const;$/\1/p' lib/app-version.ts)
          test -n "$expected"
          echo "EXPECTED_VERSION=$expected" >> "$GITHUB_ENV"

      - name: Wait for exact production version
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            code=$(curl -sS -D /tmp/version-headers -o /tmp/login-body -w '%{http_code}' --max-time 15 "$BASE_URL/login" || true)
            deployed=$(awk 'BEGIN{IGNORECASE=1} /^x-financial-app-version:/ {gsub("\r",""); print $2}' /tmp/version-headers | tail -n 1)
            if [ "$code" = "200" ] && [ "$deployed" = "$EXPECTED_VERSION" ]; then
              ready=1
              break
            fi
            echo "Esperando Financial App $EXPECTED_VERSION · HTTP $code · versión ${deployed:-sin-cabecera}"
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "Production did not reach Financial App $EXPECTED_VERSION"
            exit 1
          fi
          grep -Fq "Continuar con Google" /tmp/login-body

      - name: Verify protected application routes
        shell: bash
        run: |
          set -euo pipefail
          check_redirect() {
            path="$1"
            code=$(curl -sS -D /tmp/headers -o /tmp/body -w '%{http_code}' --max-redirs 0 --max-time 15 "$BASE_URL$path" || true)
            if [ "$code" != "307" ] && [ "$code" != "308" ]; then
              echo "Expected auth redirect for $path, got $code"
              cat /tmp/body
              exit 1
            fi
            grep -Eqi '^location: .*/login' /tmp/headers || { echo "Missing login redirect for $path"; cat /tmp/headers; exit 1; }
            grep -Eqi "^x-financial-app-version: ${EXPECTED_VERSION}\r?$" /tmp/headers || { echo "Wrong production version for $path"; cat /tmp/headers; exit 1; }
          }
          for path in / /cash-flow /movimientos /analisis /archivo /configuracion; do
            check_redirect "$path"
          done

      - name: Verify private API boundary
        shell: bash
        run: |
          set -euo pipefail
          check_api_unauthorized() {
            path="$1"
            code=$(curl -sS -D /tmp/api-headers -o /tmp/body -w '%{http_code}' --max-time 15 "$BASE_URL$path" || true)
            if [ "$code" != "401" ]; then
              echo "Expected 401 for $path, got $code"
              cat /tmp/body
              exit 1
            fi
            grep -q '"error":"unauthorized"' /tmp/body || { echo "Unexpected unauthorized payload for $path"; cat /tmp/body; exit 1; }
            grep -Eqi "^x-financial-app-version: ${EXPECTED_VERSION}\r?$" /tmp/api-headers || { echo "Wrong API version for $path"; cat /tmp/api-headers; exit 1; }
          }
          for path in /api/archive /api/settings /api/forecast /api/control/matching-quality /api/intelligence; do
            check_api_unauthorized "$path"
          done

      - name: Smoke gate passed
        run: echo "Production smoke OK · Financial App $EXPECTED_VERSION · dominio canónico, cinco rutas principales, configuración y APIs privadas verificadas."
