name: Production smoke

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify production surface
        env:
          BASE_URL: https://finanzas-3-0.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            code=$(curl -sS -o /tmp/login-body -w '%{http_code}' --max-time 15 "$BASE_URL/login" || true)
            if [ "$code" = "200" ]; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "Production login did not become ready"
            exit 1
          fi

          check_redirect() {
            path="$1"
            code=$(curl -sS -D /tmp/headers -o /tmp/body -w '%{http_code}' --max-redirs 0 --max-time 15 "$BASE_URL$path" || true)
            if [ "$code" != "307" ] && [ "$code" != "308" ]; then
              echo "Expected auth redirect for $path, got $code"
              cat /tmp/body
              exit 1
            fi
            if ! grep -Eqi '^location: .*/login' /tmp/headers; then
              echo "Missing login redirect for $path"
              cat /tmp/headers
              exit 1
            fi
          }

          check_api_unauthorized() {
            path="$1"
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 15 "$BASE_URL$path" || true)
            if [ "$code" != "401" ]; then
              echo "Expected 401 for $path, got $code"
              cat /tmp/body
              exit 1
            fi
            if ! grep -q '"error":"unauthorized"' /tmp/body; then
              echo "Unexpected unauthorized payload for $path"
              cat /tmp/body
              exit 1
            fi
          }

          for path in / /movimientos /prevision /archivo /ajustes; do
            check_redirect "$path"
          done
          for path in /api/archive /api/settings /api/forecast /api/control/matching-quality; do
            check_api_unauthorized "$path"
          done

          preview_code=$(curl -sS -o /tmp/preview-auth-body -w '%{http_code}' --max-time 15 "$BASE_URL/auth/preview?token=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx&next=%2Fapi%2Frelease-probe" || true)
          if [ "$preview_code" != "404" ]; then
            echo "Expected preview auth to stay disabled in production, got $preview_code"
            cat /tmp/preview-auth-body
            exit 1
          fi

          echo "Production smoke passed: login, protected routes, API auth contract, matching-quality API and preview-only E2E boundary are healthy."
