name: Production smoke

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://financialapp-home.vercel.app
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v6

      - name: Resolve expected production version
        shell: bash
        run: |
          set -euo pipefail
          expected=$(sed -nE 's/^export const APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)" as const;$/\1/p' lib/app-version.ts)
          test -n "$expected"
          echo "EXPECTED_VERSION=$expected" >> "$GITHUB_ENV"

      - name: Wait for globally consistent production version
        shell: bash
        run: |
          set -euo pipefail
          version_from_headers() {
            awk 'BEGIN{IGNORECASE=1} /^x-financial-app-version:/ {gsub("\r",""); print $2}' "$1" | tail -n 1
          }
          login_ready() {
            code=$(curl -sS -H 'Cache-Control: no-cache' -D /tmp/version-headers -o /tmp/login-body -w '%{http_code}' --max-time 15 "$BASE_URL/login" || true)
            deployed=$(version_from_headers /tmp/version-headers)
            [ "$code" = "200" ] && [ "$deployed" = "$EXPECTED_VERSION" ] && grep -Fq "Continuar con Google" /tmp/login-body
          }
          route_ready() {
            path="$1"
            code=$(curl -sS -H 'Cache-Control: no-cache' -D /tmp/route-headers -o /tmp/route-body -w '%{http_code}' --max-redirs 0 --max-time 15 "$BASE_URL$path" || true)
            deployed=$(version_from_headers /tmp/route-headers)
            ([ "$code" = "307" ] || [ "$code" = "308" ]) \
              && grep -Eqi '^location: .*/login' /tmp/route-headers \
              && [ "$deployed" = "$EXPECTED_VERSION" ]
          }
          api_ready() {
            path="$1"
            code=$(curl -sS -H 'Cache-Control: no-cache' -D /tmp/api-headers -o /tmp/api-body -w '%{http_code}' --max-time 15 "$BASE_URL$path" || true)
            deployed=$(version_from_headers /tmp/api-headers)
            [ "$code" = "401" ] \
              && grep -q '"error":"unauthorized"' /tmp/api-body \
              && [ "$deployed" = "$EXPECTED_VERSION" ]
          }
          ocr_api_ready() {
            code=$(curl -sS -X POST -H 'Cache-Control: no-cache' -H 'Content-Type: image/jpeg' -D /tmp/ocr-headers -o /tmp/ocr-body -w '%{http_code}' --data-binary '' --max-time 15 "$BASE_URL/api/ocr/receipt" || true)
            deployed=$(version_from_headers /tmp/ocr-headers)
            [ "$code" = "401" ] \
              && grep -q '"error":"unauthorized"' /tmp/ocr-body \
              && [ "$deployed" = "$EXPECTED_VERSION" ]
          }

          stable_passes=0
          for attempt in $(seq 1 60); do
            coherent=1

            login_ready || coherent=0
            for path in / /cash-flow /movimientos /analisis /prevision /archivo /configuracion; do
              route_ready "$path" || coherent=0
            done
            for path in /api/archive /api/settings /api/forecast /api/control/matching-quality /api/intelligence; do
              api_ready "$path" || coherent=0
            done
            ocr_api_ready || coherent=0

            if [ "$coherent" = "1" ]; then
              stable_passes=$((stable_passes + 1))
              echo "Producción coherente · Financial App $EXPECTED_VERSION · pasada estable $stable_passes/2"
              if [ "$stable_passes" -ge 2 ]; then
                break
              fi
              sleep 2
            else
              stable_passes=0
              echo "Esperando propagación global de Financial App $EXPECTED_VERSION · intento $attempt/60"
              sleep 5
            fi
          done

          if [ "$stable_passes" -lt 2 ]; then
            echo "Production did not become globally consistent on Financial App $EXPECTED_VERSION"
            exit 1
          fi

      - name: Verify protected application routes
        shell: bash
        run: |
          set -euo pipefail
          version_from_headers() {
            awk 'BEGIN{IGNORECASE=1} /^x-financial-app-version:/ {gsub("\r",""); print $2}' "$1" | tail -n 1
          }
          check_redirect() {
            path="$1"
            code=$(curl -sS -H 'Cache-Control: no-cache' -D /tmp/headers -o /tmp/body -w '%{http_code}' --max-redirs 0 --max-time 15 "$BASE_URL$path" || true)
            if [ "$code" != "307" ] && [ "$code" != "308" ]; then
              echo "Expected auth redirect for $path, got $code"
              cat /tmp/body
              exit 1
            fi
            grep -Eqi '^location: .*/login' /tmp/headers || { echo "Missing login redirect for $path"; cat /tmp/headers; exit 1; }
            deployed=$(version_from_headers /tmp/headers)
            [ "$deployed" = "$EXPECTED_VERSION" ] || { echo "Wrong production version for $path: ${deployed:-missing}"; cat /tmp/headers; exit 1; }
          }
          for path in / /cash-flow /movimientos /analisis /prevision /archivo /configuracion; do
            check_redirect "$path"
          done

      - name: Verify installable PWA assets
        shell: bash
        run: |
          set -euo pipefail
          version_from_headers() {
            awk 'BEGIN{IGNORECASE=1} /^x-financial-app-version:/ {gsub("\r",""); print $2}' "$1" | tail -n 1
          }
          fetch_asset() {
            path="$1"
            output="$2"
            expected_type="$3"
            code=$(curl -sS -H 'Cache-Control: no-cache' -D /tmp/pwa-headers -o "$output" -w '%{http_code}' --max-time 20 "$BASE_URL$path" || true)
            [ "$code" = "200" ] || { echo "Expected 200 for $path, got $code"; exit 1; }
            grep -Eqi "^content-type: ${expected_type}" /tmp/pwa-headers || { echo "Wrong content type for $path"; cat /tmp/pwa-headers; exit 1; }
            deployed=$(version_from_headers /tmp/pwa-headers)
            [ "$deployed" = "$EXPECTED_VERSION" ] || { echo "Wrong PWA asset version for $path: ${deployed:-missing}"; exit 1; }
          }

          fetch_asset /manifest.webmanifest /tmp/manifest.webmanifest 'application/manifest\+json'
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest=JSON.parse(readFileSync('/tmp/manifest.webmanifest','utf8'));
          const expected=[
            ['/icons/icon-192.png','192x192','maskable'],
            ['/icons/icon-512.png','512x512','maskable'],
            ['/icons/icon-192.png','192x192','any'],
            ['/icons/icon-512.png','512x512','any'],
          ];
          if(manifest.name!=='Financial App'||manifest.display!=='standalone'||manifest.start_url!=='/') throw new Error('Manifest PWA incompleto');
          for(const [src,sizes,purpose] of expected){
            if(!manifest.icons?.some(icon=>icon.src===src&&icon.sizes===sizes&&icon.type==='image/png'&&icon.purpose===purpose)) throw new Error(`Falta icono PWA ${src} ${sizes} ${purpose}`);
          }
          NODE

          fetch_asset /icon.png /tmp/icon-512-meta.png 'image/png'
          fetch_asset /apple-icon.png /tmp/icon-180.png 'image/png'
          fetch_asset /icons/icon-192.png /tmp/icon-192.png 'image/png'
          fetch_asset /icons/icon-512.png /tmp/icon-512-manifest.png 'image/png'
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const expected=[
            ['/tmp/icon-512-meta.png',512,512],
            ['/tmp/icon-180.png',180,180],
            ['/tmp/icon-192.png',192,192],
            ['/tmp/icon-512-manifest.png',512,512],
          ];
          for(const [path,width,height] of expected){
            const file=readFileSync(path);
            if(file.subarray(0,8).toString('hex')!=='89504e470d0a1a0a'||file.readUInt32BE(16)!==width||file.readUInt32BE(20)!==height) throw new Error(`${path} no es PNG ${width}x${height}`);
          }
          if(!readFileSync('/tmp/icon-512-meta.png').equals(readFileSync('/tmp/icon-512-manifest.png'))) throw new Error('Los iconos 512 de metadata y manifest no coinciden');
          NODE

          code=$(curl -sS -D /tmp/favicon-headers -o /dev/null -w '%{http_code}' --max-redirs 0 --max-time 20 "$BASE_URL/favicon.ico" || true)
          ([ "$code" = "307" ] || [ "$code" = "308" ]) || { echo "Expected favicon redirect, got $code"; exit 1; }
          grep -Eqi '^location: .*/icon.png' /tmp/favicon-headers || { echo 'Favicon no redirige al icono canónico'; cat /tmp/favicon-headers; exit 1; }

      - name: Verify private API boundary
        shell: bash
        run: |
          set -euo pipefail
          version_from_headers() {
            awk 'BEGIN{IGNORECASE=1} /^x-financial-app-version:/ {gsub("\r",""); print $2}' "$1" | tail -n 1
          }
          check_api_unauthorized() {
            path="$1"
            code=$(curl -sS -H 'Cache-Control: no-cache' -D /tmp/api-headers -o /tmp/body -w '%{http_code}' --max-time 15 "$BASE_URL$path" || true)
            if [ "$code" != "401" ]; then
              echo "Expected 401 for $path, got $code"
              cat /tmp/body
              exit 1
            fi
            grep -q '"error":"unauthorized"' /tmp/body || { echo "Unexpected unauthorized payload for $path"; cat /tmp/body; exit 1; }
            deployed=$(version_from_headers /tmp/api-headers)
            [ "$deployed" = "$EXPECTED_VERSION" ] || { echo "Wrong API version for $path: ${deployed:-missing}"; cat /tmp/api-headers; exit 1; }
          }
          check_ocr_api_unauthorized() {
            code=$(curl -sS -X POST -H 'Cache-Control: no-cache' -H 'Content-Type: image/jpeg' -D /tmp/ocr-headers -o /tmp/ocr-body -w '%{http_code}' --data-binary '' --max-time 15 "$BASE_URL/api/ocr/receipt" || true)
            if [ "$code" != "401" ]; then
              echo "Expected 401 for /api/ocr/receipt, got $code"
              cat /tmp/ocr-body
              exit 1
            fi
            grep -q '"error":"unauthorized"' /tmp/ocr-body || { echo "Unexpected unauthorized OCR payload"; cat /tmp/ocr-body; exit 1; }
            deployed=$(version_from_headers /tmp/ocr-headers)
            [ "$deployed" = "$EXPECTED_VERSION" ] || { echo "Wrong API version for /api/ocr/receipt: ${deployed:-missing}"; cat /tmp/ocr-headers; exit 1; }
          }
          for path in /api/archive /api/settings /api/forecast /api/control/matching-quality /api/intelligence; do
            check_api_unauthorized "$path"
          done
          check_ocr_api_unauthorized

      - name: Smoke gate passed
        run: echo "Production smoke OK · Financial App $EXPECTED_VERSION · propagación global estable, PWA instalable, dominio canónico, rutas privadas, APIs y bundle OCR verificados."
