name: Apply Version 10.0.55

on:
  push:
    branches:
      - release/10.0.55-semantic-tokens
    paths:
      - .github/workflows/apply-version-10.0.55.yml

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/10.0.55-semantic-tokens
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Align package version
        shell: bash
        run: |
          set -euo pipefail
          npm version 10.0.55 --no-git-tag-version
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='10.0.55'||l.version!=='10.0.55'||l.packages?.['']?.version!=='10.0.55') process.exit(1)"
          git diff --check

      - name: Commit aligned version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): version Financial App 10.0.55"
          git push origin HEAD:release/10.0.55-semantic-tokens
