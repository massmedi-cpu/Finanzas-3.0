name: Temp Apply Premium Editor

on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-apply-premium-editor.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/premium-movement-editor-20260914
          fetch-depth: 0
      - name: Apply source transformation
        run: python scripts/temp-apply-premium-editor.py
      - name: Validate source contract
        shell: bash
        run: |
          git diff --check
          grep -q '"category subcategory type review"' app/transactions/transactions.module.css
          grep -q 'width: 1.15rem; height: 1.15rem' app/transactions/transactions.module.css
          grep -q 'Mantener valor actual' app/transactions/transactions-client.tsx
          grep -q 'Restaurar clasificación detectada' app/transactions/transactions-client.tsx
          ! grep -q 'Automático/original' app/transactions/transactions-client.tsx
          ! grep -q 'Automática/original' app/transactions/transactions-client.tsx
      - name: Commit target branch
        shell: bash
        run: |
          rm scripts/temp-apply-premium-editor.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ui(transactions): rediseñar editor premium y compacto'
          git push origin HEAD:ui/premium-movement-editor-20260914
