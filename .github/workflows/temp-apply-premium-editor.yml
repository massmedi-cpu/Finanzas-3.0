# trigger: apply premium editor to target branch
name: Temp Apply Premium Editor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-apply-premium-editor.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ui/premium-movement-editor-20260914
          fetch-depth: 0

      - name: Apply premium transaction editor source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          client_path = Path('app/transactions/transactions-client.tsx')
          s = client_path.read_text()

          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'No encontrado en TSX: {label}')
              s = s.replace(old, new, 1)

          once(
              '<div className={styles.editorHeading}><div><strong>Editar movimiento</strong><span>La categoría se asigna automáticamente hasta que tú la cambias.</span></div><button className={styles.secondaryButton} type="button" onClick={cancelEdit} disabled={saving}>Cancelar</button></div>',
              '<div className={styles.editorHeading}><strong>Editar movimiento</strong></div>',
              'editor heading',
          )

          once('<label className={styles.editorWide}>\n                              <span>Concepto</span>', '<label className={`${styles.editorField} ${styles.conceptField}`}>\n                              <span>Concepto</span>', 'concept field')
          once('<label><span>Comercio</span><select value={editor.merchant}', '<label className={`${styles.editorField} ${styles.merchantField}`}><span>Comercio</span><select value={editor.merchant}', 'merchant field')
          once('<label><span>Categoría</span><select data-testid="edit-category-root"', '<label className={`${styles.editorField} ${styles.categoryField}`}><span>Categoría</span><select data-testid="edit-category-root"', 'category field')
          once('<label><span>Subcategoría</span><select data-testid="edit-subcategory"', '<label className={`${styles.editorField} ${styles.subcategoryField}`}><span>Subcategoría</span><select data-testid="edit-subcategory"', 'subcategory field')
          once('<label><span>Tipo</span><select value={editor.kind}', '<label className={`${styles.editorField} ${styles.typeField}`}><span>Tipo</span><select value={editor.kind}', 'type field')
          once('<label><span>Revisión</span><select data-testid="edit-review"', '<label className={`${styles.editorField} ${styles.reviewField}`}><span>Revisión</span><select data-testid="edit-review"', 'review field')
          once('<label className={styles.editorWide}><span>Nota</span><textarea', '<label className={`${styles.editorField} ${styles.noteField}`}><span>Nota</span><textarea', 'note field')
          once('<label className={styles.checkboxLabel}><input type="checkbox"', '<label className={`${styles.checkboxLabel} ${styles.analyticsField}`}><input type="checkbox"', 'analytics field')

          once(
              '<label className={`${styles.editorField} ${styles.merchantField}`}><span>Comercio</span><select value={editor.merchant} onChange={(event) => setEditor({ ...editor, merchant: event.target.value })}><option value={INHERIT}>Automático/original</option>',
              '<label className={`${styles.editorField} ${styles.merchantField}`}><span>Comercio</span><select value={editor.merchant} onChange={(event) => setEditor({ ...editor, merchant: event.target.value })}><option value={INHERIT}>{row.overriddenFields.includes("merchant") ? "Restaurar valor detectado" : "Mantener valor actual"}</option>',
              'merchant inherit label',
          )
          once(
              '<label className={`${styles.editorField} ${styles.typeField}`}><span>Tipo</span><select value={editor.kind} disabled={Boolean(row.transferPairId)} onChange={(event) => setEditor({ ...editor, kind: event.target.value })}><option value={INHERIT}>Automático/original</option>',
              '<label className={`${styles.editorField} ${styles.typeField}`}><span>Tipo</span><select value={editor.kind} disabled={Boolean(row.transferPairId)} onChange={(event) => setEditor({ ...editor, kind: event.target.value })}><option value={INHERIT}>{row.overriddenFields.includes("kind") ? "Restaurar valor detectado" : "Mantener valor actual"}</option>',
              'type inherit label',
          )
          once(
              '<label className={`${styles.editorField} ${styles.reviewField}`}><span>Revisión</span><select data-testid="edit-review" value={editor.reviewState} onChange={(event) => setEditor({ ...editor, reviewState: event.target.value })}><option value={INHERIT}>Automática/original</option>',
              '<label className={`${styles.editorField} ${styles.reviewField}`}><span>Revisión</span><select data-testid="edit-review" value={editor.reviewState} onChange={(event) => setEditor({ ...editor, reviewState: event.target.value })}><option value={INHERIT}>{row.overriddenFields.includes("reviewState") ? "Restaurar valor detectado" : "Mantener valor actual"}</option>',
              'review inherit label',
          )
          once(
              '<small>{editor.categoryMode === "inherit" ? "Asignación automática" : "Asignación manual"}</small>',
              '<small className={styles.assignmentHint}>{editor.categoryMode === "inherit" ? "Origen: clasificación detectada" : "Origen: ajuste manual"}</small>',
              'category origin hint',
          )

          start = s.index('<div className={`${styles.editorWide} ${styles.categoryAssignment}`}>')
          end = s.index('\n                            <label className={`${styles.editorField} ${styles.typeField}`}>', start)
          assignment = '''<div className={styles.categoryAssignment}>
                    <small>Clasificación detectada: {row.category.originalName ?? "Sin categoría"}</small>
                    {editor.categoryMode === "set" ? <button data-testid="reset-category-auto" className={styles.secondaryButton} type="button" disabled={saving} onClick={() => {
                      const automatic = categorySelectionFor(facets.categories, row.category.originalId);
                      setEditor({ ...editor, categoryMode: "inherit", categoryRoot: automatic.root, categoryLeaf: automatic.leaf });
                      setCategoryError("");
                    }}>Restaurar clasificación detectada</button> : null}
                  </div>'''
          s = s[:start] + assignment + s[end:]

          once(
              '<div className={styles.editorActions}><button data-testid="save-edit" className={styles.primaryButton} type="button" onClick={() => void saveEdit(row)} disabled={saving}>{saving ? "Guardando…" : "Guardar cambios"}</button></div>',
              '<div className={styles.editorActions}><button className={styles.secondaryButton} type="button" onClick={cancelEdit} disabled={saving}>Cancelar</button><button data-testid="save-edit" className={styles.primaryButton} type="button" onClick={() => void saveEdit(row)} disabled={saving}>{saving ? "Guardando…" : "Guardar cambios"}</button></div>',
              'editor actions',
          )

          client_path.write_text(s)

          css_path = Path('app/transactions/transactions.module.css')
          css = css_path.read_text()

          old_checkbox = '.selectCell input, .checkboxLabel input { width: 2.75rem; height: 2.75rem; margin: 0; cursor: pointer; accent-color: #4d8dff; }'
          new_checkbox = '.selectCell input, .checkboxLabel input { width: 1.15rem; height: 1.15rem; min-width: 1.15rem; margin: 0; cursor: pointer; accent-color: #4d8dff; }'
          if old_checkbox not in css:
              raise SystemExit('No encontrado en CSS: checkbox sizing')
          css = css.replace(old_checkbox, new_checkbox, 1)

          start = css.index('.editorHeading {')
          end = css.index('\n\n.reviewNotice', start)
          premium = '''.editorHeading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  margin-bottom: .8rem;
  padding-bottom: .72rem;
  border-bottom: 1px solid rgba(137, 173, 255, .1);
}
.editorHeading strong { color: #f3f7ff; font-size: 1rem; letter-spacing: -.015em; }
.editorGrid {
  display: grid;
  grid-template-columns: minmax(0, 2.25fr) minmax(0, 2.25fr) minmax(0, 1.35fr) minmax(0, 1.35fr);
  grid-template-areas:
    "concept concept concept merchant"
    "category subcategory type review"
    "note note note analytics"
    "assignment assignment assignment assignment";
  align-items: start;
  gap: .78rem .85rem;
}
.editorField { display: grid !important; min-width: 0; grid-template-rows: auto minmax(2.75rem, auto) auto; align-content: start; gap: .34rem !important; }
.editorField > span { min-height: 1.1rem; display: flex; align-items: flex-end; color: #b8c6df; line-height: 1.15; }
.conceptField { grid-area: concept; }
.merchantField { grid-area: merchant; }
.categoryField { grid-area: category; }
.subcategoryField { grid-area: subcategory; }
.typeField { grid-area: type; }
.reviewField { grid-area: review; }
.noteField { grid-area: note; }
.analyticsField { grid-area: analytics; }
.editor input, .editor select { min-height: 2.75rem; height: 2.75rem; }
.noteField textarea { min-height: 4.75rem; height: 4.75rem; resize: vertical; }
.assignmentHint { min-height: 1.1rem; }
.categoryAssignment {
  grid-area: assignment;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  min-width: 0;
  padding-top: .15rem;
}
.categoryAssignment small { min-width: 0; color: var(--color-text-muted); font-size: .84rem; font-weight: 600; line-height: 1.35; }
.categoryAssignment button { flex: 0 0 auto; min-height: 2.35rem; padding: .42rem .72rem; font-size: .84rem; }
.checkboxLabel {
  display: flex !important;
  align-items: center;
  justify-content: flex-start;
  align-self: stretch;
  gap: .55rem !important;
  min-height: 4.75rem;
  padding-top: 1.4rem;
  color: #dce5f6;
  font-size: var(--font-label);
  font-weight: 720;
}
.checkboxLabel input { flex: 0 0 1.15rem; }
.checkboxLabel > span { color: #b8c6df; line-height: 1.25; }
.editorActions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: .55rem;
  margin-top: .8rem;
  padding-top: .78rem;
  border-top: 1px solid rgba(137, 173, 255, .1);
}
.editorActions button { min-width: 8.5rem; }
'''
          css = css[:start] + premium + css[end:]

          old_1180 = '  .editorGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }'
          new_1180 = '''  .editorGrid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-areas:
      "concept concept"
      "merchant merchant"
      "category subcategory"
      "type review"
      "note note"
      "analytics analytics"
      "assignment assignment";
  }
  .checkboxLabel { min-height: 2.75rem; padding-top: 0; }'''
          if old_1180 not in css:
              raise SystemExit('No encontrado en CSS: editor 1180')
          css = css.replace(old_1180, new_1180, 1)

          old_600 = '  .editorGrid { grid-template-columns: 1fr; }\n  .editorWide { grid-column: auto; }'
          new_600 = '''  .editorGrid {
    grid-template-columns: 1fr;
    grid-template-areas:
      "concept"
      "merchant"
      "category"
      "subcategory"
      "type"
      "review"
      "note"
      "analytics"
      "assignment";
  }
  .editorWide { grid-column: auto; }
  .categoryAssignment { align-items: flex-start; flex-direction: column; }
  .categoryAssignment button { width: 100%; }
  .checkboxLabel { min-height: 2.75rem; padding-top: 0; }'''
          if old_600 not in css:
              raise SystemExit('No encontrado en CSS: editor 600')
          css = css.replace(old_600, new_600, 1)
          css_path.write_text(css)

          test_path = Path('tests/e2e/premium-transaction-editor-contract.spec.ts')
          test_path.write_text('''import { expect, test } from "@playwright/test";\nimport fs from "node:fs";\n\nconst client = fs.readFileSync("app/transactions/transactions-client.tsx", "utf8");\nconst css = fs.readFileSync("app/transactions/transactions.module.css", "utf8");\n\ntest("editor premium separa jerarquía, intención y acciones", async () => {\n  expect(client).toContain('data-testid="edit-category-root"');\n  expect(client).toContain('data-testid="edit-subcategory"');\n  expect(client).toContain('Mantener valor actual');\n  expect(client).toContain('Restaurar valor detectado');\n  expect(client).toContain('Restaurar clasificación detectada');\n  expect(client).not.toContain('Automático/original');\n  expect(client).not.toContain('Automática/original');\n  expect(css).toContain('"category subcategory type review"');\n  expect(css).toContain('width: 1.15rem; height: 1.15rem');\n  expect(css).toContain('grid-area: analytics');\n});\n''')
          PY

          git diff --check
          grep -q '"category subcategory type review"' app/transactions/transactions.module.css
          grep -q 'width: 1.15rem; height: 1.15rem' app/transactions/transactions.module.css
          grep -q 'Mantener valor actual' app/transactions/transactions-client.tsx
          grep -q 'Restaurar clasificación detectada' app/transactions/transactions-client.tsx
          ! grep -q 'Automático/original' app/transactions/transactions-client.tsx
          ! grep -q 'Automática/original' app/transactions/transactions-client.tsx

      - name: Commit target branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/transactions/transactions-client.tsx app/transactions/transactions.module.css tests/e2e/premium-transaction-editor-contract.spec.ts
          git commit -m 'ui(transactions): rediseñar editor premium y compacto'
          git push origin HEAD:ui/premium-movement-editor-20260914
