name: Apply Archive parser recovery UX
on:
  push:
    branches:
      - fix/archive-parser-only-recovery-20260903
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-parser-recovery-ui]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/archive-parser-only-recovery-20260903
          fetch-depth: 1
      - name: Patch recovery copy and response mode
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='app/archivo/archive-bulk-ocr-recovery.tsx';
          let source=fs.readFileSync(path,'utf8');
          const replacements=[
            ['type Candidate={id:string;fileName:string;ocrStatus:string};','type RecoveryMode="metadata_reparse"|"full_ocr";\ntype Candidate={id:string;fileName:string;ocrStatus:string;recoveryMode?:RecoveryMode};'],
            ['  ocrStatus?:string;\n  humanFieldsPreserved?:string[];','  ocrStatus?:string;\n  mode?:RecoveryMode;\n  humanFieldsPreserved?:string[];'],
            ['  if(response.ocrStatus==="complete"){\n    return{id:candidate.id,fileName:candidate.fileName,tone:"success",title:"OCR validado",detail:`La nueva lectura desde el original ha superado la validación automática.${changes}`};\n  }\n  const correction=preserved.length?` Se han conservado tus correcciones en ${preservedLabel(preserved)}.`:"";\n  const missing=missingFieldDetail(response.missingFields);\n  return{id:candidate.id,fileName:candidate.fileName,tone:"review",title:"Sigue pendiente de revisión",detail:`La nueva lectura se ha guardado como evidencia provisional.${changes}${missing}${correction}`};',
             '  if(response.ocrStatus==="complete"){\n    return{id:candidate.id,fileName:candidate.fileName,tone:"success",title:"OCR validado",detail:`La nueva lectura desde el original ha superado la validación automática.${changes}`};\n  }\n  const correction=preserved.length?` Se han conservado tus correcciones en ${preservedLabel(preserved)}.`:"";\n  const missing=missingFieldDetail(response.missingFields);\n  if(response.mode==="metadata_reparse")return{id:candidate.id,fileName:candidate.fileName,tone:"review",title:"Metadatos actualizados sin releer la imagen",detail:`Se ha reutilizado el texto OCR ya guardado con el parser actual; el original no se ha reprocesado.${changes}${missing}${correction}`};\n  return{id:candidate.id,fileName:candidate.fileName,tone:"review",title:"Sigue pendiente de revisión",detail:`La nueva lectura del original se ha guardado como evidencia provisional.${changes}${missing}${correction}`};'],
            ['title:"No se pudo releer",detail:"La evidencia y los datos anteriores permanecen intactos."','title:"No se pudo actualizar",detail:"La evidencia y los datos anteriores permanecen intactos."'],
            ['title:"No se pudo releer",detail:"La evidencia y los datos anteriores permanecen intactos."','title:"No se pudo actualizar",detail:"La evidencia y los datos anteriores permanecen intactos."'],
            ['`${visibleCount} documento${visibleCount===1?"":"s"} puede${visibleCount===1?"":"n"} releerse desde el original privado con el motor actual.`','`${visibleCount} documento${visibleCount===1?"":"s"} puede${visibleCount===1?"":"n"} actualizarse de forma segura. Se reutiliza el OCR existente cuando basta y solo se relee el original cuando hace falta.`'],
            ['{running?"Actualizando OCR…":`Actualizar OCR · ${visibleCount}`}','{running?"Actualizando…":`Actualizar OCR y metadatos · ${visibleCount}`}'],
            ['<strong>El reprocesado conserva el original, tus correcciones y sus asociaciones</strong><span>Puede incluir documentos pendientes y lecturas históricas realizadas con motores anteriores. Si el nuevo OCR sigue indicando «Revisar OCR», su fecha, comercio e importe continúan siendo provisionales: solo un OCR validado o una revisión manual confirma esos datos.</span>','<strong>La actualización conserva el original, tus correcciones y sus asociaciones</strong><span>Primero reutiliza el texto OCR existente con el parser actual. Solo vuelve a leer la imagen cuando la evidencia guardada no basta. Si sigue indicando «Revisar OCR», sus datos continúan siendo provisionales: solo un OCR validado o una revisión manual los confirma.</span>'],
            ['<small>Originales procesados uno a uno. Una relectura fallida no sustituye la evidencia anterior, una revisión manual ni las asociaciones existentes.</small>','<small>Documentos procesados uno a uno. Se reutiliza primero la evidencia guardada; una actualización fallida no sustituye la evidencia anterior, una revisión manual ni las asociaciones existentes.</small>'],
            ['setMessage(`Recuperación OCR terminada · ${parts.join(" · ")}.`);','setMessage(`Recuperación documental terminada · ${parts.join(" · ")}.`);'],
            ['setError("Algún original no pudo releerse. Los resultados anteriores de esos documentos se han conservado intactos.");','setError("Algún documento no pudo actualizarse. Sus resultados anteriores se han conservado intactos.");'],
          ];
          for(const [before,after] of replacements){
            const hits=source.split(before).length-1;
            if(hits!==1)throw new Error(`Expected one UI match, got ${hits}: ${before.slice(0,100)}`);
            source=source.replace(before,after);
          }
          fs.writeFileSync(path,source);
          NODE
          rm .github/workflows/archive-parser-recovery-ui-patch.yml
          git diff --check
      - name: Commit source-only UX
        shell: bash
        run: |
          git config user.name "financial-app-ci"
          git config user.email "financial-app-ci@users.noreply.github.com"
          git add app/archivo/archive-bulk-ocr-recovery.tsx .github/workflows/archive-parser-recovery-ui-patch.yml
          git commit -m "Explain parser-only Archive recovery accurately"
          git push origin HEAD:fix/archive-parser-only-recovery-20260903
