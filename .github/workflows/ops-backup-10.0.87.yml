name: Ops Backup 10.0.87

on:
  push:
    branches:
      - "ops/backup-10.0.87"
    paths:
      - ".github/workflows/ops-backup-10.0.87.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: ops-backup-10.0.87
  cancel-in-progress: false

jobs:
  dispatch-and-wait:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: f0978babb1dabfcabbb46f617cfb827b363576d7
      EXPECTED_VERSION: 10.0.87
    steps:
      - name: Dispatch canonical Production Backup v2
        id: backup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          started_epoch="$(date -u +%s)"

          curl --fail-with-body --silent --show-error             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "${api}/actions/workflows/production-backup-v2.yml/dispatches"             -d "{"ref":"main","inputs":{"source_commit":"${SOURCE_COMMIT}","expected_app_version":"${EXPECTED_VERSION}"}}"

          run_id=""
          for attempt in $(seq 1 24); do
            response="$(curl --fail --silent --show-error               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer ${GH_TOKEN}"               -H "X-GitHub-Api-Version: 2022-11-28"               "${api}/actions/workflows/production-backup-v2.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"

            run_id="$(jq -r               --arg sha "${SOURCE_COMMIT}"               --argjson started "${started_epoch}"               '.workflow_runs
               | map(select(.head_sha == $sha and ((.created_at | fromdateiso8601) >= ($started - 10))))
               | sort_by(.created_at)
               | reverse
               | .[0].id // empty' <<<"${response}")"

            if [ -n "${run_id}" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "${run_id}" ]; then
            echo "No se localizó el run de Production Backup v2 para ${SOURCE_COMMIT}."
            exit 1
          fi

          echo "backup_run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "Production Backup v2 run: ${run_id}"

          for attempt in $(seq 1 160); do
            run="$(curl --fail --silent --show-error               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer ${GH_TOKEN}"               -H "X-GitHub-Api-Version: 2022-11-28"               "${api}/actions/runs/${run_id}")"

            status="$(jq -r '.status' <<<"${run}")"
            conclusion="$(jq -r '.conclusion // ""' <<<"${run}")"
            html_url="$(jq -r '.html_url' <<<"${run}")"

            echo "backup_status=${status} conclusion=${conclusion} url=${html_url}"

            if [ "${status}" = "completed" ]; then
              if [ "${conclusion}" != "success" ]; then
                echo "Production Backup v2 terminó con conclusion=${conclusion}."
                exit 1
              fi
              {
                echo "### Production Backup v2 10.0.87"
                echo "- Run: ${run_id}"
                echo "- Source: ${SOURCE_COMMIT}"
                echo "- Version: ${EXPECTED_VERSION}"
                echo "- Resultado: SUCCESS"
                echo "- URL: ${html_url}"
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            sleep 15
          done

          echo "Timeout esperando Production Backup v2 run ${run_id}."
          exit 1
