name: Analysis V4 Test Alignment

on:
  push:
    branches:
      - work/analysis-premium-v4
    paths:
      - .github/workflows/analysis-v4-fix-tests.yml

permissions:
  contents: write

jobs:
  align-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/analysis-premium-v4
          fetch-depth: 0

      - name: Align regression expectations with v4 UI
        run: python scripts/fix-analysis-v4-tests.py

      - name: Remove temporary alignment helpers
        run: rm .github/workflows/analysis-v4-fix-tests.yml scripts/fix-analysis-v4-tests.py

      - name: Commit clean test alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(analysis): align regression with v4 hierarchy"
          git push origin HEAD:work/analysis-premium-v4
