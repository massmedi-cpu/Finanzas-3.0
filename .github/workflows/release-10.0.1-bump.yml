name: Prepare release 10.0.1

on:
  push:
    branches:
      - 'release/10.0.1'

permissions:
  contents: write

jobs:
  bump-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release checkpoint
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Assert expected starting version
        shell: bash
        run: |
          current=$(node -p "require('./package.json').version")
          if [ "$current" != "10.0.0" ] && [ "$current" != "10.0.1" ]; then
            echo "Unexpected release version: $current"
            exit 1
          fi

      - name: Synchronize release identity
        shell: bash
        run: |
          if [ "$(node -p "require('./package.json').version")" = "10.0.0" ]; then
            npm version 10.0.1 --no-git-tag-version
          fi
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/core/build-info.ts';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            'Consolidación, respaldo, restauración y producción 10.0.0',
            'Consolidación, hardening precomercial y producción 10.0.1',
          );
          fs.writeFileSync(path, source);
          NODE

      - name: Verify version-only lock change
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.version !== '10.0.1' || lock.packages?.['']?.version !== '10.0.1') {
            throw new Error('release_lock_version_mismatch');
          }
          const normalized = structuredClone(lock);
          normalized.version = '__RELEASE_VERSION__';
          normalized.packages[''].version = '__RELEASE_VERSION__';
          const fingerprint = crypto.createHash('sha256').update(JSON.stringify(normalized)).digest('hex');
          if (fingerprint !== '69ac752fc4f14d0bacccb4c8fde376a883f549e8c4b7c01cf31a900d392be95e') {
            throw new Error(`release_lock_semantics_changed:${fingerprint}`);
          }
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full desktop and mobile regression
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile

      - name: Commit validated release identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/core/build-info.ts
          if git diff --cached --quiet; then
            echo "Release identity already synchronized."
            exit 0
          fi
          git commit -m "chore(release): set Financial App 10.0.1"
          git push origin HEAD:release/10.0.1
