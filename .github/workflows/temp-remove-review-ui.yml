name: Temp Remove Review UI
on:
  push:
    branches:
      - fix/remove-review-ui-20260914
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-review-ui-20260914
      - name: Aplicar cambio
        run: python .tmp/remove_review_ui.py
      - name: Validar contrato de fuente
        run: |
          grep -q 'data-testid="edit-category-root"' app/transactions/transactions-client.tsx
          ! grep -q 'data-testid="edit-review"' app/transactions/transactions-client.tsx
          ! grep -q 'data-testid="bulk-review"' app/transactions/transactions-client.tsx
          ! grep -q '<span>Revisión</span>' app/transactions/transactions-client.tsx
          ! grep -q '<th>Estado</th>' app/transactions/transactions-client.tsx
      - name: Limpiar auxiliares y publicar rama
        run: |
          rm -f .tmp/remove_review_ui.py .github/workflows/temp-remove-review-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(transactions): retirar revisión de la experiencia de movimientos'
          git push origin HEAD:fix/remove-review-ui-20260914
