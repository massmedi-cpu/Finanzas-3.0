name: REL-063 Sync Lock

on:
  push:
    branches:
      - release/rel-063-art-010
    paths:
      - .github/workflows/rel063-sync-lock.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/rel-063-art-010
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Synchronize package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package-lock if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "REL-063 · sync package-lock for 10.0.63"
          git push origin HEAD:release/rel-063-art-010
