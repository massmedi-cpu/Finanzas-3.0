name: REL-064 Production Backup Dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rel064-production-backup-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact stable 10.0.64 backup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-backup-v2.yml \
            --ref main \
            -f source_commit=ce43b179fab435a609b67d2dd2c1c7af295cde65 \
            -f expected_app_version=10.0.64
