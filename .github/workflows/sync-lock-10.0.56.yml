name: Sync package-lock 10.0.56

on:
  push:
    branches:
      - release/10.0.56-responsive-breakpoints
    paths:
      - .github/workflows/sync-lock-10.0.56.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/10.0.56-responsive-breakpoints
      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lock identity only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify 10.0.56 identity
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='10.0.56'||l.version!=='10.0.56'||l.packages[''].version!=='10.0.56') process.exit(1)"
      - name: Commit synchronized lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Financial App 10.0.56 · sincronizar package-lock'
          git push origin HEAD:release/10.0.56-responsive-breakpoints
