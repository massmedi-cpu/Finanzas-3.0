name: Post 10.0.70 Audit

on:
  push:
    branches:
      - audit/post-10.0.70
    paths:
      - '.github/workflows/post-10.0.70-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Production build and postbuild audits
        run: npm run build
      - name: Pre-039 Axioma contract
        run: npm run verify:pre039
      - name: Premium design contract
        run: npm run verify:premium-design
      - name: Semantic design contract
        run: npm run verify:semantic-design
      - name: Data visualization contract
        run: npm run verify:data-visualization
      - name: Transactions concurrency contract
        run: node scripts/transactions-concurrency-guard-contract.mjs
      - name: Critical dependency audit
        run: npm audit --audit-level=critical

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full E2E suite
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: post-10.0.70-playwright-report
          path: playwright-report
          if-no-files-found: ignore
