name: REL-068 Production Backup Dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rel068-production-backup-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact Production Backup v2
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: eac3b925c17aee0cc4414a815b7c8ecb13ce02d1
          EXPECTED_APP_VERSION: 10.0.68
        run: |
          set -euo pipefail
          gh workflow run production-backup-v2.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_commit="$SOURCE_COMMIT" \
            -f expected_app_version="$EXPECTED_APP_VERSION"
