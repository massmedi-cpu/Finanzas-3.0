name: Source Trust AppShell 10.0.29

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/app-shell.tsx"
      - "app/source-trust-status.tsx"
      - "app/source-trust-status.module.css"
      - "app/api/analysis/source-freshness/route.ts"
      - "src/application/source-sync-incidents.ts"
      - "tests/e2e/source-trust-app-shell.spec.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/source-trust-appshell-10.0.29.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Version consistency
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');const v=p.version.split('.').map(Number);if(v.length!==3||v[0]!==10||v[1]!==0||v[2]<29||l.version!==p.version||l.packages[''].version!==p.version)process.exit(1)"

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Source trust AppShell desktop and mobile
        run: npx playwright test tests/e2e/source-trust-app-shell.spec.ts --project=chromium-desktop --project=chromium-mobile --workers=2
