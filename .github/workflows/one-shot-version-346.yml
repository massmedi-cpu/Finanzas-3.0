name: One-shot Financial App 3.4.6 manifest alignment

on:
  push:
    branches:
      - perf/3.4.6-touch-intent-prefetch

permissions:
  contents: write

jobs:
  align-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/3.4.6-touch-intent-prefetch
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align npm manifests
        run: npm version 3.4.6 --no-git-tag-version
      - name: Commit generated manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: align package manifests to 3.4.6"
          git push origin HEAD:perf/3.4.6-touch-intent-prefetch
