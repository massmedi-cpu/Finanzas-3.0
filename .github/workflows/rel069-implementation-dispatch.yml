name: REL-069 Implementation Dispatch

on:
  push:
    branches:
      - release/10.0.69-reflow-accessibility
    paths:
      - .github/workflows/rel069-implementation-dispatch.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: release/10.0.69-reflow-accessibility
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply REL-069 progressive-loading patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          route = Path('app/api/dashboard/route.ts')
          text = route.read_text()
          old = 'const SCOPES = new Set(["primary", "secondary", "all"] as const);\ntype DashboardScope = "primary" | "secondary" | "all";'
          new = 'const SCOPES = new Set(["critical", "activity", "primary", "secondary", "all"] as const);\ntype DashboardScope = "critical" | "activity" | "primary" | "secondary" | "all";'
          assert text.count(old) == 1, 'dashboard scope declaration drifted'
          text = text.replace(old, new)
          old = '  if (scope === "primary") return [financial, transactions];\n  if (scope === "secondary") return secondary;'
          new = '  if (scope === "critical") return [financial];\n  if (scope === "activity") return [transactions];\n  if (scope === "primary") return [financial, transactions];\n  if (scope === "secondary") return secondary;'
          assert text.count(old) == 1, 'dashboard operations scope block drifted'
          route.write_text(text.replace(old, new))

          home = Path('app/inicio-overview.tsx')
          text = home.read_text()
          old = 'type DashboardScope = "primary" | "secondary";'
          new = 'type DashboardScope = "critical" | "activity" | "primary" | "secondary";'
          assert text.count(old) == 1, 'client scope declaration drifted'
          text = text.replace(old, new)

          old = '  const [primaryLoading, setPrimaryLoading] = useState(true);\n  const [secondaryLoading, setSecondaryLoading] = useState(true);'
          new = '  const [primaryLoading, setPrimaryLoading] = useState(true);\n  const [activityLoading, setActivityLoading] = useState(true);\n  const [secondaryLoading, setSecondaryLoading] = useState(true);'
          assert text.count(old) == 1, 'loading state block drifted'
          text = text.replace(old, new)

          old = '      if (scope === "primary") setDataThroughDate(envelope.dataThroughDate ?? null);'
          new = '      if (scope === "activity" || scope === "primary") setDataThroughDate(envelope.dataThroughDate ?? null);'
          assert text.count(old) == 1, 'data-through-date scope block drifted'
          text = text.replace(old, new)

          old = '''  const refreshDashboard = useCallback(async () => {
    setPrimaryLoading(true);
    setDataThroughDate(null);
    setIndependentSources([]);
    const statusPromise = loadSyncStatus();
    await loadScope("primary", ["financial", "transactions"]);
    setPrimaryLoading(false);
    setSecondaryLoading(true);
    await Promise.all([loadScope("secondary", ["monthly", "budgets", "forecast"]), statusPromise]);
    setSecondaryLoading(false);
  }, [loadScope, loadSyncStatus]);'''
          new = '''  const refreshDashboard = useCallback(async () => {
    setPrimaryLoading(true);
    setActivityLoading(true);
    setSecondaryLoading(true);
    setDataThroughDate(null);
    setIndependentSources([]);

    const statusPromise = loadSyncStatus();
    const activityPromise = loadScope("activity", ["transactions"])
      .finally(() => setActivityLoading(false));
    const secondaryPromise = loadScope("secondary", ["monthly", "budgets", "forecast"])
      .finally(() => setSecondaryLoading(false));

    await loadScope("critical", ["financial"]);
    setPrimaryLoading(false);
    await Promise.all([activityPromise, secondaryPromise, statusPromise]);
  }, [loadScope, loadSyncStatus]);'''
          assert text.count(old) == 1, 'refreshDashboard block drifted'
          text = text.replace(old, new)

          old = '<main className={styles.shell} aria-busy={primaryLoading || secondaryLoading}>'
          new = '<main className={styles.shell} aria-busy={primaryLoading || activityLoading || secondaryLoading}>'
          assert text.count(old) == 1, 'main busy state drifted'
          text = text.replace(old, new)

          old = '!primaryLoading && !secondaryLoading'
          assert text.count(old) == 2, 'expected two settled-notice guards'
          text = text.replace(old, '!primaryLoading && !activityLoading && !secondaryLoading')

          old = '        loading={primaryLoading || secondaryLoading}'
          new = '        loading={primaryLoading || activityLoading || secondaryLoading}'
          assert text.count(old) == 1, 'smart brief loading guard drifted'
          text = text.replace(old, new)

          marker = '''          ) : primaryLoading ? (
            <div className={styles.skeleton} />
          ) : (
            <p className={styles.empty}>{transactions ? "No hay actividad reciente." : "La actividad reciente no está disponible ahora."}</p>'''
          replacement = '''          ) : activityLoading ? (
            <div className={styles.skeleton} aria-label="Cargando actividad reciente" />
          ) : (
            <p className={styles.empty}>{transactions ? "No hay actividad reciente." : "La actividad reciente no está disponible ahora. El resto del resumen sigue operativo."}</p>'''
          assert text.count(marker) == 1, 'activity loading block drifted'
          home.write_text(text.replace(marker, replacement))

          verifier = Path('scripts/verify-home-progressive-loading-10.0.69.mjs')
          verifier.write_text('''import fs from "node:fs";\n\nconst home = fs.readFileSync("app/inicio-overview.tsx", "utf8");\nconst route = fs.readFileSync("app/api/dashboard/route.ts", "utf8");\n\nconst assertions = [\n  [route.includes('"critical", "activity", "primary", "secondary", "all"'), "dashboard API exposes backward-compatible critical/activity scopes"],\n  [route.includes('if (scope === "critical") return [financial];'), "critical scope requests only financial snapshot"],\n  [route.includes('if (scope === "activity") return [transactions];'), "activity scope requests only transactions"],\n  [home.includes('loadScope("critical", ["financial"])'), "Inicio requests the critical financial scope"],\n  [home.includes('loadScope("activity", ["transactions"])'), "Inicio requests activity independently"],\n  [home.includes('setActivityLoading(false)'), "activity owns an independent loading lifecycle"],\n  [home.includes('aria-busy={primaryLoading || activityLoading || secondaryLoading}'), "page busy state covers every progressive scope"],\n  [!home.includes('await loadScope("primary", ["financial", "transactions"])'), "Inicio no longer blocks financial data on transactions"],\n];\n\nconst failed = assertions.filter(([ok]) => !ok);\nfor (const [ok, label] of assertions) console.log(`${ok ? "PASS" : "FAIL"}: ${label}`);\nif (failed.length) process.exit(1);\n''')

          test = Path('tests/e2e/inicio-progressive-loading-10.0.69.spec.ts')
          test.write_text('''import { expect, test, type Page } from "@playwright/test";\n\nconst emptyData = () => ({ financial: null, monthly: null, budgets: null, forecast: null, transactions: null });\n\nasync function mockProgressiveDashboard(page: Page) {\n  const requestedScopes: string[] = [];\n  await page.route("**/api/source/google/sync", async (route) => {\n    await route.fulfill({\n      status: 200,\n      contentType: "application/json",\n      body: JSON.stringify({ run: { id: "sync-1", status: "success", startedAt: "2026-10-03T08:00:00.000Z", finishedAt: "2026-10-03T08:00:01.000Z", rowsSeen: 1, rowsInserted: 0, rowsRevised: 0, rowsSkipped: 1, rowsFailed: 0, rowsMissing: 0, duplicatesDetected: 0, warningsCount: 0, errorCode: null, errorMessage: null }, cursors: [] }),\n    });\n  });\n\n  await page.route("**/api/dashboard**", async (route) => {\n    const url = new URL(route.request().url());\n    const scope = url.searchParams.get("scope") ?? "all";\n    requestedScopes.push(scope);\n    const data = emptyData();\n    let requestedSources: string[] = [];\n    let dataThroughDate: string | null = null;\n\n    if (scope === "critical") {\n      requestedSources = ["financial"];\n      data.financial = {\n        period: { dateFrom: "2026-10-01", dateTo: "2026-10-03", incomeCents: 200000, expenseCents: 50000, operatingNetCents: 150000, savingsCents: 150000, savingsRateBps: 7500, quality: { suspectedDuplicateRows: 0, signMismatchRows: 0 } },\n        balances: { asOfDate: "2026-10-03", activeBalanceCents: 123456, accounts: [{ id: "acc-1", name: "Cuenta principal", type: "checking", lifecycle: "active", balanceCents: 123456, explicitBalanceDate: "2026-10-03" }] },\n      };\n    } else if (scope === "activity") {\n      requestedSources = ["transactions"];\n      await new Promise((resolve) => setTimeout(resolve, 1500));\n      dataThroughDate = "2026-10-03";\n      data.transactions = { rows: [{ id: "tx-late", bankDate: "2026-10-03", amountCents: -1250, account: { id: "acc-1", name: "Cuenta principal" }, concept: { effective: "Compra de prueba" }, merchant: { effectiveName: "Movimiento tardío" }, category: { effectiveId: null, effectiveName: null }, kind: { effective: "expense" }, duplicateState: "none", excludedFromAnalytics: false }], totalCount: 1 };\n    } else if (scope === "secondary") {\n      requestedSources = ["monthly", "budgets", "forecast"];\n      data.monthly = { dateFrom: "2025-11-01", dateTo: "2026-10-03", rows: [{ monthStart: "2026-09-01", incomeCents: 180000, expenseCents: 90000, operatingNetCents: 90000 }, { monthStart: "2026-10-01", incomeCents: 200000, expenseCents: 50000, operatingNetCents: 150000 }] };\n      data.budgets = { month: "2026-10", total: { categoryId: null, categoryName: null, effectiveAmountCents: 100000, actualExpenseCents: 50000, remainingCents: 50000, progressBps: 5000, status: "on_track" }, categories: [] };\n      data.forecast = { period: { dateFrom: "2026-10-03", dateTo: "2026-11-02", accountId: null }, summary: { openingBalanceCents: 123456, projectedIncomeCents: 0, projectedExpenseCents: 0, projectedNetCents: 0, projectedClosingBalanceCents: 123456, plannedItems: 0 }, items: [] };\n    }\n\n    await route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ contractVersion: 1, scope, asOfDate: "2026-10-03", dataThroughDate, generatedAt: "2026-10-03T08:00:00.000Z", requestedSources, failedSources: [], data }) });\n  });\n  return requestedScopes;\n}\n\ntest.describe("Financial App 10.0.69 · carga progresiva de Inicio", () => {\n  test("muestra el saldo crítico antes de que termine la actividad lenta", async ({ page }) => {\n    const requestedScopes = await mockProgressiveDashboard(page);\n    await page.goto("/");\n\n    const balanceCard = page.locator("article").filter({ hasText: "Saldo total en cuentas" });\n    await expect(balanceCard.locator("strong")).not.toHaveText("—", { timeout: 1200 });\n    await expect(page.getByText("Movimiento tardío", { exact: true })).toHaveCount(0);\n    await expect(page.getByLabel("Cargando actividad reciente")).toBeVisible();\n\n    await expect(page.getByText("Movimiento tardío", { exact: true })).toBeVisible({ timeout: 5000 });\n    expect(requestedScopes).toContain("critical");\n    expect(requestedScopes).toContain("activity");\n    expect(requestedScopes).toContain("secondary");\n    expect(requestedScopes).not.toContain("primary");\n  });\n});\n''')

          doc = Path('docs/precommercial-audit/12b-home-critical-path-10.0.69.md')
          doc.write_text('''# REL-069 · Inicio: ruta crítica progresiva · 10.0.69\n\n## Objetivo\n\nReducir el tiempo percibido hasta la información financiera principal sin cambiar cálculos, persistencia ni la fuente bancaria oficial de solo lectura.\n\n## Cambio\n\n- `critical`: solicita únicamente `financial.snapshot`.\n- `activity`: solicita `transaction.query` de forma independiente.\n- `secondary`: mantiene histórico, presupuestos y previsión.\n- `primary` se conserva en la API por compatibilidad hacia atrás.\n- Inicio libera su estado de carga principal cuando termina `critical`; actividad y secundarios mantienen ciclos de carga propios.\n- Un fallo o una demora de actividad ya no impide mostrar saldo y balance mensual.\n\n## Protección automática\n\n- Verificador estático `verify-home-progressive-loading-10.0.69.mjs`.\n- E2E `inicio-progressive-loading-10.0.69.spec.ts`: retrasa deliberadamente actividad y exige que el saldo ya sea visible.\n- Se conserva el diagnóstico de reflow 200%/400% de REL-069.\n\n## Invariantes\n\n- Sin cambios en fórmulas financieras.\n- Sin escritura en la fuente bancaria oficial.\n- Sin cambio del gateway de persistencia.\n- Contrato `scope=primary` preservado para consumidores existentes.\n''')

          package = Path('package.json')
          payload = json.loads(package.read_text())
          payload['scripts']['verify:home-progressive-loading'] = 'node scripts/verify-home-progressive-loading-10.0.69.mjs'
          postbuild = payload['scripts']['postbuild']
          verify_cmd = 'node scripts/verify-home-progressive-loading-10.0.69.mjs'
          if verify_cmd not in postbuild:
              payload['scripts']['postbuild'] = postbuild + ' && ' + verify_cmd
          package.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n')
          PY

          npm version 10.0.69 --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: TypeScript
        run: npm run typecheck

      - name: Static progressive-loading contract
        run: npm run verify:home-progressive-loading

      - name: Production build
        run: npm run build

      - name: Progressive loading E2E
        run: npx playwright test tests/e2e/inicio-progressive-loading-10.0.69.spec.ts --project=chromium-desktop --workers=1

      - name: Reflow accessibility regression
        run: npx playwright test tests/e2e/reflow-accessibility-10.0.69.spec.ts --project=chromium-desktop --workers=1

      - name: Commit candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/dashboard/route.ts app/inicio-overview.tsx package.json package-lock.json scripts/verify-home-progressive-loading-10.0.69.mjs tests/e2e/inicio-progressive-loading-10.0.69.spec.ts docs/precommercial-audit/12b-home-critical-path-10.0.69.md
          git commit -m "feat(rel-069): make Home critical data progressive"
          git push origin HEAD:release/10.0.69-reflow-accessibility
