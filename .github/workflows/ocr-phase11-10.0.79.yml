name: OCR Phase 11 10.0.79

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/documents/**"
      - "src/application/document-ocr-review.ts"
      - "src/domain/document-ocr*.ts"
      - "src/infrastructure/ocr/**"
      - "tests/e2e/document-ocr-*.spec.ts"
      - "scripts/verify-ocr-phase11-10.0.79.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ocr-phase11-10.0.79.yml"

permissions:
  contents: read

concurrency:
  group: ocr-phase11-10.0.79-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: OCR 10.0.79 static contract
        run: npm run verify:ocr-phase11

      - name: TypeScript
        run: npm run typecheck

      - name: Production build and cumulative gates
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: OCR domain and review regression
        run: >-
          npx playwright test
          tests/e2e/document-ocr-review-quality-10.0.79.spec.ts
          tests/e2e/document-ocr-review-workbench.spec.ts
          tests/e2e/document-ocr-structured-review.spec.ts
          tests/e2e/document-ocr-natural-review.spec.ts
          tests/e2e/document-ocr-contract.spec.ts
          tests/e2e/document-ocr-service.spec.ts
          --project=chromium-desktop
          --workers=2

      - name: OCR traceability UI desktop and mobile
        run: >-
          npx playwright test
          tests/e2e/document-ocr-traceability-ui-10.0.79.spec.ts
          --project=chromium-desktop
          --project=chromium-mobile
          --workers=2
