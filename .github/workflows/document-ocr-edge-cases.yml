name: Document OCR Edge Cases

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/domain/document-ocr.ts"
      - "src/application/document-ocr-service.ts"
      - "supabase/migrations/20260903200004_financial_app_foundations.sql"
      - "supabase/migrations/20260906194000_phase9_document_engine_core.sql"
      - "tests/e2e/document-ocr-edge-cases-10.0.33.spec.ts"
      - "tests/e2e/document-ocr-contract.spec.ts"
      - "tests/e2e/document-ocr-structured-review.spec.ts"
      - "tests/e2e/document-ocr-natural-review.spec.ts"
      - "tests/e2e/document-ocr-service.spec.ts"
      - "tests/e2e/documents.spec.ts"
      - ".github/workflows/document-ocr-edge-cases.yml"
      - ".github/workflows/quality-edge-ci-gates-10.0.41.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Remaining document and OCR edge-case contracts
        run: >-
          npx playwright test
          tests/e2e/document-ocr-edge-cases-10.0.33.spec.ts
          tests/e2e/document-ocr-contract.spec.ts
          tests/e2e/document-ocr-structured-review.spec.ts
          tests/e2e/document-ocr-natural-review.spec.ts
          tests/e2e/document-ocr-service.spec.ts
          tests/e2e/documents.spec.ts
          --project=chromium-desktop
          --workers=2
