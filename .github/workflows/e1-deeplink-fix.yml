name: E1 deterministic deeplink fix

on:
  push:
    branches:
      - audit/precommercial-10.0.0
    paths:
      - .github/workflows/e1-deeplink-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/precommercial-10.0.0
          fetch-depth: 0
      - name: Apply exact bootstrap transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/transactions/transactions-client.tsx')
          text = path.read_text()
          old = '''    void bootstrap();
              void fetchPage(EMPTY_FILTERS, null, false);
          '''
          # Keep indentation literal and fail closed if the expected source is not unique.
          old = "    void bootstrap();\n    void fetchPage(EMPTY_FILTERS, null, false);\n"
          new = '''    const params = new URLSearchParams(window.location.search);
              const reviewState = params.get("reviewState");
              const duplicateState = params.get("duplicateState");
              const initialFilters: Filters = {
                ...EMPTY_FILTERS,
                reviewState: reviewState && Object.prototype.hasOwnProperty.call(REVIEW_LABELS, reviewState) ? reviewState : "",
                duplicateState: duplicateState && Object.prototype.hasOwnProperty.call(DUPLICATE_LABELS, duplicateState) ? duplicateState : "",
              };
              setDraftFilters(initialFilters);
              setAppliedFilters(initialFilters);
              void bootstrap();
              void fetchPage(initialFilters, null, false);
          '''
          # Normalize the indentation introduced by the YAML block itself.
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines()) + "\n"
          if text.count(old) != 1:
              raise SystemExit(f'Expected bootstrap block exactly once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow and commit atomically
        shell: bash
        run: |
          rm .github/workflows/e1-deeplink-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/transactions/transactions-client.tsx .github/workflows/e1-deeplink-fix.yml
          git diff --cached --check
          git commit -m "fix(audit): make review deep-links functional [vercel-preview]"
          git push origin HEAD:audit/precommercial-10.0.0
