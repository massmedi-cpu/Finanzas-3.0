name: Financial Consistency CI Gates 10.0.40

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/inicio-overview.tsx"
      - "app/api/transactions/route.ts"
      - "app/transactions/**"
      - "app/review/review-client.tsx"
      - "src/application/dashboard/home-consistency.ts"
      - "supabase/functions/financial-app-db-gateway/transaction-query.ts"
      - "supabase/migrations/20260905225500_phase5_financial_logic_core.sql"
      - "supabase/migrations/20260927100500_cross_module_financial_consistency.sql"
      - "supabase/migrations/20260927185432_sign_mismatch_transaction_review_10_0_25.sql"
      - "tests/e2e/cross-module-financial-consistency.spec.ts"
      - "tests/e2e/regional-home-consistency.spec.ts"
      - "tests/e2e/extreme-financial-scenarios.spec.ts"
      - "tests/e2e/sign-mismatch-review.spec.ts"
      - "tests/e2e/review-action-center.spec.ts"
      - "tests/e2e/review-center.spec.ts"
      - "scripts/verify-financial-consistency-ci-gates-10.0.40.mjs"
      - ".github/workflows/cross-module-financial-consistency.yml"
      - ".github/workflows/extreme-financial-scenarios.yml"
      - ".github/workflows/sign-mismatch-review.yml"
      - ".github/workflows/review-sign-mismatch.yml"
      - ".github/workflows/financial-consistency-ci-gates-10.0.40.yml"

permissions:
  contents: read

concurrency:
  group: financial-consistency-ci-gates-10.0.40-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reusable gate contract
        run: node scripts/verify-financial-consistency-ci-gates-10.0.40.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Financial consistency desktop contracts
        run: >-
          npx playwright test
          tests/e2e/cross-module-financial-consistency.spec.ts
          tests/e2e/regional-home-consistency.spec.ts
          tests/e2e/extreme-financial-scenarios.spec.ts
          --project=chromium-desktop
          --workers=2

      - name: Sign mismatch and review desktop/mobile
        run: >-
          npx playwright test
          tests/e2e/sign-mismatch-review.spec.ts
          tests/e2e/review-action-center.spec.ts
          tests/e2e/review-center.spec.ts
          --project=chromium-desktop
          --project=chromium-mobile
          --workers=2
