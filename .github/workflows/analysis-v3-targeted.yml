name: Analysis Premium V3 Targeted

on:
  push:
    branches:
      - work/analysis-premium-v3

permissions:
  contents: read

jobs:
  analysis-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Analysis regression suite
        run: >-
          npm run test:e2e --
          tests/e2e/analysis.spec.ts
          tests/e2e/analysis-contract-navigation.spec.ts
          tests/e2e/premium-analysis-visual.spec.ts
          --project=chromium-desktop
          --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-v3-targeted-${{ github.sha }}
          path: playwright-report/
          retention-days: 7
