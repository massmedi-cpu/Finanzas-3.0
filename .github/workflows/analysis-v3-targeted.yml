name: Analysis Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/analysis/**"
      - "src/application/analysis/**"
      - "src/design/contribution-chart.tsx"
      - "src/design/contribution-chart.module.css"
      - "src/design/financial-trend-chart.tsx"
      - "src/design/financial-trend-chart.module.css"
      - "tests/e2e/analysis*.spec.ts"
      - "tests/e2e/premium-analysis-visual.spec.ts"
      - ".github/workflows/analysis-v3-targeted.yml"
  push:
    branches:
      - main
    paths:
      - "app/analysis/**"
      - "src/application/analysis/**"
      - "src/design/contribution-chart.tsx"
      - "src/design/contribution-chart.module.css"
      - "src/design/financial-trend-chart.tsx"
      - "src/design/financial-trend-chart.module.css"
      - "tests/e2e/analysis*.spec.ts"
      - "tests/e2e/premium-analysis-visual.spec.ts"
      - ".github/workflows/analysis-v3-targeted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VALIDATION_SHA }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Keep every deterministic Analysis presentation-state regression in the permanent gate.
      - name: Run Analysis regression suite
        run: >-
          npm run test:e2e --
          tests/e2e/analysis.spec.ts
          tests/e2e/analysis-contract-navigation.spec.ts
          tests/e2e/analysis-history-integrity.spec.ts
          tests/e2e/analysis-presentation-states.spec.ts
          tests/e2e/analysis-presentation-v6.spec.ts
          tests/e2e/analysis-redesign-gates.spec.ts
          tests/e2e/premium-analysis-visual.spec.ts
          --project=chromium-desktop
          --project=chromium-mobile

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-visual-evidence-${{ env.VALIDATION_SHA }}
          path: test-results/**/analysis-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-regression-${{ env.VALIDATION_SHA }}
          path: playwright-report/
          retention-days: 7
