name: Sync Missing Persistence 10.0.22

on:
  push:
    branches:
      - feature/sync-missing-persistence-10.0.22
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260926193000_persist_sync_missing_rows.sql'
      - 'supabase/functions/financial-app-db-gateway/source-sync.ts'
      - 'supabase/functions/financial-app-db-gateway/source-sync-router.ts'
      - 'app/api/source/google/sync/route.ts'
      - 'app/inicio-overview.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/e2e/sync-missing-persistence-contract.spec.ts'
      - '.github/workflows/sync-missing-persistence-10.0.22.yml'

permissions:
  contents: read

concurrency:
  group: sync-missing-persistence-10.0.22-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Version consistency
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!=='10.0.22'||l.version!==p.version||l.packages[''].version!==p.version)process.exit(1)"

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Persistent missing-row contract
        run: npx playwright test tests/e2e/sync-missing-persistence-contract.spec.ts --project=chromium-desktop
