name: Dispatch Production Backup v2 10.0.57

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-production-backup-v2-10.0.57.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical Production Backup v2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-backup-v2.yml/dispatches"
          body='{"ref":"main","inputs":{"source_commit":"b5467b0a8bd0a6a6c8f401a4b0a7f13108af2076","expected_app_version":"10.0.57"}}'
          code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            -d "$body")"
          if [ "$code" != "204" ]; then
            cat /tmp/dispatch.out
            echo "unexpected_dispatch_status=$code"
            exit 1
          fi
          echo "canonical_production_backup_v2_dispatched=true"
