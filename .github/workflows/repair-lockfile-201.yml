name: Repair 2.0.1 lockfile
on:
  push:
    branches: [financial-app-rebuild]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'restore canonical lockfile') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore canonical lockfile and bump root version only
        run: |
          git fetch origin main --depth=1
          git show origin/main:package-lock.json > package-lock.json
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.version = '2.0.1';
          if (!lock.packages?.['']) throw new Error('lock root package missing');
          lock.packages[''].version = '2.0.1';
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
          node -e "const l=require('./package-lock.json'); if(l.version!=='2.0.1'||l.packages[''].version!=='2.0.1') process.exit(1)"
      - name: Commit repaired lockfile
        run: |
          git config user.name "financial-app-release-bot"
          git config user.email "financial-app-release-bot@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(2.0.1): restore canonical lockfile"
          git push origin HEAD:financial-app-rebuild
