name: REL-066 Production Backup Dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rel066-production-backup-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact stable 10.0.66 backup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-backup-v2.yml \
            --ref main \
            -f source_commit=f68e87018a76e4a851db5a7d0a4663fe9b9b909e \
            -f expected_app_version=10.0.66
