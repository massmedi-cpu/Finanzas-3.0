name: REL-053 one-shot version bump

on:
  push:
    branches:
      - release/10.0.53-config-networth
    paths:
      - ".release/trigger-10.0.53"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/10.0.53-config-networth
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Bump package identity consistently
        run: npm version 10.0.53 --no-git-tag-version

      - name: Remove one-shot launcher
        run: |
          rm -f .release/trigger-10.0.53
          rm -f .github/workflows/rel053-version-bump-once.yml

      - name: Commit versioned candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .release/trigger-10.0.53 .github/workflows/rel053-version-bump-once.yml
          git commit -m "release: Financial App 10.0.53"
          git push origin HEAD:release/10.0.53-config-networth
