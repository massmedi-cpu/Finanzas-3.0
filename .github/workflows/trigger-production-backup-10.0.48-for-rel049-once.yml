name: Trigger Production Backup 10.0.48 For REL-049 Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trigger-production-backup-10.0.48-for-rel049-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact Production Backup v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Dispatching immutable Financial App 10.0.48 production backup before 10.0.49 release"
          gh workflow run production-backup-v2.yml \
            --ref main \
            -f source_commit="ab0e43193ffadeecc5ec98fda879f5dbf0264700" \
            -f expected_app_version=10.0.48
