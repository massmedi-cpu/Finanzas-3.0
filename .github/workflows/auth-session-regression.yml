name: Auth Session Regression

on:
  pull_request:
    branches:
      - main
      - chat/twenty-one-routes-responsive-shell-20261010
    paths:
      - "proxy.ts"
      - "src/infrastructure/auth/**"
      - "tests/e2e/production-auth.spec.ts"
      - "tests/e2e/auth-refresh-request-propagation.spec.ts"
      - "tests/e2e/source-metadata-auth-boundary.spec.ts"
      - "tests/e2e/source-overview-10.0.53.spec.ts"
      - ".github/workflows/gate4-protected-workspace-boundary.yml"
      - "tests/e2e/preview-production-isolation-live.spec.ts"
      - "app/api/source/google/status/route.ts"
      - "app/api/source/google/sync/route.ts"
      - "app/api/health/source-runtime/route.ts"
      - "app/configuration/source/source-client.tsx"
      - "app/configuration/source/source-overview-client.tsx"
      - ".github/workflows/auth-session-regression.yml"
  push:
    branches:
      - main
    paths:
      - "proxy.ts"
      - "src/infrastructure/auth/**"
      - "tests/e2e/production-auth.spec.ts"
      - "tests/e2e/auth-refresh-request-propagation.spec.ts"
      - "tests/e2e/source-metadata-auth-boundary.spec.ts"
      - "tests/e2e/source-overview-10.0.53.spec.ts"
      - ".github/workflows/gate4-protected-workspace-boundary.yml"
      - "tests/e2e/preview-production-isolation-live.spec.ts"
      - "app/api/source/google/status/route.ts"
      - "app/api/source/google/sync/route.ts"
      - "app/api/health/source-runtime/route.ts"
      - "app/configuration/source/source-client.tsx"
      - "app/configuration/source/source-overview-client.tsx"
      - ".github/workflows/auth-session-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-session-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run auth session regression suite
        run: >-
          npm run test:e2e --
          tests/e2e/production-auth.spec.ts
          tests/e2e/auth-refresh-request-propagation.spec.ts
          tests/e2e/source-metadata-auth-boundary.spec.ts
          tests/e2e/source-overview-10.0.53.spec.ts
          --project=chromium-desktop

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-session-regression-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

  # Reuse the protected-preview tests from a workflow GitHub already schedules
  # on this PR. The called job only receives short-lived OIDC credentials.
  protected-preview-read-boundary:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: read
      id-token: write
    uses: ./.github/workflows/gate4-protected-workspace-boundary.yml
    secrets: inherit
