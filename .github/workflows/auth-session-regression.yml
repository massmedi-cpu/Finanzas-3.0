name: Auth Session Regression

on:
  pull_request:
    branches:
      - main
      - chat/twenty-one-routes-responsive-shell-20261010
    paths:
      - "proxy.ts"
      - "src/infrastructure/auth/**"
      - "app/api/auth/login/route.ts"
      - "app/api/auth/google/**"
      - "app/login/**"
      - "tests/e2e/google-sign-in-auth.spec.ts"
      - "src/infrastructure/http/limited-json-request.ts"
      - "tests/e2e/auth-login-json-byte-limit.spec.ts"
      - "tests/e2e/auth-provider-response-safety.spec.ts"
      - "tests/e2e/production-auth.spec.ts"
      - "tests/e2e/auth-refresh-request-propagation.spec.ts"
      - "tests/e2e/source-metadata-auth-boundary.spec.ts"
      - "tests/e2e/source-overview-10.0.53.spec.ts"
      - "app/api/source/google/connect/route.ts"
      - "app/api/source/google/callback/route.ts"
      - "app/api/source/google/status/route.ts"
      - "app/api/source/google/sync/route.ts"
      - "app/api/health/source-runtime/route.ts"
      - "app/configuration/source/source-client.tsx"
      - "app/configuration/source/source-overview-client.tsx"
      - ".github/workflows/auth-session-regression.yml"
  push:
    branches:
      - main
    paths:
      - "proxy.ts"
      - "src/infrastructure/auth/**"
      - "app/api/auth/login/route.ts"
      - "app/api/auth/google/**"
      - "app/login/**"
      - "tests/e2e/google-sign-in-auth.spec.ts"
      - "src/infrastructure/http/limited-json-request.ts"
      - "tests/e2e/auth-login-json-byte-limit.spec.ts"
      - "tests/e2e/auth-provider-response-safety.spec.ts"
      - "tests/e2e/production-auth.spec.ts"
      - "tests/e2e/auth-refresh-request-propagation.spec.ts"
      - "tests/e2e/source-metadata-auth-boundary.spec.ts"
      - "tests/e2e/source-overview-10.0.53.spec.ts"
      - "app/api/source/google/connect/route.ts"
      - "app/api/source/google/callback/route.ts"
      - "app/api/source/google/status/route.ts"
      - "app/api/source/google/sync/route.ts"
      - "app/api/health/source-runtime/route.ts"
      - "app/configuration/source/source-client.tsx"
      - "app/configuration/source/source-overview-client.tsx"
      - ".github/workflows/auth-session-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-session-regression:
    runs-on: ubuntu-latest
    # Browser dependencies + build exhausted the old 12-min ceiling before tests.
    timeout-minutes: 22
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run auth session regression suite
        run: >-
          npm run test:e2e --
          tests/e2e/production-auth.spec.ts
          tests/e2e/google-sign-in-auth.spec.ts
          tests/e2e/auth-login-json-byte-limit.spec.ts
          tests/e2e/auth-provider-response-safety.spec.ts
          tests/e2e/auth-refresh-request-propagation.spec.ts
          tests/e2e/source-metadata-auth-boundary.spec.ts
          tests/e2e/source-overview-10.0.53.spec.ts
          --project=chromium-desktop

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: auth-session-regression-${{ github.sha }}
          path: playwright-report/
          retention-days: 7
