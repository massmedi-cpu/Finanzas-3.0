name: One-shot Financial App 3.4.7 control ownership cleanup

on:
  push:
    branches:
      - chore/3.4.7-control-style-ownership

permissions:
  contents: write

jobs:
  rebuild-control-ownership:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/3.4.7-control-style-ownership
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild canonical CSS ownership
        run: |
          node <<'NODE'
          const fs=require('fs');
          function edit(file,replacements){
            let s=fs.readFileSync(file,'utf8');
            for(const [from,to] of replacements){
              if(!s.includes(from)) throw new Error(`${file}: expected fragment missing: ${from.slice(0,90)}`);
              s=s.replace(from,to);
            }
            fs.writeFileSync(file,s);
          }

          edit('app/controls.css',[
            ['.primary-action,.ghost,.danger-action,.icon-button{','button{font:inherit}\n.primary-action,.ghost,.danger-action,.icon-button{'],
            ['.button-link{color:inherit}','.button-link{display:inline-flex;align-items:center;text-decoration:none;color:inherit}']
          ]);

          edit('app/globals.css',[
            ['@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--surface:#151b23;--surface-2:#1b232d;--text:#f2f5f7;--muted:#9aa6b2;--border:#283341;--accent:#6c91ff;--accent-soft:#202d50;--success:#58c996;--shadow:0 12px 35px rgba(0,0,0,.25)}}\n','@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--surface:#151b23;--surface-2:#1b232d;--text:#f2f5f7;--muted:#9aa6b2;--border:#283341;--accent:#6c91ff;--accent-soft:#202d50;--success:#58c996;--shadow:0 12px 35px rgba(0,0,0,.25)}}\nhtml[data-theme="light"]{color-scheme:light;--bg:#f4f6f8;--surface:#fff;--surface-2:#f8fafb;--text:#17202a;--muted:#65717d;--border:#dfe5ea;--accent:#1f5eff;--accent-soft:#eaf0ff;--success:#197a50;--shadow:0 12px 35px rgba(28,39,49,.07)}\nhtml[data-theme="dark"]{color-scheme:dark;--bg:#0d1117;--surface:#151b23;--surface-2:#1b232d;--text:#f2f5f7;--muted:#9aa6b2;--border:#283341;--accent:#6c91ff;--accent-soft:#202d50;--success:#58c996;--shadow:0 12px 35px rgba(0,0,0,.25)}\n'],
            ['button{font:inherit}\n.ghost{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}\n.button-link{color:var(--text)}\n',''],
            ['button:disabled,[aria-disabled="true"]{cursor:not-allowed;opacity:.58}\nbutton[aria-busy="true"],a[aria-busy="true"]{cursor:progress}\n.sidebar nav a,.ghost,.primary-action,.cf-series-controls button{min-height:44px}','.sidebar nav a,.cf-series-controls button{min-height:44px}']
          ]);

          edit('app/accounts.css',[[
            '.accounts-workspace,.account-detail-workspace{max-width:1500px}.button-link{display:inline-flex;align-items:center;text-decoration:none}',
            '.accounts-workspace,.account-detail-workspace{max-width:1500px}'
          ]]);

          edit('app/archive.css',[[
            '.archive-actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.danger-action{border:1px solid #d92d20;background:transparent;color:#b42318;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.archive-editor',
            '.archive-actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.archive-editor'
          ]]);

          edit('app/control.css',[[
            '.close-form button{width:100%;margin-top:10px}.primary-action{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font:inherit;font-weight:800;cursor:pointer}.primary-action:disabled{opacity:.5;cursor:not-allowed}.control-history',
            '.close-form button{width:100%;margin-top:10px}.control-history'
          ]]);

          edit('app/goals.css',[
            ['.goals-toolbar span{margin-top:4px;color:var(--muted);font-size:13px}.primary-action{border:0;border-radius:10px;background:var(--accent);color:white;padding:11px 16px;font-weight:800;cursor:pointer}.goals-feedback','.goals-toolbar span{margin-top:4px;color:var(--muted);font-size:13px}.goals-feedback'],
            ['.goals-modal-head h2{margin:0}.icon-button{width:36px;height:36px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:23px;cursor:pointer}.goals-form','.goals-modal-head h2{margin:0}.goals-modal-head .icon-button{width:36px;height:36px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:23px}.goals-form']
          ]);

          edit('app/movements.css',[
            ['.movements-workspace{max-width:1780px}.button-link{display:inline-flex;align-items:center;text-decoration:none}.movements-heading','.movements-workspace{max-width:1780px}.movements-heading'],
            ['.filter-actions{grid-column:3/-1;display:flex;justify-content:flex-end;gap:8px}.primary-action{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer}.primary-action:disabled,.ghost:disabled{opacity:.55;cursor:wait}.inline-alert{border-radius:10px;padding:11px 14px;font-size:13px;border:1px solid var(--border);background:var(--surface)}.inline-alert.success{color:var(--success)}.inline-alert.error{color:#b42318}.movement-table-wrap','.filter-actions{grid-column:3/-1;display:flex;justify-content:flex-end;gap:8px}.movement-table-wrap'],
            ['.status-badge.muted{color:var(--muted)}.empty-state{display:grid;place-items:center;gap:6px;min-height:180px;color:var(--muted)}.empty-state strong{color:var(--text)}.pagination','.status-badge.muted{color:var(--muted)}.pagination'],
            ['.drawer-head p:not(.eyebrow){margin:7px 0 0;color:var(--muted);font-size:13px}.icon-button{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:24px;cursor:pointer}.source-lock','.drawer-head p:not(.eyebrow){margin:7px 0 0;color:var(--muted);font-size:13px}.movement-drawer .icon-button{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:24px}.source-lock'],
            ['@media(prefers-color-scheme:dark){.negative{color:#ff8a80}.inline-alert.error{color:#ff8a80}.status-badge.warning{color:#ffd166}}','@media(prefers-color-scheme:dark){.negative{color:#ff8a80}.status-badge.warning{color:#ffd166}}'],
            ['.sidebar{height:76px;padding:7px 5px}.sidebar nav{display:flex;overflow-x:auto;overflow-y:hidden;gap:4px;scrollbar-width:none}.sidebar nav::-webkit-scrollbar{display:none}.sidebar nav a,.sidebar nav a:nth-child(n+6){display:flex;align-items:center;justify-content:center;flex:0 0 auto;min-width:92px;padding:6px 8px;font-size:10.5px!important;text-align:center}.sidebar nav a.active{box-shadow:inset 0 -3px var(--accent)}','']
          ]);

          edit('app/net-worth.css',[[
            '.nw-primary:disabled,.ghost:disabled{opacity:.5;cursor:not-allowed}',
            '.nw-primary:disabled{opacity:.5;cursor:not-allowed}'
          ]]);

          edit('app/settings.css',[[
            '.danger-action{min-height:42px;border:0;border-radius:9px;padding:10px 14px;background:#b42318;color:#fff;font:inherit;font-weight:800;cursor:pointer}.danger-action:disabled{opacity:.45;cursor:not-allowed}:root[data-theme="light"]{color-scheme:light;--bg:#f4f6f8;--surface:#fff;--surface-2:#f8fafb;--text:#17202a;--muted:#65717d;--border:#dfe5ea;--accent:#1f5eff;--accent-soft:#eaf0ff;--success:#197a50;--shadow:0 12px 35px rgba(28,39,49,.07)}:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1117;--surface:#151b23;--surface-2:#1b232d;--text:#f2f5f7;--muted:#9aa6b2;--border:#283341;--accent:#6c91ff;--accent-soft:#202d50;--success:#58c996;--shadow:0 12px 35px rgba(0,0,0,.25)}',
            '.restore-box .danger-action{background:#b42318;color:#fff;border-color:#b42318}'
          ]]);

          edit('app/tablet.css',[[
            '  button,a,input,select,textarea{scroll-margin-top:78px}',
            '  :where(button,a,input,select,textarea){scroll-margin-top:78px}'
          ]]);

          const audit='scripts/audit-current.mjs';
          let a=fs.readFileSync(audit,'utf8');
          const anchor='const rootLayout=read("app/layout.tsx");';
          if(!a.includes(anchor)) throw new Error('audit-current rootLayout anchor missing');
          if(a.includes('sharedControlSelectors')) throw new Error('shared control audit already exists');
          const gate=`const cssFiles=files.filter(file=>file.endsWith(".css"));\nconst sharedControlSelectors=new Set([\n  "button",".primary-action",".ghost",".danger-action",".icon-button",".button-link",\n  "button:disabled","[aria-disabled=\\"true\\"]","button[aria-busy=\\"true\\"]","a[aria-busy=\\"true\\"]",\n  ".inline-alert",".inline-alert.success",".inline-alert.error",".empty-state",".empty-state strong"\n]);\nfunction splitSelectorList(prelude){const selectors=[];let current="",round=0,square=0;for(const char of prelude){if(char==="(")round++;else if(char===")")round=Math.max(0,round-1);else if(char==="[")square++;else if(char==="]")square=Math.max(0,square-1);if(char===","&&round===0&&square===0){if(current.trim())selectors.push(current.trim());current="";continue;}current+=char;}if(current.trim())selectors.push(current.trim());return selectors;}\nfunction cssSelectors(source){const clean=source.replace(/\\/\\*[\\s\\S]*?\\*\\//g,"");const selectors=[];for(const match of clean.matchAll(/([^{}]+)\\{/g)){const prelude=String(match[1]||"").trim();if(!prelude||prelude.startsWith("@"))continue;selectors.push(...splitSelectorList(prelude));}return selectors;}\nfor(const file of cssFiles){const selectors=cssSelectors(read(file));if(file!=="app/controls.css"){for(const selector of selectors)must(!sharedControlSelectors.has(selector),\`Selector compartido \${selector} redefinido fuera de controls.css: \${file}\`);for(const selector of selectors){const unscopedState=/^\\.(?:primary-action|ghost|danger-action|icon-button|button-link|inline-alert|empty-state)(?=[:[])/.test(selector);must(!unscopedState,\`Estado de control compartido redefinido sin ámbito fuera de controls.css: \${selector} en \${file}\`);}}}\nconst controls=read("app/controls.css");\nfor(const token of ["button{font:inherit}",".primary-action{","background:var(--accent)",".ghost{",".danger-action{",".icon-button{",".button-link{display:inline-flex",".inline-alert{",".empty-state{","button:disabled","button[aria-busy=\\"true\\"]",".primary-action[aria-busy=\\"true\\"]::before"]) must(controls.includes(token),\`controls.css ha perdido la garantía compartida: \${token}\`);\nconst globals=read("app/globals.css");\nmust(globals.includes('html[data-theme="light"]')&&globals.includes('html[data-theme="dark"]'),"La paleta de tema manual debe vivir en globals.css");\nconst settingsCss=read("app/settings.css");\nmust(!settingsCss.includes(':root[data-theme="light"]')&&!settingsCss.includes(':root[data-theme="dark"]'),"Configuración no puede ser propietaria de la paleta global");\nconst movementsCss=read("app/movements.css");\nmust(!movementsCss.includes(".sidebar nav")&&!movementsCss.includes(".sidebar{"),"Movimientos no puede redefinir la navegación global");\n\n`;
          a=a.replace(anchor,gate+anchor);
          fs.writeFileSync(audit,a);

          fs.writeFileSync('lib/app-version.ts','export const APP_VERSION = "3.4.7" as const;\nexport const APP_RELEASE_LABEL = `Financial App ${APP_VERSION}` as const;\n');
          fs.writeFileSync('database/FINANCIAL_APP_3.4.7_CONTROL_STYLE_OWNERSHIP.sql',`begin;\n\n-- Financial App 3.4.7\n-- Cierre de propiedad única de controles y tema. No modifica datos ni esquema;\n-- alinea únicamente la versión persistida con la entrega de mantenimiento.\ninsert into financial_app.app_meta(key,value,updated_at) values\n  ('app_version',to_jsonb('3.4.7'::text),now()),\n  ('target_version',to_jsonb('3.4.7'::text),now())\non conflict(key) do update set value=excluded.value,updated_at=excluded.updated_at;\n\ncommit;\n`);
          NODE
      - name: Align npm manifests
        run: npm version 3.4.7 --no-git-tag-version
      - name: Commit reconstructed cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib scripts database package.json package-lock.json
          git commit -m "refactor: centralize shared control and theme ownership"
          git push origin HEAD:chore/3.4.7-control-style-ownership
