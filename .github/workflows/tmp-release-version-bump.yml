name: Temporary 10.0.2 version bump

on:
  push:
    branches:
      - 'tmp/release-10.0.2-bump'

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact temporary branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bump package metadata atomically with npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "10.0.1"
          npm version 10.0.2 --no-git-tag-version
          test "$(node -p "require('./package.json').version")" = "10.0.2"
          test "$(node -p "require('./package-lock.json').version")" = "10.0.2"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "10.0.2"

      - name: Remove temporary workflow and prove narrow diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-release-version-bump.yml
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected=$'.github/workflows/tmp-release-version-bump.yml\npackage-lock.json\npackage.json'
          test "$changed" = "$expected"
          git diff -- package.json package-lock.json

      - name: Commit generated version files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "financial-app-release-bot"
          git config user.email "financial-app-release-bot@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): generate 10.0.2 package metadata"
          git push origin HEAD:tmp/release-10.0.2-bump
