name: Prepare Release 10.0.51 Candidate

on:
  push:
    branches:
      - release/candidate-10.0.51
    paths:
      - ".github/workflows/prepare-release-10.0.51-candidate.yml"

permissions:
  contents: write

concurrency:
  group: prepare-release-10.0.51-candidate
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: release/candidate-10.0.51
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Synchronize package and lock to 10.0.51
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "10.0.50"
          test "$(node -p "require('./package-lock.json').version")" = "10.0.50"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "10.0.50"
          npm version 10.0.51 --no-git-tag-version
          test "$(node -p "require('./package.json').version")" = "10.0.51"
          test "$(node -p "require('./package-lock.json').version")" = "10.0.51"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "10.0.51"

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Remove ephemeral preparation workflow
        run: rm .github/workflows/prepare-release-10.0.51-candidate.yml

      - name: Commit prepared candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/prepare-release-10.0.51-candidate.yml
          git diff --cached --check
          git commit -m "REL-051: versionar candidato Financial App 10.0.51"
          git push origin HEAD:release/candidate-10.0.51
