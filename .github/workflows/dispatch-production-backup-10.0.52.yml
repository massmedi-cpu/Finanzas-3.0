name: Dispatch Production Backup v2 · 10.0.52

on:
  push:
    branches:
      - ops/backup-10.0.52
    paths:
      - ".github/workflows/dispatch-production-backup-10.0.52.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: dispatch-production-backup-10.0.52
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical Production Backup v2 on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-backup-v2.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f source_commit=d4be52a3574146b78d15db60b7af8f87c6ea7da4 \
            -f expected_app_version=10.0.52
          echo "Dispatched canonical Production Backup v2 for Financial App 10.0.52."
