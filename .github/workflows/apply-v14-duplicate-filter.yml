name: Apply Financial App 1.4 duplicate filter UI

on:
  push:
    branches: [financial-app-rebuild]
    paths:
      - '.github/workflows/apply-v14-duplicate-filter.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: financial-app-rebuild
      - name: Patch movements UI
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='app/movimientos/movements-client.tsx';
          let text=readFileSync(path,'utf8');
          const openOld='filters.merchant||filters.subcategory||filters.channel||filters.tag||filters.recurring||filters.internalTransfer||filters.reconciled||filters.documents||filters.splits||filters.from||filters.to||filters.min||filters.max';
          const openNew='filters.merchant||filters.subcategory||filters.channel||filters.tag||filters.duplicate||filters.recurring||filters.internalTransfer||filters.reconciled||filters.documents||filters.splits||filters.from||filters.to||filters.min||filters.max';
          if(!text.includes(openOld)) throw new Error('advanced filter open marker not found');
          text=text.replace(openOld,openNew);
          const marker='<label><span>Recurrente</span><select value={filters.recurring} onChange={e=>setFilters({...filters,recurring:e.target.value as TriFilter})}><option value="">Todos</option><option value="1">Sí</option><option value="0">No</option></select></label>';
          const insertion=marker+'\n          <label><span>Duplicado</span><select value={filters.duplicate} onChange={e=>setFilters({...filters,duplicate:e.target.value as TriFilter})}><option value="">Todos</option><option value="1">Solo duplicados</option><option value="0">Excluir duplicados</option></select></label>';
          if(!text.includes(marker)) throw new Error('recurring filter marker not found');
          text=text.replace(marker,insertion);
          writeFileSync(path,text);
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/movimientos/movements-client.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(financial-app): expose duplicate movement filter"
          git push origin HEAD:financial-app-rebuild
