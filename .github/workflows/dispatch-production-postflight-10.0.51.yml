name: Dispatch Production Postflight 10.0.51

on:
  push:
    branches:
      - "ops/dispatch-postflight-10.0.51"
    paths:
      - ".github/workflows/dispatch-production-postflight-10.0.51.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch official Production Postflight on frozen 10.0.51
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-postflight.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f production_url=https://finanzas-3-0-refbwlkq8-massmedi-9832s-projects.vercel.app/ \
            -f expected_version=10.0.51 \
            -f deployment_commit=9ac33645d39d6a709bc9c0f3f2adef5106d90d71 \
            -f deployment_id=dpl_T8wWD3wLxS5QVSrQqM1aQc9TcB9H
          echo "production_postflight_dispatch_requested version=10.0.51 deployment=dpl_T8wWD3wLxS5QVSrQqM1aQc9TcB9H"
