name: Sync Premium Release Lockfile

on:
  push:
    branches:
      - audit/premium-visual-pass-20260925

permissions:
  contents: write

concurrency:
  group: sync-premium-release-lock
  cancel-in-progress: true

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: audit/premium-visual-pass-20260925
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile metadata only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit only when package-lock changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(release): sync lockfile for 10.0.4 [skip ci]"
          git push origin HEAD:audit/premium-visual-pass-20260925
