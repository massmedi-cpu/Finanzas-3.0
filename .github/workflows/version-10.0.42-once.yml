name: Version Financial App 10.0.42 Once

on:
  push:
    branches:
      - refactor/release-maintenance-ci-10.0.42
    paths:
      - ".github/workflows/version-10.0.42-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/release-maintenance-ci-10.0.42
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm version 10.0.42 --no-git-tag-version
      - name: Commit synchronized package metadata and retire this workflow
        run: |
          rm .github/workflows/version-10.0.42-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/version-10.0.42-once.yml
          git commit -m "chore(release): version Financial App 10.0.42"
          git push origin HEAD:refactor/release-maintenance-ci-10.0.42
