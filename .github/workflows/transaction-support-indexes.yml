name: Transaction Support Indexes

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260926190000_cover_transaction_support_workspace_foreign_keys.sql'
      - 'tests/e2e/transaction-support-index-contract.spec.ts'
      - '.github/workflows/transaction-support-indexes.yml'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transaction-support-indexes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Transaction support composite FK index contract
        run: npx playwright test tests/e2e/transaction-support-index-contract.spec.ts --project=chromium-desktop
