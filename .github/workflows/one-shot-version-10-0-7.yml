name: One Shot Version 10.0.7

on:
  push:
    branches:
      - 'audit/inicio-privacy-10.0.7'
    paths:
      - '.github/workflows/one-shot-version-10-0-7.yml'

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: audit/inicio-privacy-10.0.7
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Synchronize package version and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          npm version 10.0.7 --no-git-tag-version
          rm .github/workflows/one-shot-version-10-0-7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/one-shot-version-10-0-7.yml
          git diff --cached --check
          git commit -m "chore: version Financial App 10.0.7"
          git push origin HEAD:audit/inicio-privacy-10.0.7
