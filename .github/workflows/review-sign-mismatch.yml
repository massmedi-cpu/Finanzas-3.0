name: Review Sign Mismatch

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/review/review-client.tsx"
      - "tests/e2e/review-action-center.spec.ts"
      - "tests/e2e/review-center.spec.ts"
      - ".github/workflows/review-sign-mismatch.yml"
      - ".github/workflows/sign-mismatch-review.yml"
      - ".github/workflows/financial-consistency-ci-gates-10.0.40.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Review sign mismatch contracts and UX
        run: npx playwright test tests/e2e/review-action-center.spec.ts tests/e2e/review-center.spec.ts --project=chromium-desktop --project=chromium-mobile --workers=2
