name: Release 10.0.65

on:
  push:
    branches:
      - release/10.0.65-mobile-quality
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify mobile quality contract
        run: npm run verify:mobile-quality

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Responsive matrix
        run: npm run test:responsive-matrix

      - name: Mobile quality 10.0.65
        run: npm run test:mobile-quality
