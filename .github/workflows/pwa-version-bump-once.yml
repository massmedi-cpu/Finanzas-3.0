name: PWA Version Bump Once

on:
  push:
    branches:
      - audit/pwa-android-install-10.0.10
    paths:
      - ".github/workflows/pwa-version-bump-once.yml"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/pwa-android-install-10.0.10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set package version
        run: npm version 10.0.10 --no-git-tag-version
      - name: Commit version files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): set version 10.0.10"
          git push origin HEAD:audit/pwa-android-install-10.0.10

# Intentionally one-shot: remove after the synchronized version commit lands.
