name: Temp category editor fix v5

on:
  push:
    branches:
      - fix/category-subcategory-editor-20260914

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar editor categoría-subcategoría
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/transactions/transactions-client.tsx')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'No encontrado: {label}')
              s = s.replace(old, new, 1)

          replace_once('''type EditorState = {
            concept: string;
            merchant: string;
            category: string;
            kind: string;
            reviewState: string;
            excludedFromAnalytics: boolean;
            note: string;
          };''', '''type CategoryEditorMode = "inherit" | "set";

          type EditorState = {
            concept: string;
            merchant: string;
            categoryMode: CategoryEditorMode;
            categoryRoot: string;
            categoryLeaf: string;
            kind: string;
            reviewState: string;
            excludedFromAnalytics: boolean;
            note: string;
          };''', 'EditorState')

          start = s.index('function editorFor(row: TransactionRow): EditorState {')
          end = s.index('\n\nexport default function TransactionsClient()', start)
          s = s[:start] + '''function categorySelectionFor(categories: Facets["categories"], categoryId: string | null) {
            if (!categoryId) return { root: NONE, leaf: "" };
            const category = categories.find((candidate) => candidate.id === categoryId);
            if (!category) return { root: NONE, leaf: "" };
            return category.parent_category_id
              ? { root: category.parent_category_id, leaf: category.id }
              : { root: category.id, leaf: "" };
          }

          function activeSubcategories(categories: Facets["categories"], rootId: string) {
            if (!rootId || rootId === NONE) return [];
            return categories
              .filter((category) => category.lifecycle === "active" && category.parent_category_id === rootId)
              .sort((a, b) => a.sort_order - b.sort_order || a.name.localeCompare(b.name, "es"));
          }

          function selectedCategoryId(editor: EditorState, categories: Facets["categories"]) {
            if (editor.categoryRoot === NONE) return null;
            const children = activeSubcategories(categories, editor.categoryRoot);
            return children.length > 0 ? (editor.categoryLeaf || null) : editor.categoryRoot;
          }

          function editorFor(row: TransactionRow, categories: Facets["categories"]): EditorState {
            const categoryWasOverridden = row.overriddenFields.includes("category");
            const merchantWasOverridden = row.overriddenFields.includes("merchant");
            const selection = categorySelectionFor(categories, row.category.effectiveId);
            return {
              concept: row.concept.effective,
              merchant: merchantWasOverridden ? (row.merchant.effectiveId ?? NONE) : INHERIT,
              categoryMode: categoryWasOverridden ? "set" : "inherit",
              categoryRoot: selection.root,
              categoryLeaf: selection.leaf,
              kind: row.overriddenFields.includes("kind") ? row.kind.effective : INHERIT,
              reviewState: row.overriddenFields.includes("reviewState") ? row.reviewState.effective : INHERIT,
              excludedFromAnalytics: row.excludedFromAnalytics,
              note: row.userNote ?? "",
            };
          }

          function individualPatch(row: TransactionRow, editor: EditorState, categories: Facets["categories"]) {
            const concept = editor.concept.trim();
            return {
              concept: concept === row.concept.processed ? null : concept,
              merchantMode: editor.merchant === INHERIT ? "inherit" : "set",
              merchantId: editor.merchant === INHERIT || editor.merchant === NONE ? null : editor.merchant,
              categoryMode: editor.categoryMode,
              categoryId: editor.categoryMode === "inherit" ? null : selectedCategoryId(editor, categories),
              kind: editor.kind === INHERIT ? null : editor.kind,
              reviewState: editor.reviewState === INHERIT ? null : editor.reviewState,
              excludedFromAnalytics: editor.excludedFromAnalytics,
              note: editor.note.trim() || null,
            } satisfies Record<string, unknown>;
          }''' + s[end:]

          replace_once('  const [conceptError, setConceptError] = useState("");\n', '  const [conceptError, setConceptError] = useState("");\n  const [categoryError, setCategoryError] = useState("");\n', 'categoryError')

          anchor = '  const selectedSet = useMemo(() => new Set(selectedIds), [selectedIds]);\n'
          root_block = '''  const activeRootCategories = useMemo(
            () => facets.categories
              .filter((category) => category.lifecycle === "active" && category.parent_category_id === null)
              .sort((a, b) => a.sort_order - b.sort_order || a.name.localeCompare(b.name, "es")),
            [facets.categories],
          );

          '''
          replace_once(anchor, root_block + anchor, 'activeRootCategories')

          edit_start = s.index('  function beginEdit(row: TransactionRow) {')
          edit_end = s.index('\n\n  async function applyBulk()', edit_start)
          s = s[:edit_start] + '''  function beginEdit(row: TransactionRow) {
            setEditingId(row.id);
            setEditor(editorFor(row, facets.categories));
            setConceptError("");
            setCategoryError("");
            setError(null);
            setNotice(null);
            closeReview();
          }

          function cancelEdit() {
            setEditingId(null);
            setEditor(null);
            setConceptError("");
            setCategoryError("");
          }

          async function saveEdit(row: TransactionRow) {
            if (!editor || editingId !== row.id) return;
            if (!editor.concept.trim()) {
              setError(null);
              setConceptError("El concepto no puede quedar vacío.");
              conceptInputRef.current?.focus();
              return;
            }
            const children = activeSubcategories(facets.categories, editor.categoryRoot);
            if (editor.categoryMode === "set" && editor.categoryRoot !== NONE && children.length > 0 && !editor.categoryLeaf) {
              setError(null);
              setCategoryError("Selecciona una subcategoría.");
              return;
            }
            setConceptError("");
            setCategoryError("");
            await patchTransactions([row.id], individualPatch(row, editor, facets.categories), "Movimiento actualizado");
          }''' + s[edit_end:]

          old_select = '''                            <label><span>Categoría</span><select data-testid="edit-category" value={editor.category} onChange={(event) => setEditor({ ...editor, category: event.target.value })}><option value={INHERIT}>Automática/original</option><option value={NONE}>Sin categoría</option>{facets.categories.filter((category) => category.lifecycle === "active").map((category) => <option key={category.id} value={category.id}>{category.name}</option>)}</select></label>'''
          new_select = '''                            <label><span>Categoría</span><select data-testid="edit-category-root" value={editor.categoryRoot} onChange={(event) => {
                              const categoryRoot = event.target.value;
                              setEditor({ ...editor, categoryMode: "set", categoryRoot, categoryLeaf: "" });
                              setCategoryError("");
                            }}><option value={NONE}>Sin categoría</option>{activeRootCategories.map((category) => <option key={category.id} value={category.id}>{category.name}</option>)}</select><small>{editor.categoryMode === "inherit" ? "Asignación automática" : "Asignación manual"}</small></label>
                            <label><span>Subcategoría</span><select data-testid="edit-subcategory" value={editor.categoryLeaf} disabled={editor.categoryRoot === NONE || activeSubcategories(facets.categories, editor.categoryRoot).length === 0} aria-invalid={categoryError ? "true" : "false"} onChange={(event) => {
                              setEditor({ ...editor, categoryMode: "set", categoryLeaf: event.target.value });
                              setCategoryError("");
                            }}>{activeSubcategories(facets.categories, editor.categoryRoot).length > 0 ? <><option value="">Selecciona una subcategoría</option>{activeSubcategories(facets.categories, editor.categoryRoot).map((category) => <option key={category.id} value={category.id}>{category.name}</option>)}</> : <option value="">No hay subcategorías</option>}</select>{categoryError ? <small className={styles.fieldError} role="alert">{categoryError}</small> : null}</label>
                            <div className={`${styles.editorWide} ${styles.categoryAssignment}`}><button data-testid="reset-category-auto" className={styles.secondaryButton} type="button" disabled={saving || editor.categoryMode === "inherit"} onClick={() => {
                              const automatic = categorySelectionFor(facets.categories, row.category.originalId);
                              setEditor({ ...editor, categoryMode: "inherit", categoryRoot: automatic.root, categoryLeaf: automatic.leaf });
                              setCategoryError("");
                            }}>Restablecer categoría automática</button><small>Asignación automática actual: {row.category.originalName ?? "Sin categoría"}</small></div>'''
          replace_once(old_select, new_select, 'category JSX')
          replace_once('<div className={styles.editorHeading}><div><strong>Editar movimiento</strong><span>Solo se modifica la capa personal de overrides.</span></div>', '<div className={styles.editorHeading}><div><strong>Editar movimiento</strong><span>La categoría se asigna automáticamente hasta que tú la cambias.</span></div>', 'heading')
          p.write_text(s)

          page = Path('app/transactions/page.tsx')
          page.write_text(page.read_text().replace('import AutomaticCategoryLabel from "./automatic-category-label";\n', '').replace('      <AutomaticCategoryLabel />\n', ''))
          helper = Path('app/transactions/automatic-category-label.tsx')
          if helper.exists(): helper.unlink()

          cssp = Path('app/transactions/transactions.module.css')
          css = cssp.read_text()
          marker = '.editorWide { grid-column: span 2; }'
          if '.categoryAssignment {' not in css:
              if marker not in css: raise SystemExit('CSS marker no encontrado')
              css = css.replace(marker, marker + '\n.categoryAssignment { display: grid; align-content: end; gap: .35rem; }\n.categoryAssignment small { color: var(--color-text-muted); font-size: .875rem; font-weight: 600; line-height: 1.35; }', 1)
          cssp.write_text(css)

          old_test = Path('tests/e2e/automatic-category-label-contract.spec.ts')
          if old_test.exists(): old_test.unlink()
          Path('tests/e2e/category-editor-contract.spec.ts').write_text('''import { expect, test } from "@playwright/test";\nimport fs from "node:fs";\n\nconst client = fs.readFileSync("app/transactions/transactions-client.tsx", "utf8");\nconst page = fs.readFileSync("app/transactions/page.tsx", "utf8");\n\ntest("categoría y subcategoría son campos reales y automática es un estado", async () => {\n  expect(client).toContain('data-testid="edit-category-root"');\n  expect(client).toContain('data-testid="edit-subcategory"');\n  expect(client).toContain('Restablecer categoría automática');\n  expect(client).toContain('Asignación automática');\n  expect(client).toContain('categoryMode: "inherit"');\n  expect(client).toContain('categoryMode: "set"');\n  expect(client).not.toContain('data-testid="edit-category" value={editor.category}');\n  expect(page).not.toContain('AutomaticCategoryLabel');\n});\n''')
          PY
          git diff --check
          grep -q 'data-testid="edit-category-root"' app/transactions/transactions-client.tsx
          grep -q 'data-testid="edit-subcategory"' app/transactions/transactions-client.tsx
          grep -q 'Restablecer categoría automática' app/transactions/transactions-client.tsx
          ! grep -q 'AutomaticCategoryLabel' app/transactions/page.tsx
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/transactions tests/e2e
          git commit -m "fix(transactions): separar categoría y subcategoría"
          git push origin HEAD
