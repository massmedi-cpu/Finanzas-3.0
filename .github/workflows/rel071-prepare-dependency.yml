name: REL-071 Prepare Next Security Update

on:
  push:
    branches:
      - release/10.0.71-next-security
    paths:
      - .github/workflows/rel071-prepare-dependency.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/10.0.71-next-security
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Bump Financial App release identity
        run: npm version 10.0.71 --no-git-tag-version

      - name: Upgrade Next.js to patched release
        run: npm install next@16.3.8 --save-exact

      - name: Verify critical dependency audit
        run: npm audit --audit-level=critical

      - name: TypeScript
        run: npm run typecheck

      - name: Production build and postbuild audits
        run: npm run build

      - name: Commit deterministic dependency update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --exit-code && { echo "No dependency changes generated"; exit 1; } || true
          git commit -m "REL-071 · Financial App 10.0.71 · parche crítico Next.js 16.3.8"
          git push origin HEAD:release/10.0.71-next-security
