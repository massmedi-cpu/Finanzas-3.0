name: One-shot sync and version 10.0.46

on:
  push:
    branches:
      - feat/ocr-review-workbench-10.0.46
    paths:
      - .github/workflows/one-shot-sync-version-10.0.46.yml

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/ocr-review-workbench-10.0.46
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge certified main 10.0.45
        run: |
          git fetch origin main
          git merge --no-edit origin/main

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set package and lock to 10.0.46
        run: npm version 10.0.46 --no-git-tag-version --allow-same-version

      - name: Verify version identity
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='10.0.46'||l.version!=='10.0.46'||l.packages?.['']?.version!=='10.0.46') process.exit(1)"

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-sync-version-10.0.46.yml
          git add package.json package-lock.json .github/workflows/one-shot-sync-version-10.0.46.yml
          git commit -m "chore(release): Financial App 10.0.46"
          git push origin HEAD:feat/ocr-review-workbench-10.0.46
