name: Forecast Indexes 10.0.16

on:
  push:
    branches:
      - audit/forecast-fk-indexes-10.0.16
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260926180500_cover_forecast_workspace_foreign_keys.sql'
      - 'tests/e2e/forecast-index-contract.spec.ts'
      - '.github/workflows/forecast-indexes-10.0.16.yml'

permissions:
  contents: read

concurrency:
  group: forecast-indexes-10.0.16-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Forecast composite FK index contract
        run: npx playwright test tests/e2e/forecast-index-contract.spec.ts --project=chromium-desktop
