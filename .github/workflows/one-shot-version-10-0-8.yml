name: One Shot Version 10.0.8

on:
  push:
    branches:
      - 'audit/inicio-sync-feedback-10.0.8'
    paths:
      - '.github/workflows/one-shot-version-10-0-8.yml'

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: audit/inicio-sync-feedback-10.0.8
          fetch-depth: 0

      - name: Bump package and lock to 10.0.8
        shell: bash
        run: |
          set -euo pipefail
          npm version 10.0.8 --no-git-tag-version --allow-same-version
          node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!=='10.0.8'||l.version!=='10.0.8'||l.packages[''].version!=='10.0.8')process.exit(1)"

      - name: Commit versioned candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "chore: bump Financial App to 10.0.8"
          git push origin HEAD:audit/inicio-sync-feedback-10.0.8
