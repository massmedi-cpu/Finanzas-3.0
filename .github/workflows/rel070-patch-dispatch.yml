name: REL-070 Patch Dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rel070-patch-dispatch.yml

permissions:
  contents: write

jobs:
  patch-release-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout REL-070 candidate
        uses: actions/checkout@v6
        with:
          ref: release/10.0.70-transactions-concurrency
          fetch-depth: 0

      - name: Apply REL-070 patch
        run: python scripts/rel070-apply-transactions-concurrency.py

      - name: Commit clean REL-070 patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(rel-070): aislar concurrencia de Movimientos"
          git push origin HEAD:release/10.0.70-transactions-concurrency
