name: Export V3.0.0 backup for Drive

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          ref: 9c32ea68f5eeeccd3c0f56b62cde43ed0bdbee44
          fetch-depth: 1

      - name: Create exact source archive
        shell: bash
        run: |
          git archive --format=zip --output=Finanzas_3.0_V3.0.0_codigo_9c32ea68_2026-08-21.zip 9c32ea68f5eeeccd3c0f56b62cde43ed0bdbee44
          sha256sum Finanzas_3.0_V3.0.0_codigo_9c32ea68_2026-08-21.zip > Finanzas_3.0_V3.0.0_codigo_9c32ea68_2026-08-21.sha256.txt

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finanzas-3.0-V3.0.0-code-backup
          path: |
            Finanzas_3.0_V3.0.0_codigo_9c32ea68_2026-08-21.zip
            Finanzas_3.0_V3.0.0_codigo_9c32ea68_2026-08-21.sha256.txt
          if-no-files-found: error
          retention-days: 7
