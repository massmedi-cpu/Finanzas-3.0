name: Inicio Visual Restraint

on:
  push:
    branches:
      - 'audit/inicio-*'

permissions:
  contents: read

jobs:
  visual-restraint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Validate Inicio hierarchy and live-data contract
        run: >-
          npx playwright test
          tests/e2e/inicio-visual-restraint.spec.ts
          tests/e2e/inicio-live-data-contract.spec.ts
          --project=chromium-desktop
