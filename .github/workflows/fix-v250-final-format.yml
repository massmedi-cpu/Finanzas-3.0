name: Fix remaining 2.5 formats
on:
  push:
    branches: [develop/v2.5.0-month-close]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'remaining Spain number displays') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix exact remaining displays
        run: |
          node <<'NODE'
          const fs=require('fs');
          const items=[
            ['app/objetivos/goals-client.tsx','knownProgress.toLocaleString("es-ES",{maximumFractionDigits:1})+"%"','formatPercent(knownProgress,1)'],
            ['app/page.tsx','item.share.toLocaleString("es-ES",{maximumFractionDigits:1})+"%"','formatPercent(item.share,1)'],
            ['app/presupuesto/budget-client.tsx','item.percent.toLocaleString("es-ES",{maximumFractionDigits:1})+"%"','formatPercent(item.percent,1)']
          ];
          for(const [file,fromExpr,toExpr] of items){
            let text=fs.readFileSync(file,'utf8');
            // Expressions occur inside template literals, so replace source fragments rather than evaluated strings.
            const from=fromExpr.replace('+"%"','')+'}%';
            const to='${'+toExpr+'}';
            if(!text.includes(from))throw new Error(`${file}: no aparece ${from}`);
            text=text.replace(from,to);
            fs.writeFileSync(file,text);
          }
          NODE
      - name: Commit
        run: |
          git config user.name "financial-app-2.5-bot"
          git config user.email "financial-app-2.5-bot@users.noreply.github.com"
          git add app
          git commit -m "fix(2.5): remaining Spain number displays [skip ci]"
          git push origin HEAD:develop/v2.5.0-month-close
