name: Fix remaining 2.5 formats
on:
  push:
    branches: [develop/v2.5.0-month-close]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'repair final Spain format syntax') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair exact malformed replacements
        run: |
          node <<'NODE'
          const fs=require('fs');
          const fixes={
            'app/objetivos/goals-client.tsx':[['${${formatPercent(knownProgress,1)} registrado','${formatPercent(knownProgress,1)} registrado']],
            'app/page.tsx':[['<small>{${formatPercent(item.share,1)} · {item.movements} mov.</small>','<small>{formatPercent(item.share,1)} · {formatInteger(item.movements)} mov.</small>']],
            'app/presupuesto/budget-client.tsx':[['<span>{${formatPercent(item.percent,1)} consumido</span>','<span>{formatPercent(item.percent,1)} consumido</span>']]
          };
          for(const [file,repls] of Object.entries(fixes)){
            let text=fs.readFileSync(file,'utf8');
            for(const [from,to] of repls){if(!text.includes(from))throw new Error(`${file}: no aparece patrón esperado`);text=text.replace(from,to);}
            fs.writeFileSync(file,text);
          }
          NODE
      - name: Commit
        run: |
          git config user.name "financial-app-2.5-bot"
          git config user.email "financial-app-2.5-bot@users.noreply.github.com"
          git add app
          git commit -m "fix(2.5): repair final Spain format syntax [skip ci]"
          git push origin HEAD:develop/v2.5.0-month-close
