name: Budgets Premium Targeted E2E

on:
  push:
    branches:
      - 'work/premium-budgets-intelligence'

permissions:
  contents: read

jobs:
  budgets-targeted-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          for source in /etc/apt/sources.list.d/*; do
            if sudo grep -q 'dl.google.com/linux/chrome' "$source" 2>/dev/null; then
              sudo mv "$source" "${source}.disabled"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Run Budgets E2E only
        run: >-
          npm run test:e2e --
          tests/e2e/budgets.spec.ts
          tests/e2e/budgets-accessibility.spec.ts
          tests/e2e/premium-budgets-visual.spec.ts
          --project=chromium-desktop
          --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: budgets-premium-targeted-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

  budgets-protected-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
      deployments: read
      id-token: write
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERIFIED_FALLBACK_PREVIEW_SHA: f6b5224b0c8ebdd70d397233a5c84a6e6fae691d
      VERIFIED_FALLBACK_PREVIEW_URL: https://finanzas-3-0-ndpeevxgv-massmedi-9832s-projects.vercel.app
    steps:
      - name: Generate ephemeral GitHub OIDC token
        id: oidc
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Discover exact Preview or select verified fallback
        id: vercel
        uses: actions/github-script@v8
        env:
          FALLBACK_SHA: ${{ env.VERIFIED_FALLBACK_PREVIEW_SHA }}
          FALLBACK_URL: ${{ env.VERIFIED_FALLBACK_PREVIEW_URL }}
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function successfulPreview(deployment) {
              const statuses = await github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id: deployment.id, per_page: 30 });
              const status = statuses.data.find((candidate) => {
                const url = candidate.environment_url || candidate.target_url || '';
                return candidate.state === 'success' && /\.vercel\.app\/?$/i.test(url);
              });
              return status ? (status.environment_url || status.target_url).replace(/\/$/, '') : null;
            }

            for (let attempt = 1; attempt <= 4; attempt += 1) {
              const exact = await github.rest.repos.listDeployments({ owner, repo, sha: context.sha, per_page: 30 });
              for (const deployment of exact.data) {
                const url = await successfulPreview(deployment);
                if (url) {
                  core.setOutput('url', url);
                  core.setOutput('sha', deployment.sha);
                  core.setOutput('exact', 'true');
                  core.info(`Exact Budgets Preview discovered on attempt ${attempt}: ${url}`);
                  return;
                }
              }
              await sleep(5000);
            }

            const fallbackSha = process.env.FALLBACK_SHA;
            const fallbackUrl = process.env.FALLBACK_URL;
            if (!fallbackSha || !fallbackUrl) {
              core.setFailed('Verified fallback Budgets Preview metadata is missing.');
              return;
            }
            core.setOutput('url', fallbackUrl.replace(/\/$/, ''));
            core.setOutput('sha', fallbackSha);
            core.setOutput('exact', 'false');
            core.warning(`Exact Preview unavailable; using verified Budgets fallback ${fallbackSha}: ${fallbackUrl}`);

      - name: Verify fallback cannot hide Budgets runtime changes
        if: steps.vercel.outputs.exact != 'true'
        uses: actions/github-script@v8
        env:
          PREVIEW_SHA: ${{ steps.vercel.outputs.sha }}
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const previewSha = process.env.PREVIEW_SHA;
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${previewSha}...${context.sha}`,
              per_page: 100,
            });
            if (!['ahead', 'identical'].includes(comparison.data.status)) {
              core.setFailed(`Fallback Preview ${previewSha} is not an ancestor of ${context.sha}.`);
              return;
            }
            const criticalPrefixes = [
              'app/budgets/',
              'app/api/budgets/',
              'src/application/budgets/',
              'src/infrastructure/persistence/vercel-supabase-gateway.ts',
              'supabase/functions/financial-app-db-gateway/budget-logic.ts',
              'supabase/functions/financial-app-db-gateway/workspace-context.ts',
              'supabase/functions/financial-app-db-gateway/index.ts',
              'playwright.config.ts',
              'package.json',
              'package-lock.json',
              'next.config',
            ];
            const unsafe = (comparison.data.files || [])
              .map((file) => file.filename)
              .filter((filename) => criticalPrefixes.some((prefix) => filename === prefix || filename.startsWith(prefix)));
            if (unsafe.length > 0) {
              core.setFailed(`Fallback Preview is unsafe because Budgets runtime sources changed: ${unsafe.join(', ')}`);
              return;
            }
            core.info(`Fallback is safe: no Budgets runtime source changed between ${previewSha} and ${context.sha}.`);

      - name: Checkout exact branch commit
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          for source in /etc/apt/sources.list.d/*; do
            if sudo grep -q 'dl.google.com/linux/chrome' "$source" 2>/dev/null; then
              sudo mv "$source" "${source}.disabled"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Run Budgets workspace boundary against protected Preview
        env:
          VERCEL_PREVIEW_URL: ${{ steps.vercel.outputs.url }}
          BUDGETS_PREVIEW_SHA: ${{ steps.vercel.outputs.sha }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: >-
          npm run test:e2e --
          tests/e2e/budgets-protected-preview.spec.ts
          --project=chromium-desktop
          --project=chromium-mobile

      - name: Upload protected Preview report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: budgets-premium-protected-preview-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7
