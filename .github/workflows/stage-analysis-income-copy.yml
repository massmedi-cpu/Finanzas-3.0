name: Stage Analysis Partial Income Copy

on:
  push:
    branches:
      - rebuild/phase-analysis-budget-provenance
    paths:
      - ".github/workflows/stage-analysis-income-copy.yml"

permissions:
  contents: write

jobs:
  stage-partial-income-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v6
        with:
          ref: rebuild/phase-analysis-budget-provenance
          fetch-depth: 0

      - name: Apply exact presentation copy patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "app/analysis/analysis-client.tsx",
              'import { resolveBudgetSourcePresentation, resolveSavingsRatePresentation } from "../../src/application/analysis/analysis-presentation";',
              'import { resolveBudgetSourcePresentation, resolveIncomeComparisonPresentation, resolveSavingsRatePresentation } from "../../src/application/analysis/analysis-presentation";',
          )

          replace_once(
              "app/analysis/analysis-client.tsx",
              """  const savingsRatePresentation = snapshot ? resolveSavingsRatePresentation(snapshot) : null;\n""",
              """  const incomeComparisonPresentation = snapshot ? resolveIncomeComparisonPresentation(snapshot) : null;\n  const savingsRatePresentation = snapshot ? resolveSavingsRatePresentation(snapshot) : null;\n""",
          )

          replace_once(
              "app/analysis/analysis-client.tsx",
              """              comparison={`${formatPercentBps(snapshot.comparison.incomeChangeBps, true)} vs. periodo anterior`}\n""",
              """              comparison={incomeComparisonPresentation?.representative\n                ? `${formatPercentBps(incomeComparisonPresentation.changeBps, true)} vs. periodo anterior`\n                : incomeComparisonPresentation?.reason === \"partial_income_pending\"\n                  ? \"Comparación pendiente · ingresos aún no representativos\"\n                  : \"Comparación no disponible\"}\n""",
          )

          marker = 'test("E2 · Análisis mantiene la composición responsive en 360, 430, 768, 1024, 1280 y 1440 px", async ({ page }, testInfo) => {'
          extra = '''test("E2 · ingresos parciales no representativos explican por qué la comparación queda pendiente", async ({ page }) => {\n  test.skip(Boolean(process.env.VERCEL_PREVIEW_URL), "el Preview protegido valida la frontera real de workspace en otra prueba");\n  const snapshot = mockSnapshot();\n  snapshot.current = { ...snapshot.current, incomeCents: 38 };\n  snapshot.comparison = { ...snapshot.comparison, incomeChangeBps: null };\n\n  await loadMockAnalysis(page, snapshot);\n\n  const kpis = page.getByLabel("Indicadores principales del periodo");\n  await expect(kpis).toContainText("0,38");\n  await expect(kpis).toContainText("Comparación pendiente · ingresos aún no representativos");\n  await expect(kpis).not.toContainText("— vs. periodo anterior");\n});\n\n'''
          replace_once("tests/e2e/analysis.spec.ts", marker, extra + marker)

          Path(".github/workflows/stage-analysis-income-copy.yml").unlink()
          PY

      - name: Verify focused diff
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Commit copy fix without Vercel Preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/analysis/analysis-client.tsx tests/e2e/analysis.spec.ts .github/workflows/stage-analysis-income-copy.yml
          git commit -m "fix(analysis): explain pending partial income comparison"
          git push origin HEAD:rebuild/phase-analysis-budget-provenance
