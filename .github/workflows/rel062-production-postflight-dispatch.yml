name: REL-062 Production Postflight Dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rel062-production-postflight-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact 10.0.62 production postflight
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-postflight.yml \
            --ref main \
            -f production_url=https://financialapp-home.vercel.app/ \
            -f expected_version=10.0.62 \
            -f deployment_commit=e52eae72b2f9a7a0054134e252c2b6d465c1b659 \
            -f deployment_id=dpl_DXX9yN7tuckXMym62uafRpq3Ei3i
