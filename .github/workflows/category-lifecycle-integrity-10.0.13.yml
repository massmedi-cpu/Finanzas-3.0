name: Category Lifecycle Integrity 10.0.13

on:
  push:
    branches:
      - audit/category-lifecycle-integrity-10.0.13
  pull_request:
    branches:
      - main
    paths:
      - 'src/domain/category-visuals.ts'
      - 'src/domain/configuration.ts'
      - 'supabase/migrations/**'
      - 'tests/e2e/category-lifecycle-integrity.spec.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/category-lifecycle-integrity-10.0.13.yml'

permissions:
  contents: write

concurrency:
  group: category-lifecycle-integrity-10.0.13-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Synchronize candidate version
        if: github.event_name == 'push'
        shell: bash
        run: |
          current="$(node -p "require('./package.json').version")"
          if [ "$current" = "10.0.12" ]; then
            npm version 10.0.13 --no-git-tag-version
          elif [ "$current" != "10.0.13" ]; then
            echo "Unexpected version: $current"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Category lifecycle regression
        run: npx playwright test tests/e2e/category-lifecycle-integrity.spec.ts --project=chromium-desktop

      - name: Verify version contract
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "10.0.13"
          test "$(node -p "require('./package-lock.json').version")" = "10.0.13"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "10.0.13"

      - name: Persist synchronized version
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: version Financial App 10.0.13"
          git push origin HEAD:audit/category-lifecycle-integrity-10.0.13
