name: Rebuild Preview E2E

on:
  push:
    branches:
      - 'rebuild/phase-*'
      - 'audit/precommercial-*'
      - 'release/*'
      - 'commercial-readiness/**'

permissions:
  contents: read

jobs:
  browser-interaction-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch commit
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          for source in /etc/apt/sources.list.d/*; do
            if sudo grep -q 'dl.google.com/linux/chrome' "$source" 2>/dev/null; then
              sudo mv "$source" "${source}.disabled"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Run browser E2E locally
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-playwright-local-report
          path: playwright-report/
          retention-days: 7

  phase13-restore-rehearsal:
    if: github.ref_name == 'rebuild/phase-13-production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout branch commit
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Rehearse portable backup and restore on disposable Postgres
        run: bash scripts/phase13-restore-rehearsal.sh

  protected-preview-live:
    if: contains(github.event.head_commit.message, '[vercel-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
      id-token: write
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Generate ephemeral GitHub OIDC token
        id: oidc
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Discover matching Vercel preview for exact SHA
        id: vercel
        uses: actions/github-script@v8
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            for (let attempt = 1; attempt <= 48; attempt += 1) {
              const deployments = await github.rest.repos.listDeployments({
                owner,
                repo,
                sha: context.sha,
                per_page: 30,
              });
              for (const deployment of deployments.data) {
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  per_page: 30,
                });
                const status = statuses.data.find((candidate) => {
                  const url = candidate.environment_url || candidate.target_url || '';
                  return candidate.state === 'success' && /\.vercel\.app\/?$/i.test(url);
                });
                if (status) {
                  const url = (status.environment_url || status.target_url).replace(/\/$/, '');
                  core.info(`Matching Vercel preview discovered on attempt ${attempt}: ${url}`);
                  core.setOutput('url', url);
                  return;
                }
              }
              await sleep(5000);
            }
            core.setFailed(`No successful Vercel deployment was found for ${context.sha}.`);

      - name: Detect protected preview access and exact deployed SHA
        id: access
        env:
          VERCEL_PREVIEW_URL: ${{ steps.vercel.outputs.url }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            method="bypass"
          else
            method="oidc"
          fi

          last_status="not-requested"
          for attempt in $(seq 1 24); do
            if [ "$method" = "bypass" ]; then
              payload=$(curl --silent --show-error \
                --output /tmp/rebuild-build.json \
                --write-out "%{http_code}" \
                -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                "$VERCEL_PREVIEW_URL/api/build" || true)
              last_status="$payload"
            else
              payload=$(curl --silent --show-error \
                --output /tmp/rebuild-build.json \
                --write-out "%{http_code}" \
                -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
                "$VERCEL_PREVIEW_URL/api/build" || true)
              last_status="$payload"
            fi

            if [ "$last_status" = "200" ]; then
              deployed_sha=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/rebuild-build.json','utf8'));process.stdout.write(j.commit||'')}catch{}")
              if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
                echo "method=$method" >> "$GITHUB_OUTPUT"
                echo "Protected preview matches commit $GITHUB_SHA via $method."
                exit 0
              fi
            fi

            if [ "$attempt" -lt 24 ]; then sleep 5; fi
          done

          echo "Protected preview gate failed closed. Final HTTP status: $last_status"
          exit 1

      - name: Checkout branch commit
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify PRE-004 immutable release provenance
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          npm run release:manifest -- \
            --build-info /tmp/rebuild-build.json \
            --output /tmp/release-manifest.preview.json \
            --expected-sha "$GITHUB_SHA" \
            --tag "$tag" \
            --expected-environment preview

      - name: Upload PRE-004 release manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-preview-${{ github.sha }}
          path: /tmp/release-manifest.preview.json
          retention-days: 30

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          for source in /etc/apt/sources.list.d/*; do
            if sudo grep -q 'dl.google.com/linux/chrome' "$source" 2>/dev/null; then
              sudo mv "$source" "${source}.disabled"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Run protected preview fail-closed boundary E2E
        env:
          VERCEL_PREVIEW_URL: ${{ steps.vercel.outputs.url }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: >-
          npm run test:e2e --
          tests/e2e/preview-production-isolation-live.spec.ts
          tests/e2e/protected-preview-auth-boundary-live.spec.ts
          --project=chromium-desktop --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-playwright-protected-preview-report
          path: playwright-report/
          retention-days: 7
