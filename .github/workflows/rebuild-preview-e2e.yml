name: Rebuild Preview E2E

on:
  push:
    branches:
      - 'rebuild/phase-*'

permissions:
  contents: read

jobs:
  browser-interaction-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch commit
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E locally
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-playwright-local-report
          path: playwright-report/
          retention-days: 7

  protected-preview-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
      id-token: write
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Generate ephemeral GitHub OIDC token
        id: oidc
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Discover matching Vercel preview for exact SHA
        id: vercel
        uses: actions/github-script@v8
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            for (let attempt = 1; attempt <= 48; attempt += 1) {
              const deployments = await github.rest.repos.listDeployments({
                owner,
                repo,
                sha: context.sha,
                per_page: 30,
              });
              for (const deployment of deployments.data) {
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  per_page: 30,
                });
                const status = statuses.data.find((candidate) => {
                  const url = candidate.environment_url || candidate.target_url || '';
                  return candidate.state === 'success' && /\.vercel\.app\/?$/i.test(url);
                });
                if (status) {
                  const url = (status.environment_url || status.target_url).replace(/\/$/, '');
                  core.info(`Matching Vercel preview discovered on attempt ${attempt}: ${url}`);
                  core.setOutput('url', url);
                  return;
                }
              }
              await sleep(5000);
            }
            core.setFailed(`No successful Vercel deployment was found for ${context.sha}.`);

      - name: Detect protected preview access and exact deployed SHA
        id: access
        env:
          VERCEL_PREVIEW_URL: ${{ steps.vercel.outputs.url }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            method="bypass"
          else
            method="oidc"
          fi

          last_status="not-requested"
          for attempt in $(seq 1 24); do
            if [ "$method" = "bypass" ]; then
              # For this single SHA probe the bypass header is sufficient. Do not
              # request the optional bypass cookie here because Vercel may answer
              # that cookie-setting request with a redirect before /api/build.
              payload=$(curl --silent --show-error \
                --output /tmp/rebuild-build.json \
                --write-out "%{http_code}" \
                -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                "$VERCEL_PREVIEW_URL/api/build" || true)
              last_status="$payload"
            else
              payload=$(curl --silent --show-error \
                --output /tmp/rebuild-build.json \
                --write-out "%{http_code}" \
                -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
                "$VERCEL_PREVIEW_URL/api/build" || true)
              last_status="$payload"
            fi

            if [ "$last_status" = "200" ]; then
              deployed_sha=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/rebuild-build.json','utf8'));process.stdout.write(j.commit||'')}catch{}")
              if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
                echo "method=$method" >> "$GITHUB_OUTPUT"
                echo "Protected preview matches commit $GITHUB_SHA via $method."
                exit 0
              fi
            fi

            if [ "$attempt" -lt 24 ]; then sleep 5; fi
          done

          echo "Protected preview gate failed closed. Final HTTP status: $last_status"
          exit 1

      - name: Checkout branch commit
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run protected preview live E2E
        env:
          VERCEL_PREVIEW_URL: ${{ steps.vercel.outputs.url }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-playwright-protected-preview-report
          path: playwright-report/
          retention-days: 7
