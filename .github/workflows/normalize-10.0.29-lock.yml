name: Normalize 10.0.29 lock

on:
  push:
    branches:
      - audit/source-trust-appshell-10.0.29
    paths:
      - ".github/workflows/normalize-10.0.29-lock.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: audit/source-trust-appshell-10.0.29
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Normalize package metadata
        run: npm version 10.0.29 --no-git-tag-version --allow-same-version

      - name: Commit normalized lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "package metadata already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Sincroniza package-lock con 10.0.29"
          git push origin HEAD:audit/source-trust-appshell-10.0.29
