name: Execute Analysis Port Fixed

on:
  push:
    branches:
      - audit/analysis-legibility-10.0.11
    paths:
      - ".github/workflows/execute-analysis-port-fixed.yml"

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/analysis-legibility-10.0.11
          fetch-depth: 0
      - name: Execute corrected stage A without rewriting workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/analysis-legibility-port-once.yml').read_text()
          marker = '      - name: Apply Analysis legibility stage A\n        run: |\n'
          start = source.index(marker) + len(marker)
          block = source[start:]
          lines = block.splitlines()
          script_lines = []
          for line in lines:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif not line.strip():
                  script_lines.append('')
              else:
                  break
          script = '\n'.join(script_lines) + '\n'
          bad_start = "tsx = once(tsx, '''      <div className={styles.chartGrid}>"
          bad_end = "''', 'chart columns')"
          a = script.index(bad_start)
          b = script.index(bad_end, a) + len(bad_end)
          replacement = "old_grid = '      <div className={styles.chartGrid}>\\n        <SpendingCalendar snapshot={snapshot} />\\n        <AmountBandsChart snapshot={snapshot} />\\n        <MerchantScatter snapshot={snapshot} />\\n        <MerchantConcentrationCurve snapshot={snapshot} />\\n      </div>'\nnew_grid = '      <div className={styles.chartColumns}>\\n        <div className={styles.chartColumn}>\\n          <SpendingCalendar snapshot={snapshot} />\\n          <MerchantScatter snapshot={snapshot} />\\n        </div>\\n        <div className={styles.chartColumn}>\\n          <AmountBandsChart snapshot={snapshot} />\\n          <MerchantConcentrationCurve snapshot={snapshot} />\\n        </div>\\n      </div>'\ntsx = once(tsx, old_grid, new_grid, 'chart columns')"
          script = script[:a] + replacement + script[b:]
          Path('/tmp/analysis-port.sh').write_text(script)
          PY
          bash /tmp/analysis-port.sh
