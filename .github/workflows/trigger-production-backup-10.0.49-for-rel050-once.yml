name: Trigger Production Backup 10.0.49 for REL-050 Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trigger-production-backup-10.0.49-for-rel050-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch immutable Production Backup v2 for REL-050
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-backup-v2.yml \
            --ref main \
            -f source_commit="22c6ffe7b66fe03b087c2b10928ca80e3062f8a3" \
            -f expected_app_version="10.0.49"
