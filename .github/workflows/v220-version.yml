name: V2.2.0 version bump
on:
  push:
    branches: [develop/v2.2.0-analytics]
    paths: [.github/workflows/v220-version.yml]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v2.2.0-analytics
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align V2.2.0 version and remove one-shot workflow
        run: |
          npm version 2.2.0 --no-git-tag-version
          printf "export const APP_VERSION = '2.2.0';\nexport const APP_VERSION_LABEL = `V${APP_VERSION}`;\n" > src/version.ts
          git rm .github/workflows/v220-version.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/version.ts
          git commit -m "chore: release V2.2.0"
          git push origin HEAD:develop/v2.2.0-analytics
