name: REL-064 Version Bump

on:
  push:
    branches: [release/rel-064-viz-006]
    paths:
      - .github/workflows/rel064-version-bump.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rel-064-viz-006
          fetch-depth: 0

      - name: Seal 10.0.64 package identity
        shell: bash
        run: |
          set -euo pipefail
          npm version 10.0.64 --no-git-tag-version --ignore-scripts
          npm pkg set 'scripts.verify:data-visualization=node scripts/verify-data-visualization-10.0.64.mjs'
          node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!=='10.0.64'||l.version!=='10.0.64'||l.packages[''].version!=='10.0.64')process.exit(1)"
          node scripts/verify-data-visualization-10.0.64.mjs

          git rm .github/workflows/rel064-version-bump.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "REL-064: seal Financial App 10.0.64 candidate"
          git push origin HEAD:release/rel-064-viz-006
