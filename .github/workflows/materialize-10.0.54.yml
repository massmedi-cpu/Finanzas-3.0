name: Materialize 10.0.54

on:
  push:
    branches:
      - release/10.0.54-premium-design-system
    paths:
      - ".github/workflows/materialize-10.0.54.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/10.0.54-premium-design-system
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Materialize package identity
        shell: bash
        run: |
          set -euo pipefail
          npm version 10.0.54 --no-git-tag-version --ignore-scripts
          test "$(node -p "require('./package.json').version")" = "10.0.54"
          test "$(node -p "require('./package-lock.json').version")" = "10.0.54"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "10.0.54"
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' package-lock.json package.json | sort)"
          test "$changed" = "$expected"

      - name: Commit canonical bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Financial App 10.0.54 · materializar candidato certificado"
          git push origin HEAD:release/10.0.54-premium-design-system
