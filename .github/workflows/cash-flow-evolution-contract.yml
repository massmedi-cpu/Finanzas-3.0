name: Cash Flow evolution regression

on:
  pull_request:
    paths:
      - "app/cash-flow/cash-flow-evolution.tsx"
      - "src/application/cash-flow/evolution-plot.ts"
      - "tests/e2e/cash-flow-evolution-plot.spec.ts"
      - ".github/workflows/cash-flow-evolution-contract.yml"
  push:
    branches: [main, "chat/cash-flow-chart-quality-20261009"]
    paths:
      - "app/cash-flow/cash-flow-evolution.tsx"
      - "src/application/cash-flow/evolution-plot.ts"
      - "tests/e2e/cash-flow-evolution-plot.spec.ts"
      - ".github/workflows/cash-flow-evolution-contract.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Cash Flow plot contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npx playwright test tests/e2e/cash-flow-evolution-plot.spec.ts --project=chromium-desktop --workers=1
