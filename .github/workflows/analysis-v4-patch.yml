name: Analysis V4 Density Patch

on:
  push:
    branches:
      - work/analysis-premium-v4
    paths:
      - .github/workflows/analysis-v4-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/analysis-premium-v4
          fetch-depth: 0

      - name: Apply cleanup fix
        run: python scripts/fix-analysis-v4.py

      - name: Verify cleanup
        run: |
          test "$(grep -c 'setCategoriesExpanded' app/analysis/analysis-client.tsx || true)" -eq 0
          grep -F 'aria-label="Lectura rápida"' app/analysis/analysis-client.tsx

      - name: Commit cleanup
        run: |
          if git diff --quiet -- app/analysis/analysis-client.tsx; then
            echo "No changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/analysis/analysis-client.tsx
          git commit -m "fix(analysis): remove stale category ranking reset"
          git push origin HEAD:work/analysis-premium-v4
