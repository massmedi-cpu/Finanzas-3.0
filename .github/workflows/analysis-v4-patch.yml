name: Analysis V4 Density Patch

on:
  push:
    branches:
      - work/analysis-premium-v4
    paths:
      - .github/workflows/analysis-v4-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/analysis-premium-v4
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch-analysis-v4.py

      - name: Verify patch shape
        run: |
          grep -F 'aria-label="Lectura rápida"' app/analysis/analysis-client.tsx
          grep -F 'Comercios principales' app/analysis/analysis-client.tsx
          test "$(grep -c 'DriverRanking title="Categorías"' app/analysis/analysis-client.tsx || true)" -eq 0
          test "$(grep -c 'concentrationGrid' app/analysis/analysis-client.tsx || true)" -eq 0
          test "$(grep -c 'concentrationGrid' app/analysis/analysis.module.css || true)" -eq 0

      - name: Commit Analysis v4 patch
        run: |
          if git diff --quiet -- app/analysis/analysis-client.tsx app/analysis/analysis.module.css tests/e2e/analysis.spec.ts tests/e2e/premium-analysis-visual.spec.ts; then
            echo "No changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/analysis/analysis-client.tsx app/analysis/analysis.module.css tests/e2e/analysis.spec.ts tests/e2e/premium-analysis-visual.spec.ts
          git commit -m "feat(analysis): tighten premium information density"
          git push origin HEAD:work/analysis-premium-v4
