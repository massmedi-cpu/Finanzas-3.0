name: REL-067 Sync package-lock

on:
  push:
    branches:
      - release/10.0.67-activation-progressive-disclosure
    paths:
      - .github/workflows/rel067-sync-package-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/10.0.67-activation-progressive-disclosure

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Synchronize lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "REL-067 · sincronizar package-lock 10.0.67"
          git push origin HEAD:release/10.0.67-activation-progressive-disclosure
