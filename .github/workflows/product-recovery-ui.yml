name: Product recovery browser matrix

on:
  pull_request:
    branches: [main, work/product-recovery-20261009, work/recovery-validation-20261009, chat/compare-coverage-truth-20261009, chat/home-evolution-covered-scale-20261009, chat/analysis-history-coverage-20261009, chat/ocr-total-evidence-20261009, chat/ocr-tax-line-evidence-20261009, chat/analysis-accumulated-scale-truth-20261009, chat/analysis-all-merchants-20261009, chat/analysis-accumulated-axis-legibility-20261009, chat/theme-semantic-surfaces-20261009, chat/analysis-bidirectional-coverage-20261009, chat/analysis-account-coverage-scope-20261009, chat/analysis-legacy-range-trust-20261010, chat/ocr-numeric-boundaries-20261010, chat/ocr-refund-sign-integrity-20261010, chat/home-compare-e2e-coverage-20261010, chat/coverage-sync-integrity-20261010, chat/ocr-receipt-refund-consistency-20261010, chat/ocr-negative-numeric-columns-20261010, chat/source-freshness-empty-data-honesty-20261010, chat/ocr-invoice-amount-label-20261010, chat/ocr-iva-tax-table-20261010, chat/ocr-spanish-invoice-written-dates-20261010]
    paths:
      - 'app/**'
      - 'src/design/**'
      - 'src/domain/document-ocr-financial-interpretation.ts'
      - 'scripts/test-ocr-amount-label-selection.mjs'
      - 'tests/e2e/**'
      - 'playwright*.ts'
      - 'package*.json'
      - '.github/workflows/product-recovery-ui.yml'

permissions:
  contents: read

concurrency:
  group: recovery-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synthetic-browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies and browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Certify OCR labelled amounts against synthetic independent expected values
        run: node scripts/test-ocr-amount-label-selection.mjs
      - name: Build optimized application and run cumulative guards
        run: npm run build
      - name: Browser coverage, theme, keyboard and layout checks
        run: >-
          npx playwright test --config=playwright.recovery.config.ts
          tests/e2e/product-recovery-coverage.spec.ts
          tests/e2e/product-recovery-visual.spec.ts
          tests/e2e/inicio-smart-brief.spec.ts
          tests/e2e/inicio-privacy-visual.spec.ts
          tests/e2e/theme-system-10.0.63.spec.ts
          tests/e2e/navigation-performance-10.0.30.spec.ts
          tests/e2e/module-context-navigation.spec.ts
          tests/e2e/dashboard-orchestration-contract.spec.ts
          tests/e2e/dashboard-performance-contract.spec.ts
          --project=chromium-desktop
      - name: Integrated module regressions on the same optimized build
        if: ${{ !cancelled() }}
        run: >-
          npx playwright test --config=playwright.recovery.config.ts
          tests/e2e/budgets.spec.ts
          tests/e2e/budgets-accessibility.spec.ts
          tests/e2e/accounts.spec.ts
          tests/e2e/alerts-center.spec.ts
          tests/e2e/global-alerts-engine.spec.ts
          tests/e2e/cash-flow-evolution-plot.spec.ts
          tests/e2e/forecast-chart-timeline.spec.ts
          tests/e2e/comparison-ui.spec.ts
          tests/e2e/analysis.spec.ts
          --project=chromium-desktop --project=chromium-mobile
      # Synthetic UI results are distinct from authenticated real persistence.
      # No financial originals, secrets or production access are used here.
