name: Forecast Premium Targeted E2E

on:
  push:
    branches:
      - 'work/premium-forecast-intelligence'

permissions:
  contents: read

jobs:
  forecast-targeted-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          for source in /etc/apt/sources.list.d/*; do
            if sudo grep -q 'dl.google.com/linux/chrome' "$source" 2>/dev/null; then
              sudo mv "$source" "${source}.disabled"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Run Forecast E2E only
        run: >-
          npm run test:e2e --
          tests/e2e/forecast.spec.ts
          tests/e2e/forecast-period-race.spec.ts
          tests/e2e/forecast-accessibility.spec.ts
          tests/e2e/visual-system-forecast.spec.ts
          tests/e2e/forecast-boundaries.spec.ts
          --project=chromium-desktop
          --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-premium-targeted-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7
