name: OCR Review Workbench 10.0.46

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/documents/**"
      - "src/application/document-ocr-review.ts"
      - "tests/e2e/document-ocr-review-workbench.spec.ts"
      - ".github/workflows/ocr-review-workbench-10.0.46.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocr-review-workbench-10.0.46-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Certify OCR review workbench and Documents
        run: >-
          npx playwright test
          tests/e2e/document-ocr-review-workbench.spec.ts
          tests/e2e/documents.spec.ts
          --project=chromium-desktop
          --project=chromium-mobile
          --workers=2
