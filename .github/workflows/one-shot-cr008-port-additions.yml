name: One Shot CR008 Money OCR Config Probe

on:
  push:
    branches:
      - 'audit/cr008-ocr-v22-10.0.9'
    paths:
      - '.github/workflows/one-shot-cr008-port-additions.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current CR-008 port
        uses: actions/checkout@v6
        with:
          ref: audit/cr008-ocr-v22-10.0.9
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Probe money-cell whitelist and page segmentation
        shell: bash
        run: |
          set -euo pipefail
          file='src/infrastructure/ocr/receipt-padded-cell-consensus-provider.ts'
          cp "$file" /tmp/provider.ts
          any=0

          probe() {
            label="$1"
            psm="$2"
            whitelist="$3"
            cp /tmp/provider.ts "$file"
            python3 - "$psm" "$whitelist" <<'PY'
          from pathlib import Path
          import sys
          psm, whitelist = sys.argv[1], sys.argv[2]
          path = Path('src/infrastructure/ocr/receipt-padded-cell-consensus-provider.ts')
          text = path.read_text()
          old = '''      tessedit_pageseg_mode: pageSegMode,\n      tessedit_char_whitelist: "",'''
          new = f'''      tessedit_pageseg_mode: target.kind === "description" ? pageSegMode : "{psm}",\n      tessedit_char_whitelist: target.kind === "description" ? "" : "{whitelist}",'''
          if text.count(old) != 1:
              raise SystemExit('Unexpected Tesseract configuration marker')
          path.write_text(text.replace(old, new, 1))
          PY
            echo "=== ${label}: PSM=${psm}, whitelist=${whitelist} ==="
            set +e
            npx playwright test tests/e2e/document-ocr-illumination-native.spec.ts --config=playwright.ocr.config.ts
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              echo "PASS_CONFIG=${label}"
              any=1
            else
              echo "FAIL_CONFIG=${label}"
            fi
          }

          probe 'psm8-digits-separators' 8 '0123456789,.'
          probe 'psm8-digits-separators-euro' 8 '0123456789,.€'
          probe 'psm7-digits-separators' 7 '0123456789,.'
          probe 'psm13-digits-separators' 13 '0123456789,.'
          probe 'psm7-digits-separators-euro' 7 '0123456789,.€'
          probe 'psm13-digits-separators-euro' 13 '0123456789,.€'

          cp /tmp/provider.ts "$file"
          test "$any" -eq 1
