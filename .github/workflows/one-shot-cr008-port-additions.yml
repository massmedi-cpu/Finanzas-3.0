name: One Shot CR008 Wrapped Merchant Fix

on:
  push:
    branches:
      - 'audit/cr008-ocr-v22-10.0.9'
    paths:
      - '.github/workflows/one-shot-cr008-port-additions.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current CR-008 port
        uses: actions/checkout@v6
        with:
          ref: audit/cr008-ocr-v22-10.0.9
          fetch-depth: 0

      - name: Apply guarded wrapped-title fix
        run: python3 scripts/fix-cr008-wrapped-title.py

      - name: Check diff
        run: git diff --check

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify row-geometry regression
        run: npx playwright test tests/e2e/document-ocr-row-geometry.spec.ts --config=playwright.ocr.config.ts

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/ocr/receipt-anchor-filter-provider.ts
          git diff --cached --check
          git commit -m "fix: preserve contiguous wrapped OCR merchant titles"
          git push origin HEAD:audit/cr008-ocr-v22-10.0.9
