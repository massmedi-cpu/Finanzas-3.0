name: One Shot CR008 Port Regression Pack

on:
  push:
    branches:
      - 'audit/cr008-ocr-v22-10.0.9'
    paths:
      - '.github/workflows/one-shot-cr008-port-additions.yml'

permissions:
  contents: write

jobs:
  port-regressions:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout compiled CR-008 port
        uses: actions/checkout@v6
        with:
          ref: audit/cr008-ocr-v22-10.0.9
          fetch-depth: 0

      - name: Fetch historical OCR V22 source
        run: git fetch origin rebuild/phase-cr008-ocr-v22-current-main

      - name: Port isolated OCR regression pack
        shell: bash
        run: |
          set -euo pipefail
          source_ref='origin/rebuild/phase-cr008-ocr-v22-current-main'
          paths=(
            playwright.ocr.config.ts
            tests/e2e/document-ocr-anchor-filter-clean-input.spec.ts
            tests/e2e/document-ocr-anchor-filter.spec.ts
            tests/e2e/document-ocr-anchor-recrop-monotonic.spec.ts
            tests/e2e/document-ocr-anchor-width.spec.ts
            tests/e2e/document-ocr-columns-native.spec.ts
            tests/e2e/document-ocr-illumination-native.spec.ts
            tests/e2e/document-ocr-natural-review.spec.ts
            tests/e2e/document-ocr-padded-cell-consensus.spec.ts
            tests/e2e/document-ocr-row-geometry.spec.ts
            tests/e2e/document-ocr-runtime-composition.spec.ts
            tests/e2e/document-ocr-structured-review.spec.ts
          )
          git checkout "$source_ref" -- "${paths[@]}"
          git diff --cached --check

      - name: Commit OCR regression pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: port CR-008 OCR V22 regression pack'
          git push origin HEAD:audit/cr008-ocr-v22-10.0.9
