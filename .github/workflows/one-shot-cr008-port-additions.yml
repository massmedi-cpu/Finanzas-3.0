name: One Shot CR008 Port Additions

on:
  push:
    branches:
      - 'audit/cr008-ocr-v22-10.0.9'
    paths:
      - '.github/workflows/one-shot-cr008-port-additions.yml'

permissions:
  contents: write

jobs:
  port-additions:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout clean 10.0.8 stack
        uses: actions/checkout@v6
        with:
          ref: audit/cr008-ocr-v22-10.0.9
          fetch-depth: 0

      - name: Fetch historical OCR V22 source
        run: git fetch origin rebuild/phase-cr008-ocr-v22-current-main

      - name: Port isolated OCR product additions
        shell: bash
        run: |
          set -euo pipefail
          source_ref='origin/rebuild/phase-cr008-ocr-v22-current-main'
          paths=(
            app/documents/ocr-review-boundary.tsx
            src/domain/ocr-rows.ts
            src/domain/receipt-money.ts
            src/infrastructure/ocr/receipt-anchor-filter-provider.ts
            src/infrastructure/ocr/receipt-cell-recovery-provider.ts
            src/infrastructure/ocr/receipt-column-sweep-provider.ts
            src/infrastructure/ocr/receipt-focused-cell-consensus-provider.ts
            src/infrastructure/ocr/receipt-illumination.ts
            src/infrastructure/ocr/receipt-padded-cell-consensus-provider.ts
            src/infrastructure/ocr/receipt-row-cell-consensus-provider.ts
            src/infrastructure/ocr/receipt-row-refining-provider.ts
          )
          git checkout "$source_ref" -- "${paths[@]}"
          git diff --cached --check

      - name: Commit isolated OCR runtime graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: port isolated CR-008 OCR V22 runtime modules'
          git push origin HEAD:audit/cr008-ocr-v22-10.0.9
