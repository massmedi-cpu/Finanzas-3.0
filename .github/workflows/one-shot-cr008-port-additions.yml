name: One Shot CR008 Cell Resolution Probe

on:
  push:
    branches:
      - 'audit/cr008-ocr-v22-10.0.9'
    paths:
      - '.github/workflows/one-shot-cr008-port-additions.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current CR-008 port
        uses: actions/checkout@v6
        with:
          ref: audit/cr008-ocr-v22-10.0.9
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Probe OCR cell target height
        shell: bash
        run: |
          set -euo pipefail
          file='src/infrastructure/ocr/receipt-padded-cell-consensus-provider.ts'
          cp "$file" /tmp/provider.ts
          any=0
          for height in 56 64 72 84 96; do
            cp /tmp/provider.ts "$file"
            sed -i "s/const TARGET_CONTENT_HEIGHT = 48;/const TARGET_CONTENT_HEIGHT = ${height};/" "$file"
            echo "=== target height ${height} ==="
            set +e
            npx playwright test tests/e2e/document-ocr-illumination-native.spec.ts --config=playwright.ocr.config.ts
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              echo "PASS_HEIGHT=${height}"
              any=1
            else
              echo "FAIL_HEIGHT=${height}"
            fi
          done
          cp /tmp/provider.ts "$file"
          test "$any" -eq 1
