name: One Shot CR008 Illumination Threshold Probe

on:
  push:
    branches:
      - 'audit/cr008-ocr-v22-10.0.9'
    paths:
      - '.github/workflows/one-shot-cr008-port-additions.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current CR-008 port
        uses: actions/checkout@v6
        with:
          ref: audit/cr008-ocr-v22-10.0.9
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Probe minimal local-contrast threshold that preserves printed decimals
        shell: bash
        run: |
          set -euo pipefail
          file='src/infrastructure/ocr/receipt-illumination.ts'
          cp "$file" /tmp/receipt-illumination.ts
          any=0
          for ratio in 0.80 0.82 0.84 0.86 0.88 0.90; do
            cp /tmp/receipt-illumination.ts "$file"
            python3 - "$ratio" <<'PY'
          from pathlib import Path
          import sys
          ratio = sys.argv[1]
          path = Path('src/infrastructure/ocr/receipt-illumination.ts')
          text = path.read_text()
          marker = 'background[index] * 0.78'
          if text.count(marker) != 1:
              raise SystemExit('Unexpected illumination threshold marker')
          path.write_text(text.replace(marker, f'background[index] * {ratio}', 1))
          PY
            echo "=== ratio ${ratio} ==="
            set +e
            npx playwright test tests/e2e/document-ocr-illumination-native.spec.ts --config=playwright.ocr.config.ts
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              echo "PASS_RATIO=${ratio}"
              any=1
            else
              echo "FAIL_RATIO=${ratio}"
            fi
          done
          cp /tmp/receipt-illumination.ts "$file"
          test "$any" -eq 1
