name: One Shot CR008 Port Core

on:
  push:
    branches:
      - 'audit/cr008-ocr-v22-10.0.9'
    paths:
      - '.github/workflows/one-shot-cr008-port-additions.yml'

permissions:
  contents: write

jobs:
  port-core:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout clean 10.0.8 stack
        uses: actions/checkout@v6
        with:
          ref: audit/cr008-ocr-v22-10.0.9
          fetch-depth: 0

      - name: Fetch historical OCR V22 source
        run: git fetch origin rebuild/phase-cr008-ocr-v22-current-main

      - name: Port OCR files unchanged on the modern line
        shell: bash
        run: |
          set -euo pipefail
          source_ref='origin/rebuild/phase-cr008-ocr-v22-current-main'
          paths=(
            app/api/documents/ocr/route.ts
            src/domain/document-ocr.ts
            src/infrastructure/ocr/tesseract-image-provider.ts
          )
          git checkout "$source_ref" -- "${paths[@]}"
          git diff --cached --check

      - name: Commit reconciled OCR core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: port CR-008 OCR V22 core onto 10.0.8'
          git push origin HEAD:audit/cr008-ocr-v22-10.0.9
