name: Apply ticket OCR 3.0.5 patch
on:
  push:
    branches:
      - hotfix/v3.0.5-ticket-ocr-version
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v3.0.5-ticket-ocr-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-v305-ticket-ocr.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json lib/app-version.ts README.md lib/document/ticket-ocr.ts scripts/ticket-ocr-v302-tests.ts scripts/audit-ticket-ocr-v302.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(3.0.5): use confidence-aware ticket OCR and align version"
          git push origin HEAD:hotfix/v3.0.5-ticket-ocr-version
