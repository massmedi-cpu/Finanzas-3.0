name: Finalize 2.8.1 lockfile
on:
  push:
    branches: [develop/v2.8.1-chart-hotfix]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'align lockfile 2.8.1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Align lockfile version
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='package-lock.json';
          const lock=JSON.parse(fs.readFileSync(path,'utf8'));
          lock.version='2.8.1';
          if(!lock.packages || !lock.packages['']) throw new Error('Root lock package missing');
          lock.packages[''].version='2.8.1';
          fs.writeFileSync(path,JSON.stringify(lock,null,2)+'\n');
          NODE
      - name: Commit lockfile
        run: |
          git config user.name "financial-app-2.8.1-bot"
          git config user.email "financial-app-2.8.1-bot@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "release(2.8.1): align lockfile 2.8.1"
          git push origin HEAD:develop/v2.8.1-chart-hotfix
