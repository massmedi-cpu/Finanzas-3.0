name: Apply Transactions Bulk UX 10.0.43 Once

on:
  push:
    branches:
      - feature/transactions-bulk-10.0.43
    paths:
      - ".github/workflows/apply-transactions-bulk-10.0.43-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/transactions-bulk-10.0.43
          fetch-depth: 0
      - name: Validate runner
        run: echo "10.0.43 runner ready"
