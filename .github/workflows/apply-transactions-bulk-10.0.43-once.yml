name: Apply Transactions Bulk UX 10.0.43 Once

on:
  push:
    branches:
      - feature/transactions-bulk-10.0.43
    paths:
      - ".github/workflows/apply-transactions-bulk-10.0.43-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/transactions-bulk-10.0.43
          fetch-depth: 0
      - name: Apply client patch
        run: node scripts/apply-transactions-bulk-client-10.0.43.mjs
      - name: Commit checkpoint and retire one-shot files
        run: |
          rm .github/workflows/apply-transactions-bulk-10.0.43-once.yml
          rm scripts/apply-transactions-bulk-client-10.0.43.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/transactions/transactions-client.tsx .github/workflows/apply-transactions-bulk-10.0.43-once.yml scripts/apply-transactions-bulk-client-10.0.43.mjs
          git commit -m "feat(transactions): expose safe multi-field bulk editing"
          git push origin HEAD:feature/transactions-bulk-10.0.43
