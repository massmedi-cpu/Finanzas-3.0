name: Sync Release Lockfile 10.0.79

on:
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - ".github/workflows/sync-release-lockfile-10.0.79.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'rebuild/phase-11-ocr-10.0.79'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Synchronize lockfile release metadata only
        run: >-
          node -e "const fs=require('node:fs'); const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')); lock.version='10.0.79'; lock.packages[''].version='10.0.79'; fs.writeFileSync('package-lock.json', JSON.stringify(lock,null,2)+'\n');"

      - name: Commit exact lockfile metadata
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sincronizar package-lock 10.0.79"
          git push origin HEAD:${{ github.head_ref }}
