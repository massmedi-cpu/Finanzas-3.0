name: Release 10.0.72

on:
  push:
    branches:
      - feat/axioma-51-drive-auto-detection-10.0.72
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-drive-auto-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Critical dependency audit
        run: npm audit --audit-level=critical

      - name: Verify Axioma 51 static contract
        run: npm run verify:drive-auto-detection

      - name: TypeScript
        run: npm run typecheck

      - name: Production build and postbuild guards
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Axioma 51 targeted E2E
        run: npm run test:drive-auto-detection

      - name: Full E2E regression desktop and mobile
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rel-072-playwright-report
          path: playwright-report
          if-no-files-found: ignore
