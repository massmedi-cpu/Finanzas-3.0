name: Preview E2E

on:
  push:
    branches:
      - rebuild/phase-1-foundations

permissions:
  contents: write

jobs:
  browser-interaction-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch commit
        uses: actions/checkout@v6

      - name: Materialize category lifecycle UI guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/configuration/configuration-client.tsx")
          content = path.read_text()

          helper_marker = "  async function run(action: () => Promise<void>, success: string) {"
          helper = '''  function hasActiveCategoryChildren(categoryId: EntityId) {
            return data.categories.some(
              (item) => item.parentCategoryId === categoryId && item.lifecycle === "active",
            );
          }

          function canToggleCategoryLifecycle(category: Category) {
            if (category.lifecycle === "active") {
              return !hasActiveCategoryChildren(category.id);
            }
            if (!category.parentCategoryId) {
              return true;
            }
            return data.categories.some(
              (item) => item.id === category.parentCategoryId && item.lifecycle === "active",
            );
          }

          '''

          if "function canToggleCategoryLifecycle" not in content:
            if helper_marker not in content:
              raise SystemExit("Unable to locate lifecycle helper insertion point")
            content = content.replace(helper_marker, helper + helper_marker, 1)

          old_button = 'disabled={busy} onClick={() => void run(() => requestConfiguration("category.archive"'
          new_button = 'disabled={busy || !canToggleCategoryLifecycle(category)} onClick={() => void run(() => requestConfiguration("category.archive"'
          if old_button in content:
            content = content.replace(old_button, new_button, 1)
          elif new_button not in content:
            raise SystemExit("Unable to locate category lifecycle button")

          path.write_text(content)
          PY

          if git diff --quiet -- app/configuration/configuration-client.tsx; then
            echo "Category lifecycle UI guard already materialized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/configuration/configuration-client.tsx
          git commit -m "fix(configuration): block invalid category lifecycle actions"
          git push origin HEAD:rebuild/phase-1-foundations

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run interactive configuration E2E
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-local-report
          path: playwright-report/
          retention-days: 7

  protected-preview-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_PREVIEW_URL: https://finanzas-3-0-git-rebuild-phase-1-c9b930-massmedi-9832s-projects.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Detect automation bypass secret
        id: bypass
        shell: bash
        run: |
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured; protected preview live checks remain pending."
          fi

      - name: Checkout branch commit
        if: steps.bypass.outputs.available == 'true'
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        if: steps.bypass.outputs.available == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.bypass.outputs.available == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        if: steps.bypass.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Wait for matching Vercel preview
        if: steps.bypass.outputs.available == 'true'
        shell: bash
        run: |
          for attempt in $(seq 1 36); do
            payload=$(curl --silent --show-error --fail \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H "x-vercel-set-bypass-cookie: true" \
              "$VERCEL_PREVIEW_URL/api/build" || true)
            deployed_sha=$(printf '%s' "$payload" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).commit||'')}catch{}})")
            if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              echo "Preview matches commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "The branch preview did not reach commit $GITHUB_SHA."
          exit 1

      - name: Run protected preview live E2E
        if: steps.bypass.outputs.available == 'true'
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure() && steps.bypass.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-protected-preview-report
          path: playwright-report/
          retention-days: 7
