name: Preview E2E

on:
  push:
    branches:
      - rebuild/phase-1-foundations
      - rebuild/phase-2-data-quality

permissions:
  contents: read

jobs:
  browser-interaction-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch commit
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and core-health E2E
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-local-report
          path: playwright-report/
          retention-days: 7

  protected-preview-access:
    if: github.ref_name == 'rebuild/phase-1-foundations' || github.ref_name == 'rebuild/phase-2-data-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      VERCEL_PREVIEW_URL: ${{ github.ref_name == 'rebuild/phase-2-data-quality' && 'https://finanzas-3-0-git-rebuild-phase-2-a1ad42-massmedi-9832s-projects.vercel.app' || 'https://finanzas-3-0-git-rebuild-phase-1-c9b930-massmedi-9832s-projects.vercel.app' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    outputs:
      available: ${{ steps.access.outputs.available }}
      method: ${{ steps.access.outputs.method }}
    steps:
      - name: Generate ephemeral GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Report safe GitHub OIDC claims
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          node <<'NODE'
          const token = process.env.VERCEL_TRUSTED_OIDC_TOKEN || '';
          const part = token.split('.')[1];
          if (!part) {
            console.log('OIDC claims unavailable: token payload missing.');
            process.exit(0);
          }
          try {
            const normalized = part.replace(/-/g, '+').replace(/_/g, '/');
            const payload = JSON.parse(Buffer.from(normalized, 'base64').toString('utf8'));
            const safeKeys = [
              'iss', 'aud', 'sub', 'repository', 'repository_id', 'repository_owner',
              'repository_owner_id', 'ref', 'ref_type', 'workflow_ref', 'job_workflow_ref',
              'workflow', 'event_name', 'actor', 'actor_id'
            ];
            const safe = Object.fromEntries(safeKeys.filter((key) => payload[key] !== undefined).map((key) => [key, payload[key]]));
            console.log(`GitHub OIDC safe claims: ${JSON.stringify(safe)}`);
          } catch {
            console.log('OIDC claims unavailable: payload could not be decoded.');
          }
          NODE

      - name: Detect protected preview access
        id: access
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "method=bypass" >> "$GITHUB_OUTPUT"
            echo "Protected preview access available through Vercel Automation Bypass."
            exit 0
          fi

          last_status="not-requested"
          for attempt in $(seq 1 24); do
            status=$(curl --silent --show-error \
              --output /tmp/vercel-oidc-probe.json \
              --write-out "%{http_code}" \
              -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
              "$VERCEL_PREVIEW_URL/api/build" || true)
            last_status="$status"

            if [ "$status" = "200" ]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "method=oidc" >> "$GITHUB_OUTPUT"
              echo "Protected preview access available through GitHub OIDC Trusted Source on attempt $attempt."
              exit 0
            fi

            if [ "$attempt" -lt 24 ]; then
              sleep 5
            fi
          done

          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "method=none" >> "$GITHUB_OUTPUT"
          echo "Protected preview access is not authorized; failing closed so the required live gate cannot be mistaken for success."
          echo "Final protected preview probe HTTP status: $last_status"
          exit 1

  protected-preview-live:
    needs: protected-preview-access
    if: needs.protected-preview-access.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      VERCEL_PREVIEW_URL: ${{ github.ref_name == 'rebuild/phase-2-data-quality' && 'https://finanzas-3-0-git-rebuild-phase-2-a1ad42-massmedi-9832s-projects.vercel.app' || 'https://finanzas-3-0-git-rebuild-phase-1-c9b930-massmedi-9832s-projects.vercel.app' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_ACCESS_METHOD: ${{ needs.protected-preview-access.outputs.method }}
    steps:
      - name: Generate ephemeral GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Checkout branch commit
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for matching Vercel preview
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          for attempt in $(seq 1 36); do
            if [ "$VERCEL_ACCESS_METHOD" = "bypass" ]; then
              payload=$(curl --silent --show-error --fail \
                -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                -H "x-vercel-set-bypass-cookie: true" \
                "$VERCEL_PREVIEW_URL/api/build" || true)
            else
              payload=$(curl --silent --show-error --fail \
                -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
                "$VERCEL_PREVIEW_URL/api/build" || true)
            fi

            deployed_sha=$(printf '%s' "$payload" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).commit||'')}catch{}})")
            if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              echo "Preview matches commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done

          echo "The protected branch preview did not reach commit $GITHUB_SHA."
          exit 1

      - name: Run protected preview live E2E
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile

      - name: Validate real Google source preflight read-only
        if: github.ref_name == 'rebuild/phase-2-data-quality'
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          if [ "$VERCEL_ACCESS_METHOD" = "bypass" ]; then
            response=$(curl --silent --show-error --fail --request POST \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H "x-vercel-set-bypass-cookie: true" \
              "$VERCEL_PREVIEW_URL/api/source/google/preflight")
          else
            response=$(curl --silent --show-error --fail --request POST \
              -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
              "$VERCEL_PREVIEW_URL/api/source/google/preflight")
          fi

          RESPONSE_JSON="$response" node <<'NODE'
          const data = JSON.parse(process.env.RESPONSE_JSON || '{}');
          const fail = (message) => {
            console.error(`GOOGLE_SOURCE_PREFLIGHT|status=failed|reason=${message}`);
            process.exit(1);
          };

          if (data.sourceFileId !== '1OT4QFeRDAchLkznnQvmAe3SslDVXDm1JXU_kIGIhtV8') {
            fail('unexpected_source_file');
          }
          if (!Number.isInteger(data.totalAuthoritativeRows) || data.totalAuthoritativeRows < 3172) {
            fail('historical_total_rows_regressed');
          }

          const expectedAccounts = [
            ['Cuenta corriente Openbank · 3967', 'checking', 'active', 3024],
            ['Cuenta ahorro Openbank · 2504', 'savings', 'active', 15],
            ['Tarjeta prepago Openbank · 8403', 'other', 'archived', 133],
          ];
          if (!Array.isArray(data.accounts) || data.accounts.length !== 3) {
            fail('unexpected_account_count');
          }
          for (const [name, type, lifecycle, minimumRows] of expectedAccounts) {
            const account = data.accounts.find((candidate) => candidate.accountName === name);
            if (!account || account.accountType !== type || account.lifecycle !== lifecycle) {
              fail(`account_contract_mismatch:${name}`);
            }
            if (!Number.isInteger(account.authoritativeRows) || account.authoritativeRows < minimumRows) {
              fail(`account_rows_regressed:${name}`);
            }
            if (account.openingBalanceCents !== 0) {
              fail(`opening_balance_changed:${name}`);
            }
          }

          const expectedCursors = [
            ['Cuenta corriente · 3967', 3157, 'CC-02963'],
            ['Cuenta ahorro · 2504', 15, 'AH-00010'],
          ];
          if (!Array.isArray(data.cursors) || data.cursors.length !== 2) {
            fail('unexpected_cursor_count');
          }
          for (const [sheetTitle, minimumRows, oldestRowKey] of expectedCursors) {
            const cursor = data.cursors.find((candidate) => candidate.sheetTitle === sheetTitle);
            if (!cursor || cursor.authoritativeRows < minimumRows || cursor.lastSourceRowKey !== oldestRowKey) {
              fail(`cursor_contract_mismatch:${sheetTitle}`);
            }
          }

          console.log(
            `GOOGLE_SOURCE_PREFLIGHT|status=ok|revision=${data.sourceRevision ?? 'null'}|rows=${data.totalAuthoritativeRows}|accounts=${data.accounts.length}|cursors=${data.cursors.length}`,
          );
          NODE

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-protected-preview-report
          path: playwright-report/
          retention-days: 7
