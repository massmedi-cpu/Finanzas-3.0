name: Preview E2E

on:
  push:
    branches:
      - rebuild/phase-1-foundations

permissions:
  contents: read

jobs:
  browser-interaction-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch commit
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run interactive configuration E2E
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-local-report
          path: playwright-report/
          retention-days: 7

  protected-preview-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_PREVIEW_URL: https://finanzas-3-0-git-rebuild-phase-1-c9b930-massmedi-9832s-projects.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Detect protected-preview credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "bypass_available=true" >> "$GITHUB_OUTPUT"
            echo "automation_bypass_available=true"
          else
            echo "bypass_available=false" >> "$GITHUB_OUTPUT"
            echo "automation_bypass_available=false"
          fi

          if [ -n "$VERCEL_API_TOKEN" ]; then
            echo "api_token_available=true" >> "$GITHUB_OUTPUT"
            echo "vercel_api_token_available=true"
          else
            echo "api_token_available=false" >> "$GITHUB_OUTPUT"
            echo "vercel_api_token_available=false"
          fi

          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "Protected preview live checks remain pending until an authorized bypass is available."
          fi

      - name: Checkout branch commit
        if: steps.credentials.outputs.bypass_available == 'true'
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        if: steps.credentials.outputs.bypass_available == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.credentials.outputs.bypass_available == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        if: steps.credentials.outputs.bypass_available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Wait for matching Vercel preview
        if: steps.credentials.outputs.bypass_available == 'true'
        shell: bash
        run: |
          for attempt in $(seq 1 36); do
            payload=$(curl --silent --show-error --fail \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H "x-vercel-set-bypass-cookie: true" \
              "$VERCEL_PREVIEW_URL/api/build" || true)
            deployed_sha=$(printf '%s' "$payload" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).commit||'')}catch{}})")
            if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              echo "Preview matches commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "The branch preview did not reach commit $GITHUB_SHA."
          exit 1

      - name: Run protected preview live E2E
        if: steps.credentials.outputs.bypass_available == 'true'
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure() && steps.credentials.outputs.bypass_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-protected-preview-report
          path: playwright-report/
          retention-days: 7
