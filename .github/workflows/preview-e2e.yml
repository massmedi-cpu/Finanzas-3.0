name: Preview E2E

on:
  push:
    branches:
      - rebuild/phase-1-foundations

permissions:
  contents: read

jobs:
  protected-preview-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_PREVIEW_URL: https://finanzas-3-0-git-rebuild-phase-1-c9b930-massmedi-9832s-projects.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Detect automation bypass secret
        id: bypass
        shell: bash
        run: |
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured; protected preview E2E is pending."
          fi

      - name: Checkout branch commit
        if: steps.bypass.outputs.available == 'true'
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        if: steps.bypass.outputs.available == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.bypass.outputs.available == 'true'
        run: npm install --ignore-scripts

      - name: Install Chromium
        if: steps.bypass.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Wait for matching Vercel preview
        if: steps.bypass.outputs.available == 'true'
        shell: bash
        run: |
          for attempt in $(seq 1 36); do
            payload=$(curl --silent --show-error --fail \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H "x-vercel-set-bypass-cookie: true" \
              "$VERCEL_PREVIEW_URL/api/build" || true)
            deployed_sha=$(printf '%s' "$payload" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).commit||'')}catch{}})")
            if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              echo "Preview matches commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "The branch preview did not reach commit $GITHUB_SHA."
          exit 1

      - name: Run protected preview E2E
        if: steps.bypass.outputs.available == 'true'
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure() && steps.bypass.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
