name: Preview E2E

on:
  push:
    branches:
      - rebuild/phase-1-foundations

permissions:
  contents: write

jobs:
  materialize-gateway-parity:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'ci(e2e): materialize gateway parity guards')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch commit
        uses: actions/checkout@v6

      - name: Patch gateway and persistence health
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = Path(path).read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              Path(path).write_text(text.replace(old, new))

          gateway = "supabase/functions/financial-app-db-gateway/index.ts"
          replace_once(
              gateway,
              '''function sameIdSet(current: string[], ordered: string[]) {
            if (current.length !== ordered.length) return false;
            const set = new Set(current);
            return ordered.every((id) => set.has(id));
          }
          async function applyOrdinalOrder''',
              '''function sameIdSet(current: string[], ordered: string[]) {
            if (current.length !== ordered.length) return false;
            const set = new Set(current);
            return ordered.every((id) => set.has(id));
          }
          function assertAccountReorderGroups(current: any[], ordered: string[]) {
            if (!sameIdSet(current.map((row) => String(row.id)), ordered)) throw new Error("invalid_reorder_set");
            const byId = new Map(current.map((row) => [String(row.id), row]));
            const crosses = ordered.some((id, index) => current[index]?.lifecycle !== byId.get(id)?.lifecycle);
            if (crosses) throw new Error("account_reorder_group_mismatch");
          }
          function assertCategoryReorderGroups(current: any[], ordered: string[]) {
            if (!sameIdSet(current.map((row) => String(row.id)), ordered)) throw new Error("invalid_reorder_set");
            const byId = new Map(current.map((row) => [String(row.id), row]));
            const crosses = ordered.some((id, index) => {
              const atPosition = current[index];
              const incoming = byId.get(id);
              return !atPosition || !incoming || atPosition.kind !== incoming.kind || String(atPosition.parent_category_id ?? "") !== String(incoming.parent_category_id ?? "");
            });
            if (crosses) throw new Error("category_reorder_group_mismatch");
          }
          function assertActiveMergeTarget(target: any) {
            if (target?.lifecycle !== "active") throw new Error("target_category_archived");
          }
          function rejectedWith(action: () => void, code: string) {
            try { action(); return false; } catch (error) { return error instanceof Error && error.message === code; }
          }
          async function applyOrdinalOrder'''
          )

          replace_once(
              gateway,
              '''    if (action === "health") {
            const rows = await sql`select 1::int as ok`;
            return json({ status: "ok", database: rows[0]?.ok === 1, environment: identity.environment });
          }

          ''',
              '''    if (action === "health") {
            const rows = await sql`select 1::int as ok`;
            return json({ status: "ok", database: rows[0]?.ok === 1, environment: identity.environment });
          }

            if (action === "test.invariants") {
              if (identity.environment !== "preview") return json({ error: "test_invariants_preview_only" }, 403);
              const accountRows = [{ id: TEST_ACCOUNT_ID, lifecycle: "active" }, { id: "10000000-0000-4000-8000-000000000009", lifecycle: "archived" }];
              const categoryRows = [
                { id: TEST_CATEGORY_IDS[0], kind: "expense", parent_category_id: null },
                { id: TEST_CATEGORY_IDS[1], kind: "income", parent_category_id: null },
              ];
              return json({
                accountReorderGuard: rejectedWith(() => assertAccountReorderGroups(accountRows, [accountRows[1].id, accountRows[0].id]), "account_reorder_group_mismatch"),
                categoryReorderGuard: rejectedWith(() => assertCategoryReorderGroups(categoryRows, [categoryRows[1].id, categoryRows[0].id]), "category_reorder_group_mismatch"),
                activeMergeTargetGuard: rejectedWith(() => assertActiveMergeTarget({ lifecycle: "archived" }), "target_category_archived"),
              });
            }

          '''
          )

          replace_once(
              gateway,
              '''    if (action === "account.reorder") {
            orderedIds(payload.orderedIds);
            await sql.begin(async (tx) => {
              const current = await tx`select id from financial_app.accounts order by id for update`;
              if (!sameIdSet(current.map((row: any) => String(row.id)), payload.orderedIds)) {
                throw new Error("invalid_reorder_set");
              }
              await applyOrdinalOrder(tx, "accounts", payload.orderedIds);
            });
            return json({ ok: true });
          }
''',
              '''    if (action === "account.reorder") {
            orderedIds(payload.orderedIds);
            await sql.begin(async (tx) => {
              const current = await tx`select id,lifecycle from financial_app.accounts order by case lifecycle when 'active' then 0 else 1 end,sort_order,name,id for update`;
              assertAccountReorderGroups(current, payload.orderedIds);
              await applyOrdinalOrder(tx, "accounts", payload.orderedIds);
            });
            return json({ ok: true });
          }
'''
          )

          replace_once(
              gateway,
              '''    if (action === "category.reorder") {
            orderedIds(payload.orderedIds);
            await sql.begin(async (tx) => {
              const current = await tx`select id from financial_app.categories order by id for update`;
              if (!sameIdSet(current.map((row: any) => String(row.id)), payload.orderedIds)) {
                throw new Error("invalid_reorder_set");
              }
              await applyOrdinalOrder(tx, "categories", payload.orderedIds);
            });
            return json({ ok: true });
          }
''',
              '''    if (action === "category.reorder") {
            orderedIds(payload.orderedIds);
            await sql.begin(async (tx) => {
              const current = await tx`select id,kind,parent_category_id from financial_app.categories order by kind,parent_category_id nulls first,sort_order,name,id for update`;
              assertCategoryReorderGroups(current, payload.orderedIds);
              await applyOrdinalOrder(tx, "categories", payload.orderedIds);
            });
            return json({ ok: true });
          }
'''
          )

          replace_once(
              gateway,
              '''        const categories = await tx`select id,name,kind from financial_app.categories where id in (${payload.sourceCategoryId}::uuid,${payload.targetCategoryId}::uuid) order by id for update`;
                const source = categories.find((row: any) => String(row.id) === payload.sourceCategoryId);
                const target = categories.find((row: any) => String(row.id) === payload.targetCategoryId);
                if (!source || !target) throw new Error("category_not_found");
                if (source.kind !== target.kind) throw new Error("category_kind_mismatch");
''',
              '''        const categories = await tx`select id,name,kind,lifecycle from financial_app.categories where id in (${payload.sourceCategoryId}::uuid,${payload.targetCategoryId}::uuid) order by id for update`;
                const source = categories.find((row: any) => String(row.id) === payload.sourceCategoryId);
                const target = categories.find((row: any) => String(row.id) === payload.targetCategoryId);
                if (!source || !target) throw new Error("category_not_found");
                if (source.kind !== target.kind) throw new Error("category_kind_mismatch");
                assertActiveMergeTarget(target);
'''
          )

          health = "app/api/health/configuration-persistence/route.ts"
          replace_once(health, '    const archivedAccount = await service.setAccountArchived(createdAccount.id, true);\n    await service.reorderAccounts([createdAccount.id]);\n', '    const archivedAccount = await service.setAccountArchived(createdAccount.id, true);\n')
          replace_once(health, '    await service.reorderCategories([source.id, target.id]);\n    await service.mergeCategories(source.id, target.id);\n', '    const gatewayGuards = await callPersistenceGateway<{\n      accountReorderGuard: boolean;\n      categoryReorderGuard: boolean;\n      activeMergeTargetGuard: boolean;\n    }>("test.invariants");\n\n    await service.mergeCategories(source.id, target.id);\n')
          replace_once(health, '''      {
                name: "categories-created-and-reordered",
                passed:
                  target.id === TEST_IDS.targetCategory &&
                  source.id === TEST_IDS.sourceCategory &&
                  rereadTarget?.sortOrder === 1,
              },
''', '''      {
                name: "categories-created",
                passed:
                  target.id === TEST_IDS.targetCategory &&
                  source.id === TEST_IDS.sourceCategory,
              },
              { name: "gateway-account-reorder-group-guard", passed: gatewayGuards.accountReorderGuard },
              { name: "gateway-category-reorder-group-guard", passed: gatewayGuards.categoryReorderGuard },
              { name: "gateway-active-merge-target-guard", passed: gatewayGuards.activeMergeTargetGuard },
''')

          e2e = "tests/e2e/configuration.spec.ts"
          replace_once(e2e, '    expect(payload.total).toBeGreaterThanOrEqual(34);', '    expect(payload.total).toBeGreaterThanOrEqual(36);')
          replace_once(e2e, '    expect(payload.total).toBe(7);', '    expect(payload.total).toBe(10);')
          PY

      - name: Commit parity guards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/financial-app-db-gateway/index.ts app/api/health/configuration-persistence/route.ts tests/e2e/configuration.spec.ts
          git diff --cached --check
          git commit -m "fix(persistence): align edge gateway invariants"
          git push

  browser-interaction-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch commit
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run interactive configuration E2E
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-local-report
          path: playwright-report/
          retention-days: 7

  protected-preview-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_PREVIEW_URL: https://finanzas-3-0-git-rebuild-phase-1-c9b930-massmedi-9832s-projects.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Detect automation bypass secret
        id: bypass
        shell: bash
        run: |
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured; protected preview live checks remain pending."
          fi

      - name: Checkout branch commit
        if: steps.bypass.outputs.available == 'true'
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        if: steps.bypass.outputs.available == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.bypass.outputs.available == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        if: steps.bypass.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Wait for matching Vercel preview
        if: steps.bypass.outputs.available == 'true'
        shell: bash
        run: |
          for attempt in $(seq 1 36); do
            payload=$(curl --silent --show-error --fail \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H "x-vercel-set-bypass-cookie: true" \
              "$VERCEL_PREVIEW_URL/api/build" || true)
            deployed_sha=$(printf '%s' "$payload" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).commit||'')}catch{}})")
            if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              echo "Preview matches commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "The branch preview did not reach commit $GITHUB_SHA."
          exit 1

      - name: Run protected preview live E2E
        if: steps.bypass.outputs.available == 'true'
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure() && steps.bypass.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-protected-preview-report
          path: playwright-report/
          retention-days: 7
