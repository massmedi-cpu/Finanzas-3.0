name: Cross-module Financial Consistency 10.0.23

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/inicio-overview.tsx'
      - 'src/application/dashboard/home-consistency.ts'
      - 'supabase/migrations/20260927100500_cross_module_financial_consistency.sql'
      - 'tests/e2e/cross-module-financial-consistency.spec.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cross-module-financial-consistency-10.0.23.yml'

permissions:
  contents: read

concurrency:
  group: cross-module-financial-consistency-10.0.23-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Version consistency
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!=='10.0.23'||l.version!==p.version||l.packages[''].version!==p.version)process.exit(1)"

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Cross-module consistency contract
        run: npx playwright test tests/e2e/cross-module-financial-consistency.spec.ts --project=chromium-desktop
