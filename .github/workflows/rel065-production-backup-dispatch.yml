name: REL-065 Production Backup Dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rel065-production-backup-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact stable 10.0.65 backup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-backup-v2.yml \
            --ref main \
            -f source_commit=a1704b51632048419499c8d7cb57b38db92cbca4 \
            -f expected_app_version=10.0.65
