name: Refine receipt bounds 3.0.4
on:
  push:
    branches:
      - hotfix/v3.0.4-archive-ocr-ux
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v3.0.4-archive-ocr-ux
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-receipt-bounds-v304.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/document/ticket-ocr.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(ocr): preserve full receipt width during auto crop"
          git push origin HEAD:hotfix/v3.0.4-archive-ocr-ux
