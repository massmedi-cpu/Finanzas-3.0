name: REL-062 Production Backup Dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rel062-production-backup-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact stable 10.0.62 backup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-backup-v2.yml \
            --ref main \
            -f source_commit=3aa0ebe731b8c6fe5da9e5c57507c0247fd5de82 \
            -f expected_app_version=10.0.62
