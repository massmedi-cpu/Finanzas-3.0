name: Sign Mismatch Review 10.0.25

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/inicio-overview.tsx"
      - "app/api/transactions/route.ts"
      - "app/transactions/transactions-client.tsx"
      - "app/transactions/transactions.module.css"
      - "supabase/functions/financial-app-db-gateway/transaction-query.ts"
      - "supabase/migrations/20260927185432_sign_mismatch_transaction_review_10_0_25.sql"
      - "tests/e2e/sign-mismatch-review.spec.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sign-mismatch-review-10.0.25.yml"
      - ".github/workflows/extreme-financial-scenarios-10.0.24.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Version consistency
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!=='10.0.25'||l.version!==p.version||l.packages[''].version!==p.version)process.exit(1)"

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Sign mismatch contracts and UX
        run: npx playwright test tests/e2e/sign-mismatch-review.spec.ts --project=chromium-desktop --project=chromium-mobile --workers=2
