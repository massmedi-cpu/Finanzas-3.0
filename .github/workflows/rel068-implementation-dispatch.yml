name: REL-068 Implementation Dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rel068-implementation-dispatch.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout REL-068 branch
        uses: actions/checkout@v4
        with:
          ref: release/10.0.68-accessibility
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply exact accessibility patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/transactions/transactions-client.tsx")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              'const CONCEPT_ERROR_ID = "transaction-concept-error";\n',
              'const CONCEPT_ERROR_ID = "transaction-concept-error";\nconst SUBCATEGORY_ERROR_ID = "transaction-subcategory-error";\n',
              "subcategory error id",
          )

          replace_once(
              '  const conceptInputRef = useRef<HTMLInputElement>(null);\n  const pendingFocusId = useRef<string | null>(null);\n\n  const fetchPage = useCallback',
              '  const conceptInputRef = useRef<HTMLInputElement>(null);\n  const subcategorySelectRef = useRef<HTMLSelectElement>(null);\n  const pendingFocusId = useRef<string | null>(null);\n\n  useEffect(() => {\n    if (!editingId) return;\n    const frame = window.requestAnimationFrame(() => conceptInputRef.current?.focus());\n    return () => window.cancelAnimationFrame(frame);\n  }, [editingId]);\n\n  const fetchPage = useCallback',
              "editor focus effect",
          )

          replace_once(
              '    setCategoryError("Selecciona una subcategoría.");\n    return;',
              '    setCategoryError("Selecciona una subcategoría.");\n    window.requestAnimationFrame(() => subcategorySelectRef.current?.focus());\n    return;',
              "subcategory focus on validation",
          )

          replace_once(
              '<select data-testid="edit-subcategory" value={editor.categoryLeaf} disabled={editor.categoryRoot === NONE || activeSubcategories(facets.categories, editor.categoryRoot).length === 0} aria-invalid={categoryError ? "true" : "false"} onChange={(event) => {',
              '<select ref={subcategorySelectRef} data-testid="edit-subcategory" value={editor.categoryLeaf} disabled={editor.categoryRoot === NONE || activeSubcategories(facets.categories, editor.categoryRoot).length === 0} aria-invalid={categoryError ? "true" : "false"} aria-describedby={categoryError ? SUBCATEGORY_ERROR_ID : undefined} onChange={(event) => {',
              "subcategory aria relationship",
          )

          replace_once(
              '<small className={styles.fieldError} role="alert">{categoryError}</small>',
              '<small id={SUBCATEGORY_ERROR_ID} className={styles.fieldError} role="alert">{categoryError}</small>',
              "subcategory error node",
          )

          replace_once(
              '<thead><tr><th className={styles.selectHeading}>Sel.</th><th>Fecha</th><th>Concepto y trazabilidad</th><th>Cuenta</th><th>Categoría</th><th className={styles.amountHeading}>Importe</th><th>Gestión</th></tr></thead>',
              '<thead><tr><th scope="col" className={styles.selectHeading}>Sel.</th><th scope="col">Fecha</th><th scope="col">Concepto y trazabilidad</th><th scope="col">Cuenta</th><th scope="col">Categoría</th><th scope="col" className={styles.amountHeading}>Importe</th><th scope="col">Gestión</th></tr></thead>',
              "table header scopes",
          )

          path.write_text(text, encoding="utf-8")

      - name: Set release version
        run: npm version 10.0.68 --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit implementation to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/transactions/transactions-client.tsx package.json package-lock.json
          git commit -m "REL-068 · accesibilidad operativa en Movimientos"
          git push origin HEAD:release/10.0.68-accessibility
