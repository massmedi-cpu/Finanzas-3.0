name: Net Worth Scope 10.0.102

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/navigation-items.ts"
      - "app/net-worth/**"
      - "src/application/net-worth/**"
      - "src/domain/product-scope-contract.ts"
      - "tests/e2e/net-worth-10.0.53.spec.ts"
      - "tests/e2e/net-worth-scope-contract.spec.ts"
      - "scripts/verify-net-worth-scope-10.0.102.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/net-worth-scope-10.0.102.yml"
  push:
    branches:
      - "audit/remove-out-of-scope-net-worth-10.0.102"

permissions:
  contents: read

concurrency:
  group: net-worth-scope-10.0.102-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run verify:net-worth-scope
      - run: npx playwright test tests/e2e/net-worth-scope-contract.spec.ts --project=chromium-desktop --workers=1
      - run: npm run build
