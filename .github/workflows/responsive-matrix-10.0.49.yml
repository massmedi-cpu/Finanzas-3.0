name: Responsive Matrix 10.0.49

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/responsive-matrix-10.0.49.yml"

permissions:
  contents: read

jobs:
  responsive-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VALIDATION_SHA }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          for source in /etc/apt/sources.list.d/*; do
            if sudo grep -q 'dl.google.com/linux/chrome' "$source" 2>/dev/null; then
              sudo mv "$source" "${source}.disabled"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Run responsive matrix and mobile navigation regression
        run: >-
          npm run test:e2e --
          tests/e2e/responsive-matrix-10.0.49.spec.ts
          tests/e2e/mobile-direct-navigation.spec.ts
          --project=chromium-desktop
          --workers=1

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-matrix-10.0.49-${{ env.VALIDATION_SHA }}
          path: playwright-report/
          retention-days: 7
