name: REL-065 Version Bump

on:
  push:
    branches:
      - release/10.0.65-mobile-quality
    paths:
      - .github/workflows/rel065-version-bump.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/10.0.65-mobile-quality
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialize 10.0.65 atomically
        run: npm version 10.0.65 --no-git-tag-version

      - name: Commit version identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "REL-065 · materializar Financial App 10.0.65"
          git push origin HEAD:release/10.0.65-mobile-quality
