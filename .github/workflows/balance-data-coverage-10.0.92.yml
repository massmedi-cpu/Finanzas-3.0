name: Balance Data Coverage 10.0.92

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/home-evolution.tsx"
      - "app/inicio-overview.module.css"
      - "tests/e2e/inicio-smart-brief.spec.ts"
      - "scripts/verify-balance-data-coverage-10.0.92.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/balance-data-coverage-10.0.92.yml"
  push:
    branches:
      - "qa/user-audit-p4-10.0.92"

permissions:
  contents: read

concurrency:
  group: balance-data-coverage-10.0.92-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run verify:balance-data-coverage
      - run: npm run build

  qa18-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: QA-18 · cobertura parcial de saldo desktop y móvil
        run: >-
          npx playwright test tests/e2e/inicio-smart-brief.spec.ts
          --grep "QA-18"
          --project=chromium-desktop --project=chromium-mobile --workers=1
