name: Branch lockfile generator
on:
  push:
    branches:
      - feat/drive-scanned-pdf-ocr-v900
permissions:
  contents: write
jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/drive-scanned-pdf-ocr-v900
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(pdf): sync canvas lockfile [lockfile-generated]'
          git push origin HEAD:feat/drive-scanned-pdf-ocr-v900
