name: Align Financial App 3.0.5 version
on:
  push:
    branches:
      - hotfix/v3.0.5-ticket-ocr-version
permissions:
  contents: write
jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v3.0.5-ticket-ocr-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align package and lockfile
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const l=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          p.version='3.0.5';
          l.version='3.0.5';
          l.packages[''].version='3.0.5';
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          fs.writeFileSync('package-lock.json',JSON.stringify(l,null,2)+'\n');
          NODE
      - name: Commit aligned version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(3.0.5): align package and lockfile version"
          git push origin HEAD:hotfix/v3.0.5-ticket-ocr-version
