name: One-shot version 10.0.37

on:
  push:
    branches:
      - refactor/release-operations-10.0.37
    paths:
      - ".github/workflows/one-shot-version-10.0.37.yml"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/release-operations-10.0.37
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Synchronize package and lockfile
        run: npm version 10.0.37 --no-git-tag-version
      - name: Commit version generated by npm
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): version Financial App 10.0.37"
          git push origin HEAD:refactor/release-operations-10.0.37
