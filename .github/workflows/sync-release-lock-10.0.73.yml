name: Sync Release Lock 10.0.73

on:
  push:
    branches:
      - feat/axioma-52-budget-engine-10.0.73
    paths:
      - .github/workflows/sync-release-lock-10.0.73.yml
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  sync-lock-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/axioma-52-budget-engine-10.0.73
      - name: Align package-lock release identity
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = pkg.version;
          if (lock.packages && lock.packages['']) lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Commit synchronized lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(release): align package-lock to 10.0.73'
          git push origin HEAD:feat/axioma-52-budget-engine-10.0.73
