name: One-shot version 10.0.45

on:
  push:
    branches:
      - fix/cr-008-ocr-10.0.45
    paths:
      - .github/workflows/one-shot-version-10.0.45.yml

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/cr-008-ocr-10.0.45
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set package and lock to 10.0.45
        run: npm version 10.0.45 --no-git-tag-version --allow-same-version

      - name: Verify version identity
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='10.0.45'||l.version!=='10.0.45'||l.packages?.['']?.version!=='10.0.45') process.exit(1)"

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-version-10.0.45.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/one-shot-version-10.0.45.yml
          git commit -m "chore(release): Financial App 10.0.45"
          git push origin HEAD:fix/cr-008-ocr-10.0.45
