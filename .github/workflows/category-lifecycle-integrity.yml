name: Category Lifecycle Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/domain/category-visuals.ts'
      - 'src/domain/configuration.ts'
      - 'supabase/migrations/**'
      - 'tests/e2e/category-lifecycle-integrity.spec.ts'
      - '.github/workflows/category-lifecycle-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: category-lifecycle-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Category lifecycle regression
        run: npx playwright test tests/e2e/category-lifecycle-integrity.spec.ts --project=chromium-desktop
