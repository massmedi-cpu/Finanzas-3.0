name: REL-071 Cleanup Temporary Preparer

on:
  push:
    branches:
      - release/10.0.71-next-security
    paths:
      - .github/workflows/rel071-cleanup-preparer.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/10.0.71-next-security
          fetch-depth: 0
      - name: Remove temporary workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rel071-prepare-dependency.yml .github/workflows/rel071-cleanup-preparer.yml
          git commit -m "chore(rel-071): retirar workflows temporales de preparación"
          git push origin HEAD:release/10.0.71-next-security
