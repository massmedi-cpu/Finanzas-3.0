name: Audit budget field accessibility fix

on:
  push:
    branches:
      - audit/precommercial-10.0.0
    paths:
      - .github/workflows/audit-budget-field-accessibility-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/precommercial-10.0.0
          fetch-depth: 1

      - name: Apply exact accessibility changes
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/budgets/budgets-client.tsx")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "  editValue,\n  onStartEdit,\n",
              "  editValue,\n  fieldError,\n  onStartEdit,\n",
          )
          replace_once(
              "  editValue: string;\n  onStartEdit: () => void;\n",
              "  editValue: string;\n  fieldError: string;\n  onStartEdit: () => void;\n",
          )
          replace_once(
              "  const remainingLabel = item.remainingCents >= 0 ? \"Disponible\" : \"Exceso\";\n\n  return (\n",
              "  const remainingLabel = item.remainingCents >= 0 ? \"Disponible\" : \"Exceso\";\n  const inputRef = useRef<HTMLInputElement>(null);\n  const fieldErrorId = `budget-manual-error-${total ? \"total\" : item.categoryId ?? \"category\"}`;\n\n  useEffect(() => {\n    if (fieldError) inputRef.current?.focus();\n  }, [fieldError]);\n\n  return (\n",
          )
          replace_once(
              "              autoFocus\n              inputMode=\"decimal\"\n",
              "              autoFocus\n              ref={inputRef}\n              inputMode=\"decimal\"\n",
          )
          replace_once(
              "              aria-label={`Presupuesto manual de ${total ? \"total mensual\" : item.categoryName ?? \"categoría\"}`}\n            />\n          </label>\n",
              "              aria-label={`Presupuesto manual de ${total ? \"total mensual\" : item.categoryName ?? \"categoría\"}`}\n              aria-invalid={fieldError ? \"true\" : \"false\"}\n              aria-describedby={fieldError ? fieldErrorId : undefined}\n            />\n            {fieldError ? (\n              <span id={fieldErrorId} className={styles.fieldError} role=\"alert\">{fieldError}</span>\n            ) : null}\n          </label>\n",
          )
          replace_once(
              "  const [editingKey, setEditingKey] = useState<string | null>(null);\n  const [editValue, setEditValue] = useState(\"\");\n",
              "  const [editingKey, setEditingKey] = useState<string | null>(null);\n  const [editValue, setEditValue] = useState(\"\");\n  const [fieldError, setFieldError] = useState(\"\");\n",
          )
          replace_once(
              "    setLoading(true);\n    setError(\"\");\n    setNotice(\"\");\n",
              "    setLoading(true);\n    setError(\"\");\n    setNotice(\"\");\n    setFieldError(\"\");\n",
          )
          replace_once(
              "  ) => {\n    setBusy(true);\n    setError(\"\");\n    setNotice(\"\");\n",
              "  ) => {\n    setBusy(true);\n    setError(\"\");\n    setNotice(\"\");\n    setFieldError(\"\");\n",
          )
          replace_once(
              "    setError(\"\");\n    setNotice(\"\");\n    setEditingKey(key);\n",
              "    setError(\"\");\n    setNotice(\"\");\n    setFieldError(\"\");\n    setEditingKey(key);\n",
          )
          replace_once(
              "  const saveManual = useCallback((item: BudgetItem) => {\n",
              "  const changeEditValue = useCallback((value: string) => {\n    setEditValue(value);\n    setFieldError(\"\");\n  }, []);\n\n  const cancelEdit = useCallback(() => {\n    setEditingKey(null);\n    setFieldError(\"\");\n  }, []);\n\n  const saveManual = useCallback((item: BudgetItem) => {\n",
          )
          replace_once(
              "    if (cents === undefined || cents === null) {\n      setError(\"Introduce un importe válido con un máximo de dos decimales.\");\n      setNotice(\"\");\n      return;\n    }\n    void mutate(\n",
              "    if (cents === undefined || cents === null) {\n      setError(\"\");\n      setFieldError(\"Introduce un importe válido con un máximo de dos decimales.\");\n      setNotice(\"\");\n      return;\n    }\n    setFieldError(\"\");\n    void mutate(\n",
          )
          replace_once(
              "                      editValue={editValue}\n                      onStartEdit={() => startEdit(snapshot.total)}\n                      onChangeEdit={setEditValue}\n                      onCancelEdit={() => setEditingKey(null)}\n",
              "                      editValue={editValue}\n                      fieldError={editingKey === \"__total__\" ? fieldError : \"\"}\n                      onStartEdit={() => startEdit(snapshot.total)}\n                      onChangeEdit={changeEditValue}\n                      onCancelEdit={cancelEdit}\n",
          )
          replace_once(
              "                        editValue={editValue}\n                        onStartEdit={() => startEdit(item)}\n                        onChangeEdit={setEditValue}\n                        onCancelEdit={() => setEditingKey(null)}\n",
              "                        editValue={editValue}\n                        fieldError={editingKey === item.categoryId ? fieldError : \"\"}\n                        onStartEdit={() => startEdit(item)}\n                        onChangeEdit={changeEditValue}\n                        onCancelEdit={cancelEdit}\n",
          )

          path.write_text(text)

          css_path = Path("app/budgets/budgets.module.css")
          css = css_path.read_text()
          marker = ".fieldError {"
          if marker in css:
              raise SystemExit("fieldError CSS already exists unexpectedly")
          css += """

.fieldError {
  display: block;
  color: #ff9aaa;
  font-size: 0.875rem;
  line-height: 1.35;
}

.editor input[aria-invalid=\"true\"] {
  border-color: rgba(255, 93, 115, 0.72);
  box-shadow: 0 0 0 2px rgba(255, 93, 115, 0.12);
}
"""
          css_path.write_text(css)

      - name: Commit isolated product fix and remove worker
        run: |
          rm .github/workflows/audit-budget-field-accessibility-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/budgets/budgets-client.tsx app/budgets/budgets.module.css .github/workflows/audit-budget-field-accessibility-fix.yml
          git diff --cached --check
          git commit -m "fix(audit): associate budget validation with its field [vercel-preview]"
          git push origin HEAD:audit/precommercial-10.0.0
