name: Apply 2.6 Madrid calendar migration
on:
  push:
    branches: [develop/v2.6.0-rules]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'madrid calendar boundaries') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact migration
        run: node scripts/fix-madrid-v260.mjs
      - name: Commit migration
        run: |
          git config user.name "financial-app-2.6-bot"
          git config user.email "financial-app-2.6-bot@users.noreply.github.com"
          git add app/prevision/forecast-client.tsx lib/financial/budget.ts lib/financial/forecast.ts lib/financial/goals.ts lib/financial/plan.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(2.6): madrid calendar boundaries [skip ci]"
          git push origin HEAD:develop/v2.6.0-rules
