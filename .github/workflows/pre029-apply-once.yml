name: Apply PRE-029 Action Feedback Once

on:
  push:
    branches:
      - feature/global-action-feedback-10.0.48
    paths:
      - ".github/workflows/pre029-apply-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PRE-029 branch
        uses: actions/checkout@v6
        with:
          ref: feature/global-action-feedback-10.0.48
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply PRE-029 codemod
        run: node scripts/apply-pre029-action-feedback.mjs

      - name: Correct static contract assertion
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/e2e/action-feedback-10.0.48.spec.ts';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            'expect(documents).toContain("documents:associate-");',
            'expect(documents).toContain(\'action.startsWith("associate-")\');',
          );
          fs.writeFileSync(path, source);
          NODE

      - name: Remove one-shot infrastructure
        run: |
          rm scripts/apply-pre029-action-feedback.mjs
          rm .github/workflows/pre029-apply-once.yml

      - name: Commit exact 10.0.48 candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(feedback): complete PRE-029 global action lifecycle 10.0.48"
          git push origin HEAD:feature/global-action-feedback-10.0.48
