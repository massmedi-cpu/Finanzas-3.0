name: One-shot version Financial App 10.0.31

on:
  push:
    branches:
      - feature/source-trust-cache-10.0.31
    paths:
      - ".github/workflows/bump-source-trust-cache-10.0.31.yml"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: feature/source-trust-cache-10.0.31
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Synchronize package and lock version
        run: npm version 10.0.31 --no-git-tag-version

      - name: Remove one-shot workflow
        run: rm .github/workflows/bump-source-trust-cache-10.0.31.yml

      - name: Commit version synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/bump-source-trust-cache-10.0.31.yml
          git commit -m "chore: version Financial App 10.0.31"
          git push origin HEAD:feature/source-trust-cache-10.0.31
