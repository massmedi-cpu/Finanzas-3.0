name: Lock sync 10.0.74

on:
  push:
    branches:
      - feat/axioma-53-analysis-10.0.74
    paths:
      - package.json
      - .github/workflows/lock-sync-10.0.74.yml

permissions:
  contents: write

jobs:
  sync-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/axioma-53-analysis-10.0.74
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerar metadatos del lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Publicar lock sincronizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock ya estaba sincronizado"
            exit 0
          fi
          git commit -m "[lock-sync] Sincronizar package-lock 10.0.74"
          git push origin HEAD:feat/axioma-53-analysis-10.0.74
