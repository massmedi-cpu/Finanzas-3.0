name: Patch Home Phase 9 10.0.77

on:
  push:
    branches:
      - rebuild/phase-9-home-10.0.77

permissions:
  contents: write

concurrency:
  group: patch-home-phase9-10.0.77
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/phase-9-home-10.0.77
      - name: Replace local Home analytics with canonical Analysis summary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app/inicio-overview.tsx';
          let source = fs.readFileSync(path, 'utf8');

          const importNeedle = 'import { checkHomeConsistency } from "../src/application/dashboard/home-consistency";';
          const importReplacement = 'import { checkHomeConsistency } from "../src/application/dashboard/home-consistency";\nimport type { HomeAnalysisSummary } from "../src/application/dashboard/home-analysis";';
          if (!source.includes(importNeedle)) throw new Error('missing_import_anchor');
          source = source.replace(importNeedle, importReplacement);

          const stateNeedle = '  const [syncFeedback, setSyncFeedback] = useState<string | null>(null);';
          const stateReplacement = `${stateNeedle}\n  const [homeAnalysis, setHomeAnalysis] = useState<HomeAnalysisSummary | null>(null);\n  const [analysisLoading, setAnalysisLoading] = useState(true);`;
          if (!source.includes(stateNeedle)) throw new Error('missing_state_anchor');
          source = source.replace(stateNeedle, stateReplacement);

          const syncLoaderNeedle = `  const loadSyncStatus = useCallback(async () => {\n    try {\n      setSyncStatus(await readJson<SyncStatus>("/api/source/google/sync", 5_000));\n    } catch {\n      setSyncStatus(null);\n    }\n  }, []);`;
          const analysisLoader = `${syncLoaderNeedle}\n\n  const loadHomeAnalysis = useCallback(async () => {\n    setAnalysisLoading(true);\n    try {\n      setHomeAnalysis(await readJson<HomeAnalysisSummary>("/api/dashboard/analysis", 8_000));\n    } catch {\n      setHomeAnalysis(null);\n    } finally {\n      setAnalysisLoading(false);\n    }\n  }, []);`;
          if (!source.includes(syncLoaderNeedle)) throw new Error('missing_loader_anchor');
          source = source.replace(syncLoaderNeedle, analysisLoader);

          const refreshNeedle = `    const statusPromise = loadSyncStatus();\n    const activityPromise = loadScope("activity", ["transactions"])`;
          const refreshReplacement = `    const statusPromise = loadSyncStatus();\n    const analysisPromise = loadHomeAnalysis();\n    const activityPromise = loadScope("activity", ["transactions"])`;
          if (!source.includes(refreshNeedle)) throw new Error('missing_refresh_anchor');
          source = source.replace(refreshNeedle, refreshReplacement);
          source = source.replace(
            '    await Promise.all([activityPromise, secondaryPromise, statusPromise]);\n  }, [loadScope, loadSyncStatus]);',
            '    await Promise.all([activityPromise, secondaryPromise, statusPromise, analysisPromise]);\n  }, [loadHomeAnalysis, loadScope, loadSyncStatus]);',
          );

          const localAnalytics = `  const completedMonthlyRows = useMemo(\n    () => data.monthly?.rows.filter((row) => row.monthStart < currentMonthStart) ?? [],\n    [data.monthly, currentMonthStart],\n  );\n  const completedComparison = useMemo(() => {\n    if (!completedMonthlyRows.length) return null;\n    const current = completedMonthlyRows.at(-1)!;\n    const previous = completedMonthlyRows.length > 1 ? completedMonthlyRows.at(-2)! : null;\n    return { current, previous, delta: previous ? current.operatingNetCents - previous.operatingNetCents : null };\n  }, [completedMonthlyRows]);\n  const recentExpenseAverage = useMemo(() => {\n    const sample = completedMonthlyRows.slice(-3);\n    if (!sample.length) return null;\n    return {\n      cents: Math.round(sample.reduce((sum, row) => sum + row.expenseCents, 0) / sample.length),\n      months: sample.length,\n    };\n  }, [completedMonthlyRows]);`;
          const canonicalAnalytics = `  const completedComparison = useMemo(() => homeAnalysis ? {\n    current: {\n      monthStart: homeAnalysis.period.dateFrom,\n      operatingNetCents: homeAnalysis.netComparison.currentNetCents,\n    },\n    delta: homeAnalysis.netComparison.deltaCents,\n  } : null, [homeAnalysis]);\n  const recentExpenseAverage = homeAnalysis?.expenseAverage3m ?? null;`;
          if (!source.includes(localAnalytics)) throw new Error('missing_local_analytics_block');
          source = source.replace(localAnalytics, canonicalAnalytics);

          source = source.replace(
            '<main className={styles.shell} aria-busy={primaryLoading || activityLoading || secondaryLoading}>',
            '<main className={styles.shell} aria-busy={primaryLoading || activityLoading || secondaryLoading || analysisLoading}>',
          );

          const avgFallback = '              : "Histórico pendiente"}';
          const avgReplacement = '              : analysisLoading ? "Calculando desde Análisis…" : "Análisis no disponible"}';
          if (!source.includes(avgFallback)) throw new Error('missing_average_fallback');
          source = source.replace(avgFallback, avgReplacement);

          fs.writeFileSync(path, source);
          NODE
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- app/inicio-overview.tsx; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/inicio-overview.tsx
          git commit -m "refactor(home): consumir comparativas del motor de Análisis"
          git push origin HEAD:rebuild/phase-9-home-10.0.77
