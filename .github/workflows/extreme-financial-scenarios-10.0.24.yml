name: Extreme Financial Scenarios 10.0.24

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/inicio-overview.tsx"
      - "supabase/migrations/20260905225500_phase5_financial_logic_core.sql"
      - "tests/e2e/extreme-financial-scenarios.spec.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/extreme-financial-scenarios-10.0.24.yml"
      - ".github/workflows/cross-module-financial-consistency-10.0.23.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Version consistency
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');const v=p.version.split('.').map(Number);if(v.length!==3||v[0]!==10||v[1]!==0||v[2]<24||l.version!==p.version||l.packages[''].version!==p.version)process.exit(1)"

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Extreme financial scenario contracts
        run: npx playwright test tests/e2e/extreme-financial-scenarios.spec.ts --project=chromium-desktop
