name: Version Financial App 10.0.41

on:
  push:
    branches:
      - refactor/quality-edge-ci-10.0.41

permissions:
  contents: write

jobs:
  version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: refactor/quality-edge-ci-10.0.41
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Synchronize package version
        run: npm version 10.0.41 --no-git-tag-version --allow-same-version

      - name: Commit synchronized package metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "package metadata already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): version Financial App 10.0.41"
          git push origin HEAD:refactor/quality-edge-ci-10.0.41
