name: REL-060 Production Postflight Dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rel060-postflight-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Production Postflight for 10.0.60
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run production-postflight.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f production_url=https://financialapp-home.vercel.app/ \
            -f expected_version=10.0.60 \
            -f deployment_commit=e0aa75bfd856700389c96391da9aff1a1373618f \
            -f deployment_id=dpl_CdZiEZbhSgBDGR9aF9g7c76oXJTU
