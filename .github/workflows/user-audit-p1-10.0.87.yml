name: User Audit P1 10.0.87

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/analysis/**"
      - "app/compare/**"
      - "app/forecast/**"
      - "app/home-smart-brief.tsx"
      - "supabase/migrations/20261006110500_qa01_forecast_budget_context_10_0_87.sql"
      - "tests/e2e/inicio-smart-brief.spec.ts"
      - "tests/e2e/comparison-ui.spec.ts"
      - "tests/e2e/premium-analysis-visual.spec.ts"
      - "scripts/verify-user-audit-p1-10.0.87.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/user-audit-p1-10.0.87.yml"
  push:
    branches:
      - "qa/user-audit-p1-10.0.87"

permissions:
  contents: read

concurrency:
  group: user-audit-p1-10.0.87-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run verify:user-audit-p1
      - run: npm run build

  p1-browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Inicio + Comparador P1
        run: >-
          npx playwright test
          tests/e2e/inicio-smart-brief.spec.ts
          tests/e2e/comparison-ui.spec.ts
          --project=chromium-desktop
          --workers=1
      - name: Análisis QA-02/QA-03 desktop y móvil
        run: >-
          npx playwright test
          tests/e2e/premium-analysis-visual.spec.ts
          --grep "QA-02|QA-03"
          --project=chromium-desktop
          --project=chromium-mobile
          --workers=1
