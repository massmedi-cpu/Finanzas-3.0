name: Dispatch Production Postflight 10.0.46 Once

on:
  push:
    branches:
      - ops/postflight-10.0.46
    paths:
      - .github/workflows/dispatch-production-postflight-10.0.46-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact Production postflight on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response_code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-postflight.yml/dispatches" \
            --data '{"ref":"main","inputs":{"production_url":"https://financialapp-home.vercel.app","expected_version":"10.0.46","deployment_commit":"691f725048a43cea18287f2100fb8bc84760c167","deployment_id":"dpl_CwejiBbBbSmeC75DMVMCMv42rS9N"}}')"
          test "$response_code" = "204" || { cat /tmp/dispatch-response.txt; exit 1; }
          echo "production_postflight_dispatch=accepted"
