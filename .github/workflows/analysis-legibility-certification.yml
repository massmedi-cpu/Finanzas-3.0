name: Analysis Legibility Certification

on:
  push:
    branches:
      - audit/analysis-legibility-10.0.11
  pull_request:
    paths:
      - "app/analysis/**"
      - "tests/e2e/analysis-chart-layout.spec.ts"
      - ".github/workflows/analysis-legibility-certification.yml"

concurrency:
  group: analysis-legibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Typecheck, build and Analysis chart regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Analysis chart regression on desktop and mobile
        run: npx playwright test tests/e2e/analysis-chart-layout.spec.ts tests/e2e/analysis-redesign-cardinality.spec.ts tests/e2e/premium-analysis-visual.spec.ts --project=chromium-desktop --project=chromium-mobile --workers=2

      - name: Preserve Analysis visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-patterns-${{ github.sha }}
          path: test-results/**/analysis-patterns-*.png
          if-no-files-found: ignore
          retention-days: 7
