name: Document Deletion Indexes 10.0.20

on:
  push:
    branches:
      - audit/document-deletion-fk-indexes-10.0.20
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260926191000_cover_document_deletion_foreign_keys.sql'
      - 'tests/e2e/document-deletion-index-contract.spec.ts'
      - '.github/workflows/document-deletion-indexes-10.0.20.yml'
      - 'vercel.json'

permissions:
  contents: read

concurrency:
  group: document-deletion-indexes-10.0.20-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Final foreign-key index contract
        run: npx playwright test tests/e2e/document-deletion-index-contract.spec.ts --project=chromium-desktop

      - name: Verify version contract
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');const v=p.version.split('.').map(Number);if(v.length!==3||v[0]!==10||v[1]!==0||v[2]<20||l.version!==p.version||l.packages[''].version!==p.version)process.exit(1)"
