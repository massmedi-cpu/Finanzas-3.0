name: PRE-032 Apply Category Identity Once

on:
  push:
    branches:
      - pre032/category-identity-10.0.50
    paths:
      - ".github/pre032-category-identity-trigger"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PRE-032 exact branch
        uses: actions/checkout@v4
        with:
          ref: pre032/category-identity-10.0.50
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic PRE-032 patch
        run: node scripts/apply-pre032-category-identity.mjs

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Corrected Axioma §§62–71 contract
        run: node scripts/audit-axioma-62-71.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit verified PRE-032 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "financial-app-ci"
          git config user.email "financial-app-ci@users.noreply.github.com"
          git add app src scripts docs package.json package-lock.json
          git diff --cached --quiet && { echo "No PRE-032 changes were produced"; exit 1; }
          git commit -m "PRE-032: propagate category identity across Financial App 10.0.50"
          git push origin HEAD:pre032/category-identity-10.0.50
