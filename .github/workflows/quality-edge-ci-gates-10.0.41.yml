name: Quality Edge CI Gates 10.0.41

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/app-shell.tsx"
      - "app/app-shell.module.css"
      - "app/mobile-navigation.tsx"
      - "src/application/analysis/analysis-engine.ts"
      - "src/domain/document-ocr.ts"
      - "src/application/document-ocr-service.ts"
      - "supabase/functions/financial-app-db-gateway/transaction-management.ts"
      - "supabase/migrations/20260905225500_phase5_financial_logic_core.sql"
      - "supabase/migrations/20260903200004_financial_app_foundations.sql"
      - "supabase/migrations/20260906194000_phase9_document_engine_core.sql"
      - "tests/e2e/navigation-performance-10.0.30.spec.ts"
      - "tests/e2e/extreme-financial-edge-cases-10.0.32.spec.ts"
      - "tests/e2e/extreme-financial-scenarios.spec.ts"
      - "tests/e2e/analysis-history-integrity.spec.ts"
      - "tests/e2e/safe-reversible-edits.spec.ts"
      - "tests/e2e/recurrences.spec.ts"
      - "tests/e2e/document-ocr-edge-cases-10.0.33.spec.ts"
      - "tests/e2e/document-ocr-contract.spec.ts"
      - "tests/e2e/document-ocr-structured-review.spec.ts"
      - "tests/e2e/document-ocr-natural-review.spec.ts"
      - "tests/e2e/document-ocr-service.spec.ts"
      - "tests/e2e/documents.spec.ts"
      - "scripts/verify-navigation-performance-10.0.30.mjs"
      - "scripts/verify-quality-edge-ci-gates-10.0.41.mjs"
      - ".github/workflows/navigation-performance.yml"
      - ".github/workflows/extreme-financial-edge-cases.yml"
      - ".github/workflows/document-ocr-edge-cases.yml"
      - ".github/workflows/quality-edge-ci-gates-10.0.41.yml"

permissions:
  contents: read

concurrency:
  group: quality-edge-ci-gates-10.0.41-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reusable gate contract
        run: node scripts/verify-quality-edge-ci-gates-10.0.41.mjs

      - name: Navigation performance contract
        run: node scripts/verify-navigation-performance-10.0.30.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Navigation desktop and mobile
        run: npx playwright test tests/e2e/navigation-performance-10.0.30.spec.ts --project=chromium-desktop --project=chromium-mobile --workers=2

      - name: Financial edge-case contracts
        run: >-
          npx playwright test
          tests/e2e/extreme-financial-edge-cases-10.0.32.spec.ts
          tests/e2e/extreme-financial-scenarios.spec.ts
          tests/e2e/analysis-history-integrity.spec.ts
          tests/e2e/safe-reversible-edits.spec.ts
          tests/e2e/recurrences.spec.ts
          --project=chromium-desktop
          --workers=2

      - name: Document and OCR edge-case contracts
        run: >-
          npx playwright test
          tests/e2e/document-ocr-edge-cases-10.0.33.spec.ts
          tests/e2e/document-ocr-contract.spec.ts
          tests/e2e/document-ocr-structured-review.spec.ts
          tests/e2e/document-ocr-natural-review.spec.ts
          tests/e2e/document-ocr-service.spec.ts
          tests/e2e/documents.spec.ts
          --project=chromium-desktop
          --workers=2
