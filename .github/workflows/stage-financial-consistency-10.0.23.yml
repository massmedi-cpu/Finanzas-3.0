name: Stage Financial Consistency 10.0.23

on:
  push:
    branches:
      - audit/cross-module-financial-consistency-10.0.23

permissions:
  contents: write

jobs:
  stage:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Patch Inicio with guarded replacements
        run: node scripts/patch-financial-consistency-10.0.23.mjs

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Remove one-shot staging files
        run: rm scripts/patch-financial-consistency-10.0.23.mjs .github/workflows/stage-financial-consistency-10.0.23.yml

      - name: Commit staged result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/inicio-overview.tsx package-lock.json scripts/patch-financial-consistency-10.0.23.mjs .github/workflows/stage-financial-consistency-10.0.23.yml
          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 0
          fi
          git commit -m "chore: stage Financial App 10.0.23"
          git push origin HEAD:audit/cross-module-financial-consistency-10.0.23
