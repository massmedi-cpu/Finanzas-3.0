name: REL-071 Closure Dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rel071-closure-dispatch.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-postflight:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Production Postflight for 10.0.71
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run production-postflight.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f production_url=https://financialapp-home.vercel.app/ \
            -f expected_version=10.0.71 \
            -f deployment_commit=3807157e2febded6a8c4c863668883e136c697e0 \
            -f deployment_id=dpl_CQLBS7pkKNKVdGoUvyfQpXEW9Lwd
