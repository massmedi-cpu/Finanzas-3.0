name: REL-059 Backup Dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rel059-backup-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Production Backup v2 for exact REL-059 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run production-backup-v2.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f source_commit=43ef68e9c5026a982389c07077e790cc1f484e1e \
            -f expected_app_version=10.0.59
