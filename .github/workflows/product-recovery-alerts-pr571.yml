name: RECUPERACION-PRODUCTO PR571 alertas conteos documentales

on:
  push:
    branches:
      - chat/alerts-document-counts-20261009
    paths:
      - 'app/alerts/**'
      - 'src/application/global-alerts.ts'
      - 'scripts/audit-axioma-62-71.mjs'
      - 'tests/e2e/alerts-center.spec.ts'
      - '.github/workflows/product-recovery-alerts-pr571.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-alerts-pr571-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Dependencias bloqueadas
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Contrato Axioma 62-71
        run: node scripts/audit-axioma-62-71.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Build optimizada y guardas
        run: npm run build
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Alertas y centro de revision en escritorio y movil
        run: >-
          npx playwright test
          tests/e2e/alerts-center.spec.ts
          tests/e2e/global-alerts-engine.spec.ts
          tests/e2e/review-center.spec.ts
          tests/e2e/review-action-center.spec.ts
          --project=chromium-desktop --project=chromium-mobile
          --workers=1
