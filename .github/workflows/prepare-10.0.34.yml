name: Prepare 10.0.34

on:
  push:
    branches:
      - feature/final-cleanup-10.0.34
    paths:
      - ".github/workflows/prepare-10.0.34.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/final-cleanup-10.0.34
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Synchronize 10.0.34 with npm
        run: |
          npm version 10.0.34 --no-git-tag-version
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.version !== '10.0.34' || lock.version !== '10.0.34' || lock.packages?.['']?.version !== '10.0.34') {
            throw new Error('10.0.34 version metadata is not synchronized');
          }
          NODE

      - name: Commit generated metadata
        run: |
          if git diff --quiet; then
            echo "10.0.34 already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: version Financial App 10.0.34"
          git push origin HEAD:feature/final-cleanup-10.0.34
