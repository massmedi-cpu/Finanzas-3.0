name: REL-060 Backup Dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rel060-backup-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Production Backup v2 for exact REL-060 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run production-backup-v2.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f source_commit=bed4edeaadd0aa7d95391c7273520bccc2b87b1b \
            -f expected_app_version=10.0.60
