name: REL-068 Production Postflight Dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rel068-production-postflight-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact Production Postflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run production-postflight.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f production_url="https://financialapp-home.vercel.app/" \
            -f expected_version="10.0.68" \
            -f deployment_commit="58129bed57db03075f84afa8f64e65bdbf797b62" \
            -f deployment_id="dpl_4S87EEKB55WHB9g45uqfyAcUz2fc"
