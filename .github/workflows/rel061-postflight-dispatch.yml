name: REL-061 Production Postflight Dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rel061-postflight-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Production Postflight for 10.0.61
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run production-postflight.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f production_url=https://financialapp-home.vercel.app/ \
            -f expected_version=10.0.61 \
            -f deployment_commit=1cd800ce8f6334823e94221d137c96efdf1ef26a \
            -f deployment_id=dpl_9S59EzPpBqvbFDrzysGepaAwwkcZ
