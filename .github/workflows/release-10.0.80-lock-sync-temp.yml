name: Release 10.0.80 Lock Sync Temp

on:
  push:
    branches:
      - release/10.0.80-post-ocr-consolidation
    paths:
      - package.json

permissions:
  contents: write

jobs:
  sync-lock-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: release/10.0.80-post-ocr-consolidation
          fetch-depth: 0
      - name: Synchronize lockfile release identity
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = pkg.version;
          if (!lock.packages || !lock.packages['']) throw new Error('lock_root_package_missing');
          lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package-lock for 10.0.80"
          git push origin HEAD:release/10.0.80-post-ocr-consolidation
