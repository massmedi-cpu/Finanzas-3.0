name: REL-059 Production Postflight Dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rel059-postflight-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Production Postflight for 10.0.59
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run production-postflight.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f production_url=https://financialapp-home.vercel.app/ \
            -f expected_version=10.0.59 \
            -f deployment_commit=7ba8abff8e0362554c886d8ae80e77c977f35ad5 \
            -f deployment_id=dpl_HPYMe2ua974xQT681CDdxjAJFVbh
