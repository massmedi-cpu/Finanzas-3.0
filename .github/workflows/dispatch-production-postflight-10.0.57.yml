name: Dispatch Production Postflight 10.0.57

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-production-postflight-10.0.57.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical Production Postflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-postflight.yml/dispatches"
          body='{"ref":"main","inputs":{"production_url":"https://financialapp-home.vercel.app/","expected_version":"10.0.57","deployment_commit":"bc4414a77ccd9e380936313f4695175ac825077d","deployment_id":"dpl_1LDEWnF7abU7d1VbH9gsTdhTQov4"}}'
          code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            -d "$body")"
          if [ "$code" != "204" ]; then
            cat /tmp/dispatch.out
            echo "unexpected_dispatch_status=$code"
            exit 1
          fi
          echo "canonical_production_postflight_dispatched=true"
