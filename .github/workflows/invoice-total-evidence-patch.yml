name: Apply strict invoice total evidence
on:
  push:
    branches:
      - fix/invoice-total-evidence-20260903
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-invoice-total-evidence]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/invoice-total-evidence-20260903
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Apply bounded source transformation
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='lib/document/ticket-ocr.ts';
          let source=fs.readFileSync(path,'utf8');
          const anchor=`function strongTaxEvidence(lower: string) {`;
          const helper=`function explicitInvoiceGross(lines: string[]) {
            const explicit = /\\b(?:TOTAL\\s+(?:FACTURA|ALBAR[AÁ]N|DOCUMENTO)|IMPORTE\\s+TOTAL|TOTAL\\s+A\\s+PAGAR|A\\s+PAGAR)\\b[^0-9-]{0,36}(-?\\d{1,7}(?:[.\\s]\\d{3})*(?:,\\d{2,3}|\\.\\d{2,3}))/i;
            const baseLike = lines
              .filter((line) => /\\b(?:SUBTOTAL|BASE\\s+IMPONIBLE|BASE\\s+NETA|TOTAL\\s+NETO)\\b/i.test(line))
              .flatMap(extractAmounts);
            const zeroTaxEvidence = lines.some((line) => /\\b(?:IVA\\s*[:=-]?\\s*0(?:[.,]0{1,3})?|EXENT[OA]\\s+(?:DE\\s+)?IVA|IVA\\s+EXENT[OA])\\b/i.test(line));
            for (const line of [...lines].reverse()) {
              const match = line.match(explicit);
              if (!match) continue;
              const value = parseEuroValue(match[1]);
              if (value === null) continue;
              const duplicatesBase = baseLike.some((candidate) => Math.abs(candidate - value) <= 0.03);
              if (duplicatesBase && !zeroTaxEvidence) continue;
              return value;
            }
            return null;
          }

          `;
          if((source.split(anchor).length-1)!==1)throw new Error('strongTaxEvidence anchor mismatch');
          source=source.replace(anchor,helper+anchor);

          const startMarker='  if (documentType === "invoice") {';
          const endMarker='\n\n  return { documentType, documentDate, amount, merchant: likelyMerchant(lines), lines };';
          const start=source.indexOf(startMarker);
          const end=source.indexOf(endMarker,start);
          if(start<0||end<0)throw new Error(`invoice boundaries missing start=${start} end=${end}`);
          if(source.indexOf(startMarker,start+1)>=0&&source.indexOf(startMarker,start+1)<end)throw new Error('multiple invoice blocks before return');
          const after=`  if (documentType === "invoice") {
            // En facturas/albaranes se descarta la inferencia genérica: un número grande
            // puede ser base, subtotal o precio unitario. Se acepta un TOTAL documental
            // explícito solo si no replica una base/subtotal conocida; como respaldo se
            // mantiene la corroboración financiera base + IVA ya existente.
            amount = explicitInvoiceGross(lines);
            if (amount === null) {
              const vatBreakdown = invoiceVatBreakdown(lines);
              const base = labeledAmount(lines, /\\bBASE\\s+IMPONIBLE\\b[^0-9]{0,24}(\\d{1,7}[.,]\\d{2,3})/i) ?? vatBreakdown?.base ?? null;
              const tax = labeledAmount(lines, /\\bIMPORTE\\s+IVA\\b[^0-9]{0,24}(\\d{1,7}[.,]\\d{2,3})/i) ?? vatBreakdown?.tax ?? null;
              if (base !== null && tax !== null) {
                const gross = Math.round((base + tax) * 100) / 100;
                const candidates = lines.flatMap(extractAmounts);
                if (candidates.some((value) => Math.abs(value - gross) <= 0.03)) amount = gross;
              }
            }
          }`;
          source=source.slice(0,start)+after+source.slice(end);
          fs.writeFileSync(path,source);
          NODE

          node <<'NODE'
          const fs=require('node:fs');
          const path='scripts/ocr-invoice-amount-confidence-tests.ts';
          let source=fs.readFileSync(path,'utf8');
          const anchor=`const corroboratedInvoice=\`FACTURA 28/08/2026`;
          const tests=`const noisyExplicitTotal=\`77 ALBARAN
          Fecha 28/08/2026
          5,00 PRODUCTO 125,320 21,00 626,600
          PORTES 52,600 21,00 52,600
          Subtotal 679,200
          Especialistas PARA ELEVACION 679,200 Y TRANSPORTE 142630 — TOTAL ALBARAN 821,830\`;
          const noisyExplicit=inferDocumentMetadata(noisyExplicitTotal);
          assert.equal(noisyExplicit.documentType,"invoice");
          assert.equal(noisyExplicit.amount,821.83,"TOTAL ALBARAN explícito y distinto del subtotal debe conservarse aunque el OCR mezcle ruido en la misma línea");

          const duplicatedSubtotal=\`FACTURA 28/08/2026
          SUBTOTAL 679,20
          TOTAL FACTURA 679,20\`;
          assert.equal(inferDocumentMetadata(duplicatedSubtotal).amount,null,"Un TOTAL que replica subtotal/base sin evidencia de IVA cero no es un bruto fiable");

          const exemptInvoice=\`FACTURA 28/08/2026
          SUBTOTAL 100,00
          IVA 0,00
          TOTAL FACTURA 100,00\`;
          assert.equal(inferDocumentMetadata(exemptInvoice).amount,100,"IVA cero explícito permite que total y subtotal coincidan legítimamente");

          `;
          if((source.split(anchor).length-1)!==1)throw new Error('invoice test anchor mismatch');
          source=source.replace(anchor,tests+anchor);
          fs.writeFileSync(path,source);
          NODE

          ./node_modules/.bin/tsx scripts/ocr-invoice-amount-confidence-tests.ts
          rm .github/workflows/invoice-total-evidence-patch.yml
          git diff --check
      - name: Commit source-only fix
        shell: bash
        run: |
          git config user.name "financial-app-ci"
          git config user.email "financial-app-ci@users.noreply.github.com"
          git add lib/document/ticket-ocr.ts scripts/ocr-invoice-amount-confidence-tests.ts .github/workflows/invoice-total-evidence-patch.yml
          git commit -m "Accept strong invoice totals without weakening subtotal guard"
          git push origin HEAD:fix/invoice-total-evidence-20260903
