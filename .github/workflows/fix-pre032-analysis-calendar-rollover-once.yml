name: Fix PRE-032 Analysis Calendar Rollover Once

on:
  push:
    branches:
      - fix/pre032-analysis-calendar-rollover
    paths:
      - ".github/fix-pre032-analysis-calendar-trigger"

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pre032-analysis-calendar-rollover
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Patch calendar-sensitive Analysis mock without weakening selected request assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/analysis.spec.ts')
          source = path.read_text()
          before = '''async function mockAnalysisApi(page: Parameters<typeof test>[0] extends never ? never : any, snapshot: AnalysisSnapshot) {
            await page.route(/\\/api\\/analysis(?:\\?.*)?$/, async (route: any) => {
              const url = new URL(route.request().url());
              expect(url.pathname).toBe("/api/analysis");
              expect(url.searchParams.get("month")).toBe("2026-09");
              expect(url.searchParams.get("range")).toBe("1m");
              await route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(snapshot) });
            });
          }

          async function loadMockAnalysis(page: any, snapshot: AnalysisSnapshot) {
            await mockAnalysisApi(page, snapshot);
            await page.goto("/analysis");
            await page.getByLabel("Mes de referencia").fill("2026-09");
            await page.getByRole("button", { name: "1 mes" }).click();
            await page.getByRole("button", { name: "Aplicar" }).click();
            await expect(page.getByRole("heading", { name: "Análisis", level: 1 })).toBeVisible();
          }
          '''
          after = '''async function mockAnalysisApi(page: Parameters<typeof test>[0] extends never ? never : any, snapshot: AnalysisSnapshot) {
            let selectedRequestSeen = false;
            await page.route(/\\/api\\/analysis(?:\\?.*)?$/, async (route: any) => {
              const url = new URL(route.request().url());
              expect(url.pathname).toBe("/api/analysis");
              if (url.searchParams.get("month") === "2026-09") {
                expect(url.searchParams.get("range")).toBe("1m");
                selectedRequestSeen = true;
              }
              await route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(snapshot) });
            });
            return () => selectedRequestSeen;
          }

          async function loadMockAnalysis(page: any, snapshot: AnalysisSnapshot) {
            const selectedRequestSeen = await mockAnalysisApi(page, snapshot);
            await page.goto("/analysis");
            await page.getByLabel("Mes de referencia").fill("2026-09");
            await page.getByRole("button", { name: "1 mes" }).click();
            await page.getByRole("button", { name: "Aplicar" }).click();
            await expect.poll(selectedRequestSeen).toBe(true);
            await expect(page.getByRole("heading", { name: "Análisis", level: 1 })).toBeVisible();
          }
          '''
          if source.count(before) != 1:
              raise SystemExit(f'expected exact Analysis mock block once, found {source.count(before)}')
          path.write_text(source.replace(before, after, 1))
          PY
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify corrected Analysis fixture on desktop and mobile
        run: npm run test:e2e -- tests/e2e/analysis.spec.ts --project=chromium-desktop --project=chromium-mobile --workers=1
      - name: Commit only the verified test repair and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "financial-app-ci"
          git config user.email "financial-app-ci@users.noreply.github.com"
          git rm .github/workflows/fix-pre032-analysis-calendar-rollover-once.yml .github/fix-pre032-analysis-calendar-trigger
          git add tests/e2e/analysis.spec.ts
          git commit -m "fix(test): make Analysis selection robust across month rollover"
          git push origin HEAD:fix/pre032-analysis-calendar-rollover
