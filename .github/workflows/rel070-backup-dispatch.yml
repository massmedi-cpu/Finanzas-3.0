name: REL-070 Backup Dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rel070-backup-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Production Backup v2 for exact REL-070 commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-backup-v2.yml/dispatches" \
            -d '{"ref":"main","inputs":{"source_commit":"c67dfcbb6f7cf46574b156eb120b92bbb016bf52","expected_app_version":"10.0.70"}}'
