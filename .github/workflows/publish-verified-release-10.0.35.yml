name: Publish Verified Release 10.0.35

on:
  workflow_run:
    workflows:
      - Production Postflight Release 10.0.35
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: financial-app-production-release-10.0.35
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_URL: https://financialapp-home.vercel.app
      DEPLOYED_SHA: 122a87023cd6a7a9bb16518ba199d50cfe4ee760
      RELEASE_TAG: v10.0.35
    steps:
      - name: Checkout exact deployed commit
        uses: actions/checkout@v6
        with:
          ref: 122a87023cd6a7a9bb16518ba199d50cfe4ee760
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify expected release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "10.0.35"
          test "$(git rev-parse HEAD)" = "$DEPLOYED_SHA"

      - name: Read exact Production build identity
        shell: bash
        run: |
          set -euo pipefail
          base="${PRODUCTION_URL%/}"
          curl --fail --silent --show-error \
            --output /tmp/financial-app-production-build.json \
            "$base/api/build"

      - name: Generate verified immutable manifest
        shell: bash
        run: |
          set -euo pipefail
          npm run release:manifest -- \
            --build-info /tmp/financial-app-production-build.json \
            --output /tmp/release-manifest.production.json \
            --expected-sha "$DEPLOYED_SHA" \
            --tag "$RELEASE_TAG" \
            --expected-environment production

      - name: Refuse an existing immutable tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag $RELEASE_TAG already exists; refusing to move or replace immutable provenance."
            exit 1
          fi

      - name: Publish GitHub release and attach manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            /tmp/release-manifest.production.json#release-manifest.json \
            --target "$DEPLOYED_SHA" \
            --title "Financial App 10.0.35" \
            --notes "Verified release after successful Production postflight. The attached manifest binds version, tag, deployed commit, deployment and SHA-256 deployment provenance."

      - name: Verify published tag target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin "$RELEASE_TAG"
          published_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$published_sha" = "$DEPLOYED_SHA"

      - name: Preserve release manifest as workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-10.0.35-${{ github.event.workflow_run.id }}
          path: /tmp/release-manifest.production.json
          retention-days: 90
