name: Analysis V3 Client Patch

on:
  push:
    branches:
      - work/analysis-premium-v3
    paths:
      - .github/workflows/analysis-v3-client-patch.yml

permissions:
  contents: write

jobs:
  patch-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/analysis-premium-v3
          fetch-depth: 0

      - name: Apply exact client hardening patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/analysis/analysis-client.tsx")
          text = path.read_text()

          import_marker = 'import { ContributionChart } from "../../src/design/contribution-chart";'
          import_line = 'import { isAnalysisSnapshot } from "../../src/application/analysis/analysis-contract";\n'
          if import_line.strip() not in text:
              if text.count(import_marker) != 1:
                  raise SystemExit("analysis client import anchor changed")
              text = text.replace(import_marker, import_line + import_marker, 1)

          cast_marker = 'const next = payload as AnalysisSnapshot;'
          cast_replacement = 'if (!isAnalysisSnapshot(payload)) throw new Error("analysis_contract_invalid");\n\n      const next = payload;'
          if text.count(cast_marker) != 1:
              raise SystemExit("analysis client snapshot cast anchor changed")
          cast_index = text.index(cast_marker)
          text = text[:cast_index] + cast_replacement + text[cast_index + len(cast_marker):]

          tail_marker = '      setMerchantsExpanded(false);'
          tail_index = text.find(tail_marker, cast_index)
          if tail_index < 0:
              raise SystemExit("analysis client refresh tail anchor changed")
          tail_end = tail_index + len(tail_marker)
          url_sync = '\n\n      const nextParams = new URLSearchParams({\n        month: next.selection.month,\n        range: next.selection.range,\n      });\n      if (next.selection.accountId) nextParams.set("accountId", next.selection.accountId);\n      window.history.replaceState(window.history.state, "", `/analysis?${nextParams.toString()}`);'
          text = text[:tail_end] + url_sync + text[tail_end:]

          path.write_text(text)
          PY

      - name: Verify patch shape
        run: |
          grep -F 'isAnalysisSnapshot(payload)' app/analysis/analysis-client.tsx
          grep -F 'window.history.replaceState' app/analysis/analysis-client.tsx
          test "$(grep -c 'analysis_contract_invalid' app/analysis/analysis-client.tsx)" -eq 1

      - name: Commit isolated change
        run: |
          if git diff --quiet -- app/analysis/analysis-client.tsx; then
            echo "No changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/analysis/analysis-client.tsx
          git commit -m "feat(analysis): persist and validate applied filters"
          git push origin HEAD:work/analysis-premium-v3
