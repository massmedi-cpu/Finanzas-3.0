name: Audit copy fix

on:
  push:
    branches:
      - audit/precommercial-10.0.0
    paths:
      - .github/workflows/audit-copy-fix.yml

permissions:
  contents: write

jobs:
  fix-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: audit/precommercial-10.0.0
          fetch-depth: 0

      - name: Replace residual development copy exactly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "app/transactions/transactions-client.tsx": [
                  ("<p className={styles.eyebrow}>FASE 4 · MOVIMIENTOS</p>",
                   "<p className={styles.eyebrow}>FINANCIAL APP · MOVIMIENTOS</p>"),
              ],
              "app/documents/documents-client.tsx": [
                  ("<p className={styles.eyebrow}>FINANCIAL APP · FASE 11</p>",
                   "<p className={styles.eyebrow}>FINANCIAL APP · DOCUMENTOS</p>"),
              ],
              "app/configuration/source/source-client.tsx": [
                  ("<a className=\"back-link\" href=\"/\">← Fundamentos</a>",
                   "<a className=\"back-link\" href=\"/configuration\">← Configuración</a>"),
                  ("<p className=\"eyebrow\">FASE 2 · FUENTE OFICIAL</p>",
                   "<p className=\"eyebrow\">FINANCIAL APP · FUENTE BANCARIA</p>"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected exactly one occurrence of {old!r}, found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          Path(".github/workflows/audit-copy-fix.yml").unlink()
          PY

      - name: Verify forbidden product copy is gone
        shell: bash
        run: |
          ! grep -RInE 'FASE [0-9]|← Fundamentos' \
            app/transactions/transactions-client.tsx \
            app/documents/documents-client.tsx \
            app/configuration/source/source-client.tsx
          grep -n 'FINANCIAL APP · MOVIMIENTOS' app/transactions/transactions-client.tsx
          grep -n 'FINANCIAL APP · DOCUMENTOS' app/documents/documents-client.tsx
          grep -n 'FINANCIAL APP · FUENTE BANCARIA' app/configuration/source/source-client.tsx
          grep -n 'href="/configuration">← Configuración' app/configuration/source/source-client.tsx

      - name: Commit exact product-copy correction
        shell: bash
        run: |
          git config user.name "massmedi-cpu"
          git config user.email "massmedi@gmail.com"
          git add app/transactions/transactions-client.tsx app/documents/documents-client.tsx app/configuration/source/source-client.tsx .github/workflows/audit-copy-fix.yml
          git commit -m "fix(audit): remove residual development copy [vercel-preview]"
          git push origin HEAD:audit/precommercial-10.0.0
