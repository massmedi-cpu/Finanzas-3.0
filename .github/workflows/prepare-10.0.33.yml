name: Prepare 10.0.33

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/prepare-10.0.33.yml"

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply exact certified fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/infrastructure/ocr/receipt-row-cell-consensus-provider.ts")
          text = source.read_text()
          old = "return Math.abs(units * price - amount) > 1;"
          new = "return units * price !== amount;"
          if old in text:
              source.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("unexpected arithmetic contract")

          spec = Path("tests/e2e/documents.spec.ts")
          text = spec.read_text()
          old = 'await expect(page.getByRole("status")).toContainText("sólo se ejecutará si lo solicitas");'
          new = 'await expect(page.getByRole("status").filter({ hasText: "sólo se ejecutará si lo solicitas" })).toBeVisible();'
          if old in text:
              spec.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("unexpected document status selector")
          PY

          current=$(node -p "require('./package.json').version")
          if [ "$current" != "10.0.33" ]; then
            npm version 10.0.33 --no-git-tag-version
          fi

          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.version !== '10.0.33' || lock.version !== '10.0.33' || lock.packages?.['']?.version !== '10.0.33') {
            throw new Error('10.0.33 version metadata is not synchronized');
          }
          NODE

      - name: Commit generated update when needed
        run: |
          if git diff --quiet; then
            echo "10.0.33 already prepared"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/ocr/receipt-row-cell-consensus-provider.ts tests/e2e/documents.spec.ts package.json package-lock.json
          git commit -m "fix: enforce exact OCR arithmetic and version 10.0.33"
          git push origin HEAD:${{ github.head_ref }}
