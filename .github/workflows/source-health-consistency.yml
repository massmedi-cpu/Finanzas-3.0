name: Source Health Consistency

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/api/analysis/source-freshness/route.ts"
      - "app/analysis/analysis-source-freshness.tsx"
      - "app/analysis/analysis-source-freshness.module.css"
      - "app/configuration/source/source-client.tsx"
      - "app/inicio-overview.tsx"
      - "app/review/review-client.tsx"
      - "src/application/source-sync-incidents.ts"
      - "tests/e2e/analysis-contract-navigation.spec.ts"
      - "tests/e2e/source-health-consistency.spec.ts"
      - "tests/e2e/source-incident-trace.spec.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/source-health-consistency.yml"
      - ".github/workflows/source-incident-trace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Source health contracts and UX
        run: npx playwright test tests/e2e/source-health-consistency.spec.ts --project=chromium-desktop --project=chromium-mobile --workers=2
