name: Release 10.0.55

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/app-shell.module.css"
      - "app/layout.tsx"
      - "app/semantic-tokens.css"
      - "app/net-worth/net-worth.module.css"
      - "app/configuration/source/source-overview.module.css"
      - "app/configuration/source/source.module.css"
      - "scripts/verify-semantic-design-tokens.mjs"
      - "scripts/verify-premium-design-system.mjs"
      - "docs/precommercial-audit/07c-semantic-tokens-10.0.55.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release-10.0.55.yml"

permissions:
  contents: read

concurrency:
  group: release-10.0.55-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Semantic design token guard
        run: npm run verify:semantic-design

      - name: Premium design guard
        run: npm run verify:premium-design

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive regression matrix
        run: npm run test:responsive-matrix

      - name: Source overview and diagnostics regression
        run: npx playwright test tests/e2e/source-incident-trace.spec.ts --project=chromium-desktop --project=chromium-mobile --workers=2
