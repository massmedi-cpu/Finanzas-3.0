name: Release 10.0.55

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-10.0.55-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Semantic design token guard
        run: npm run verify:semantic-design

      - name: Premium design guard
        run: npm run verify:premium-design

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive regression matrix
        run: npm run test:responsive-matrix

      - name: Source overview and diagnostics regression
        run: npx playwright test tests/e2e/source-incident-trace.spec.ts --project=chromium-desktop --project=chromium-mobile --workers=2
