name: Finalize 3.0 lockfile
on:
  push:
    branches: [develop/v3.0.0-foundation]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'align lockfile 3.0.0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Align lockfile version
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='package-lock.json';
          const lock=JSON.parse(fs.readFileSync(path,'utf8'));
          lock.version='3.0.0';
          if(!lock.packages || !lock.packages['']) throw new Error('Root lock package missing');
          lock.packages[''].version='3.0.0';
          fs.writeFileSync(path,JSON.stringify(lock,null,2)+'\n');
          NODE
      - name: Commit lockfile
        run: |
          git config user.name "financial-app-3.0-bot"
          git config user.email "financial-app-3.0-bot@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "release(3.0): align lockfile 3.0.0"
          git push origin HEAD:develop/v3.0.0-foundation
