name: Release Identity

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/core/build-info.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-release-identity.mjs"
      - ".github/workflows/release-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-release-identity.mjs
      - run: npm run typecheck
      - run: npm run build
