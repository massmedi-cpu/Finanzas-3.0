name: One Shot CR008 Version 10.0.9

on:
  push:
    branches:
      - 'audit/cr008-ocr-v22-10.0.9'
    paths:
      - '.github/workflows/one-shot-cr008-version-10-0-9.yml'

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact CR-008 branch
        uses: actions/checkout@v6
        with:
          ref: audit/cr008-ocr-v22-10.0.9
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Bump package and lock to 10.0.9
        shell: bash
        run: |
          set -euo pipefail
          npm version 10.0.9 --no-git-tag-version --allow-same-version
          node - <<'NODE'
          const p = require('./package.json');
          const l = require('./package-lock.json');
          if (p.version !== '10.0.9' || l.version !== '10.0.9' || l.packages?.['']?.version !== '10.0.9') process.exit(1);
          NODE
          git diff --check

      - name: Commit versioned candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump Financial App to 10.0.9"
          git push origin HEAD:audit/cr008-ocr-v22-10.0.9
