name: Analysis Staging Regression Temp

on:
  push:
    branches:
      - 'rebuild/phase-analysis-budget-provenance'

permissions:
  contents: read

jobs:
  analysis-staging-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Analysis regression
        run: >-
          npm run test:e2e --
          tests/e2e/analysis.spec.ts
          tests/e2e/analysis-contract-navigation.spec.ts
          tests/e2e/analysis-presentation-states.spec.ts
          tests/e2e/analysis-presentation-v6.spec.ts
          --project=chromium-desktop
          --project=chromium-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-staging-regression-${{ github.sha }}
          path: playwright-report/
          retention-days: 7
