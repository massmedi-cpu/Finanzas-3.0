name: REL-067 Production Postflight Dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rel067-production-postflight-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact 10.0.67 Production postflight
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-postflight.yml \
            --ref main \
            -f production_url=https://financialapp-home.vercel.app/ \
            -f expected_version=10.0.67 \
            -f deployment_commit=e4b6fe1db6de9385edd10b25c96da89b69b4035e \
            -f deployment_id=dpl_3DWXTFRU7iX7o1RQ4c5hUCwMtHsM
