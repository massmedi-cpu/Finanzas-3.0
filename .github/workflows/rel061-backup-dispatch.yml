name: REL-061 Backup Dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rel061-backup-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Production Backup v2 for exact REL-061 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run production-backup-v2.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f source_commit=310bc257595c2914bf752c2c042ab42be77ffd44 \
            -f expected_app_version=10.0.61
