name: PRE-039 Axioma 120-145

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "supabase/**"
      - "tests/e2e/**"
      - "scripts/verify-pre039-axioma-120-145.mjs"
      - "docs/audits/pre039-axioma-120-145-certification-20261002.md"
      - "package.json"
      - ".github/workflows/pre039-axioma-120-145.yml"

permissions:
  contents: read

concurrency:
  group: pre039-axioma-120-145-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: PRE-039 static readiness
        run: npm run verify:pre039

      - name: Existing reusable quality contract
        run: node scripts/verify-quality-edge-ci-gates-10.0.41.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Financial edge-case regression
        run: >-
          npx playwright test
          tests/e2e/extreme-financial-edge-cases-10.0.32.spec.ts
          tests/e2e/extreme-financial-scenarios.spec.ts
          tests/e2e/analysis-history-integrity.spec.ts
          tests/e2e/safe-reversible-edits.spec.ts
          tests/e2e/recurrences.spec.ts
          --project=chromium-desktop
          --workers=2

      - name: Responsive consistency matrix
        run: npm run test:responsive-matrix

      - name: OCR and document regression
        run: >-
          npx playwright test
          tests/e2e/document-ocr-edge-cases-10.0.33.spec.ts
          tests/e2e/document-ocr-contract.spec.ts
          tests/e2e/document-ocr-structured-review.spec.ts
          tests/e2e/document-ocr-natural-review.spec.ts
          tests/e2e/document-ocr-service.spec.ts
          tests/e2e/documents.spec.ts
          --project=chromium-desktop
          --workers=2

      - name: PRE-039 reminder for human/release gates
        run: |
          echo "Automated PRE-039 gate complete."
          echo "Do not close §§140, 142 or 144 without real-environment UX validation, final log/trace review and pre-release evidence."
