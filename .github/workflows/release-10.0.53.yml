name: Release 10.0.53

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/configuration/source/**"
      - "app/net-worth/**"
      - "app/navigation-items.ts"
      - "src/application/net-worth/**"
      - "tests/e2e/source-overview-10.0.53.spec.ts"
      - "tests/e2e/net-worth-10.0.53.spec.ts"
      - "docs/precommercial-audit/05a-product-gap-closure-10.0.53.md"
      - "package.json"
      - ".github/workflows/release-10.0.53.yml"

permissions:
  contents: read

concurrency:
  group: release-10.0.53-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Source overview and net worth regression
        run: >-
          npx playwright test
          tests/e2e/source-overview-10.0.53.spec.ts
          tests/e2e/net-worth-10.0.53.spec.ts
          --project=chromium-desktop
          --workers=2
