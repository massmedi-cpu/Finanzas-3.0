name: Sync 2.8 branch with stable 2.5 lockfile
on:
  push:
    branches: [develop/v2.8.0-integrity-rebuild]
permissions:
  contents: write
jobs:
  sync-lock:
    if: ${{ !contains(github.event.head_commit.message, 'sync lockfile to stable 2.5') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Align lockfile with stable 2.5
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='package-lock.json';
          const lock=JSON.parse(fs.readFileSync(path,'utf8'));
          lock.version='2.5.0';
          if(!lock.packages || !lock.packages['']) throw new Error('Root lock package missing');
          lock.packages[''].version='2.5.0';
          fs.writeFileSync(path,JSON.stringify(lock,null,2)+'\n');
          NODE
      - name: Commit lockfile
        run: |
          git config user.name "financial-app-sync-bot"
          git config user.email "financial-app-sync-bot@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "sync(2.8): sync lockfile to stable 2.5"
          git push origin HEAD:develop/v2.8.0-integrity-rebuild
