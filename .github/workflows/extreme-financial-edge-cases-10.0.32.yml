name: Extreme Financial Edge Cases 10.0.32

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/application/analysis/analysis-engine.ts"
      - "supabase/migrations/20260905225500_phase5_financial_logic_core.sql"
      - "supabase/functions/financial-app-db-gateway/transaction-management.ts"
      - "tests/e2e/extreme-financial-edge-cases-10.0.32.spec.ts"
      - "tests/e2e/extreme-financial-scenarios.spec.ts"
      - "tests/e2e/analysis-history-integrity.spec.ts"
      - "tests/e2e/safe-reversible-edits.spec.ts"
      - "tests/e2e/recurrences.spec.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/extreme-financial-edge-cases-10.0.32.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Remaining financial edge-case contracts
        run: >-
          npx playwright test
          tests/e2e/extreme-financial-edge-cases-10.0.32.spec.ts
          tests/e2e/extreme-financial-scenarios.spec.ts
          tests/e2e/analysis-history-integrity.spec.ts
          tests/e2e/safe-reversible-edits.spec.ts
          tests/e2e/recurrences.spec.ts
          --project=chromium-desktop
          --workers=2
