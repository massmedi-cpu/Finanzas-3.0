name: Lockfile Sync 10.0.32

on:
  push:
    branches:
      - feature/extreme-financial-edge-cases-10.0.32
    paths:
      - ".github/workflows/lockfile-sync-10.0.32.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/extreme-financial-edge-cases-10.0.32
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile metadata from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify exact version synchronization
        run: |
          node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!=='10.0.32'||l.version!==p.version||l.packages[''].version!==p.version)process.exit(1)"
          git diff --check

      - name: Commit generated lockfile if needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize 10.0.32 lockfile safely"
          git push origin HEAD:feature/extreme-financial-edge-cases-10.0.32
