name: Prepare Home Release 10.0.77

on:
  push:
    branches:
      - rebuild/phase-9-home-10.0.77

permissions:
  contents: write

concurrency:
  group: prepare-home-release-10.0.77
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/phase-9-home-10.0.77
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare version and accumulated certification
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '10.0.77';
          if (!pkg.scripts.postbuild.includes('verify-home-phase9-10.0.77.mjs')) {
            pkg.scripts.postbuild += ' && node scripts/verify-home-phase9-10.0.77.mjs';
          }
          pkg.scripts['verify:home-phase9'] = 'node scripts/verify-home-phase9-10.0.77.mjs';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const vercel = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          vercel.git = { ...(vercel.git ?? {}), deploymentEnabled: false };
          fs.writeFileSync('vercel.json', JSON.stringify(vercel, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git rm -f .github/workflows/patch-home-phase9-10.0.77.yml
      - name: Commit release preparation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json vercel.json .github/workflows/patch-home-phase9-10.0.77.yml
          git commit -m "chore(release): preparar Financial App 10.0.77"
          git push origin HEAD:rebuild/phase-9-home-10.0.77
