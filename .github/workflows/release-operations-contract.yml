name: Release Operations Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-postflight.yml"
      - ".github/workflows/production-backup-v2.yml"
      - ".github/workflows/backup-production-contract.yml"
      - ".github/workflows/release-operations-contract.yml"
      - "playwright.production-postflight.config.ts"
      - "tests/e2e/production-postflight.spec.ts"
      - "scripts/verify-production-data-readonly.mjs"
      - "scripts/release-source-coverage-gate.mjs"
      - "scripts/verify-release-operations-contract.mjs"
      - ".github/workflows/publish-verified-release.yml"
      - "scripts/verify-production-release-domains.mjs"
      - "tests/unit/verify-production-release-domains.test.mjs"
      - "src/domain/release-production-profile.ts"
      - "tests/unit/release-production-profile.test.mjs"
      - "scripts/create-release-manifest.mjs"
      - "tests/unit/release-manifest-profile.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reusable-release-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-release-operations-contract.mjs
      - name: Certify historical restricted vs future complete release profiles
        run: node --experimental-strip-types --test tests/unit/release-production-profile.test.mjs
      - name: Certify release manifest document feature identity
        run: node --experimental-strip-types --test tests/unit/release-manifest-profile.test.mjs
      - name: Verify dual production-alias release gate rejects mismatched origins
        run: node --experimental-strip-types --test tests/unit/verify-production-release-domains.test.mjs
      - run: npm run typecheck
      - name: Compile generic Production postflight suite without touching Production
        env:
          PRODUCTION_URL: https://example.invalid
          EXPECTED_APP_VERSION: "0.0.0"
          EXPECTED_COMMIT_SHA: "0000000000000000000000000000000000000000"
          EXPECTED_DEPLOYMENT_ID: dpl_ContractOnly
        run: npx playwright test --list --config=playwright.production-postflight.config.ts
