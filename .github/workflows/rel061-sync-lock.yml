name: REL-061 Sync Lockfile

on:
  push:
    branches:
      - release/rel-061-art-008
    paths:
      - .github/workflows/rel061-sync-lock.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/rel-061-art-008

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Synchronize package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Require exact 10.0.61 identity
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!=='10.0.61'||l.version!=='10.0.61'||l.packages[''].version!=='10.0.61')process.exit(1)"

      - name: Commit lockfile if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "REL-061 · sync package-lock 10.0.61"
          git push origin HEAD:release/rel-061-art-008
