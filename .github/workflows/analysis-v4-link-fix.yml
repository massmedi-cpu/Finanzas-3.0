name: Analysis V4 Link Accessibility Fix

on:
  push:
    branches:
      - work/analysis-premium-v4
    paths:
      - .github/workflows/analysis-v4-link-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/analysis-premium-v4
          fetch-depth: 0

      - name: Restore category link semantics
        run: python scripts/fix-analysis-v4-link-semantics.py

      - name: Verify accessible links
        run: |
          test "$(grep -c 'className={styles.breakdownRow} role="listitem"' app/analysis/analysis-client.tsx || true)" -eq 0
          grep -F 'className={styles.breakdownRow}>' app/analysis/analysis-client.tsx

      - name: Remove temporary helpers and commit
        run: |
          rm .github/workflows/analysis-v4-link-fix.yml scripts/fix-analysis-v4-link-semantics.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(analysis): preserve category drilldown link semantics"
          git push origin HEAD:work/analysis-premium-v4
