name: REL-070 Version Dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rel070-version-dispatch.yml

permissions:
  contents: write

jobs:
  version-release-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout REL-070 candidate
        uses: actions/checkout@v6
        with:
          ref: release/10.0.70-transactions-concurrency
          fetch-depth: 0

      - name: Bump canonical version
        run: python scripts/rel070-bump-version.py

      - name: Commit clean REL-070 version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(rel-070): versionar Financial App 10.0.70"
          git push origin HEAD:release/10.0.70-transactions-concurrency
