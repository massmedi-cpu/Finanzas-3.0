name: REL-070 Postflight Dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rel070-postflight-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Production Postflight for REL-070
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-postflight.yml/dispatches" \
            -d '{"ref":"main","inputs":{"production_url":"https://financialapp-home.vercel.app/","expected_version":"10.0.70","deployment_commit":"cfa45d4c8838cb883c7cd694df0c3384ecebe2b7","deployment_id":"dpl_95f2cc1BRJzRWKZPqTDBteozCPjM"}}'
