name: Navigation Performance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/app-shell.tsx"
      - "app/app-shell.module.css"
      - "app/mobile-navigation.tsx"
      - "tests/e2e/navigation-performance-10.0.30.spec.ts"
      - "scripts/verify-navigation-performance-10.0.30.mjs"
      - ".github/workflows/navigation-performance.yml"
      - ".github/workflows/quality-edge-ci-gates-10.0.41.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Navigation performance contract
        run: node scripts/verify-navigation-performance-10.0.30.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Navigation desktop and mobile
        run: npx playwright test tests/e2e/navigation-performance-10.0.30.spec.ts --project=chromium-desktop --project=chromium-mobile --workers=2
