name: Global Alerts 10.0.47

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/alerts/**"
      - "app/api/search/route.ts"
      - "app/app-shell.tsx"
      - "app/mobile-navigation.tsx"
      - "app/navigation-items.ts"
      - "src/application/global-alerts.ts"
      - "src/application/source-sync-incidents.ts"
      - "tests/e2e/alerts-center.spec.ts"
      - "tests/e2e/global-alerts-engine.spec.ts"
      - "tests/e2e/global-search.spec.ts"
      - "tests/e2e/navigation-performance-10.0.30.spec.ts"
      - ".github/workflows/global-alerts-10.0.47.yml"

permissions:
  contents: read

concurrency:
  group: global-alerts-10.0.47-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Global alert engine, UI and search discoverability
        run: >-
          npx playwright test
          tests/e2e/global-alerts-engine.spec.ts
          tests/e2e/alerts-center.spec.ts
          tests/e2e/global-search.spec.ts
          --project=chromium-desktop
          --workers=2
