name: Backup Production Contract 10.0.35

on:
  push:
    branches:
      - feature/backup-production-10.0.35
    paths:
      - "scripts/create-financial-backup-v2.mjs"
      - "scripts/validate-financial-backup-v2.mjs"
      - "scripts/archive-supabase-storage-v2.mjs"
      - "scripts/supabase-storage-credential-v2.mjs"
      - "scripts/validate-storage-archive-v2.mjs"
      - "scripts/verify-storage-backup-consistency-v2.mjs"
      - "scripts/verify-backup-row-counts-v2.mjs"
      - "scripts/protect-backup-artifact-v2.sh"
      - "tests/backup/**"
      - "scripts/restore-verify-production-backup-v2.sh"
      - "scripts/phase13-restore-rehearsal-v2.sh"
      - ".github/workflows/backup-production-contract-10.0.35.yml"
      - ".github/workflows/production-backup-v2-10.0.35.yml"
  pull_request:
    paths:
      - "scripts/create-financial-backup-v2.mjs"
      - "scripts/validate-financial-backup-v2.mjs"
      - "scripts/archive-supabase-storage-v2.mjs"
      - "scripts/supabase-storage-credential-v2.mjs"
      - "scripts/validate-storage-archive-v2.mjs"
      - "scripts/verify-storage-backup-consistency-v2.mjs"
      - "scripts/verify-backup-row-counts-v2.mjs"
      - "scripts/protect-backup-artifact-v2.sh"
      - "tests/backup/**"
      - "scripts/restore-verify-production-backup-v2.sh"
      - "scripts/phase13-restore-rehearsal-v2.sh"
      - ".github/workflows/backup-production-contract-10.0.35.yml"
      - ".github/workflows/production-backup-v2-10.0.35.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Static contract checks
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/create-financial-backup-v2.mjs
          node --check scripts/validate-financial-backup-v2.mjs
          node --check scripts/archive-supabase-storage-v2.mjs
          node --check scripts/supabase-storage-credential-v2.mjs
          node --check scripts/validate-storage-archive-v2.mjs
          node --check scripts/verify-storage-backup-consistency-v2.mjs
          node --check scripts/verify-backup-row-counts-v2.mjs
          bash -n scripts/restore-verify-production-backup-v2.sh
          bash -n scripts/protect-backup-artifact-v2.sh
          bash -n tests/backup/protected-backup-artifact-v2.test.sh
          bash -n scripts/phase13-restore-rehearsal-v2.sh

      - name: Backup row counts and Storage identity contracts
        run: node --test tests/backup/*.test.mjs

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Encrypted artifact recovery and tamper rejection
        shell: bash
        run: bash tests/backup/protected-backup-artifact-v2.test.sh

      - name: Existing backup v2 restore rehearsal
        shell: bash
        run: bash scripts/phase13-restore-rehearsal-v2.sh

      - name: Restore-verify generated backup with the new production verifier
        shell: bash
        env:
          EXPECTED_APP_VERSION: "10.0.35"
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/restore-verify-production-backup-v2.sh "$RUNNER_TEMP/financial-app-f13-v2-backup"

      - name: Reject a recovery that loses a non-core financial row
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/financial-app-f13-v2-backup"
          target="postgresql://postgres:postgres@127.0.0.1:5432/financial_app_production_backup_restore_check"
          psql "$target" -X -v ON_ERROR_STOP=1 -c "DELETE FROM financial_app.transaction_overrides WHERE id='13000000-0000-4000-8000-000000000013';"
          if output="$(node scripts/verify-backup-row-counts-v2.mjs --sql "$backup" \
            | psql "$target" -X -v ON_ERROR_STOP=1 -At \
            | node scripts/verify-backup-row-counts-v2.mjs --verify "$backup" 2>&1)"; then
            echo "incomplete recovery was incorrectly accepted"
            exit 1
          fi
          if [[ "$output" != *"backup_v2_row_count_mismatch: financial_app.transaction_overrides"* ]]; then
            echo "recovery failed for a reason other than the missing row"
            exit 1
          fi
          echo "missing restored row detection passed"

      - name: Failed restore must not expose row contents in public logs
        shell: bash
        env:
          EXPECTED_APP_VERSION: "10.0.35"
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const root = path.join(process.env.RUNNER_TEMP, 'financial-app-invalid-private-row');
          fs.cpSync(path.join(process.env.RUNNER_TEMP, 'financial-app-f13-v2-backup'), root, { recursive: true });
          const file = path.join(root, 'data.sql');
          const original = fs.readFileSync(file, 'utf8');
          const invalid = original.replaceAll('\t-12345\t', '\tprivate-financial-sentinel\t');
          if (original === invalid) throw new Error('synthetic amount fixture not found');
          fs.writeFileSync(file, invalid);
          const manifestPath = path.join(root, 'manifest.json');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.files.data.bytes = Buffer.byteLength(invalid);
          manifest.files.data.sha256 = crypto.createHash('sha256').update(invalid).digest('hex');
          fs.writeFileSync(manifestPath, JSON.stringify(manifest));
          NODE
          if output="$(bash scripts/restore-verify-production-backup-v2.sh "$RUNNER_TEMP/financial-app-invalid-private-row" 2>&1)"; then
            echo "invalid SQL data was incorrectly accepted"
            exit 1
          fi
          if [[ "$output" != *"reason=database_restore_failed"* || "$output" == *"private-financial-sentinel"* ]]; then
            echo "restore error redaction contract failed"
            exit 1
          fi
          echo "private SQL row redaction passed"

      - name: Storage archive integrity and recovery contract
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/storage-contract"
          recovered="$RUNNER_TEMP/storage-contract-recovered"
          mkdir -p "$root/objects" "$recovered"
          printf 'financial-app-storage-contract-v2\n' > "$root/objects/11111111-1111-4111-8111-111111111111.bin"
          ROOT="$root" node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = require('node:path');
          const root = process.env.ROOT;
          const file = 'objects/11111111-1111-4111-8111-111111111111.bin';
          const bytes = fs.readFileSync(path.join(root, file));
          const manifest = {
            contractVersion: 2,
            createdAt: new Date().toISOString(),
            projectRef: 'contract-project',
            bucketCount: 1,
            objectCount: 1,
            totalBytes: bytes.byteLength,
            objects: [{
              id: '11111111-1111-4111-8111-111111111111',
              bucketId: 'documents',
              name: 'private/contract.bin',
              public: false,
              file,
              bytes: bytes.byteLength,
              sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
            }],
          };
          fs.writeFileSync(path.join(root, 'storage-archive-manifest.json'), JSON.stringify(manifest, null, 2) + '\n');
          NODE
          node scripts/validate-storage-archive-v2.mjs "$root"
          tar -czf "$RUNNER_TEMP/storage-contract.tgz" -C "$RUNNER_TEMP" storage-contract
          tar -xzf "$RUNNER_TEMP/storage-contract.tgz" -C "$recovered"
          node scripts/validate-storage-archive-v2.mjs "$recovered/storage-contract"
          printf 'tampered\n' >> "$recovered/storage-contract/objects/11111111-1111-4111-8111-111111111111.bin"
          if node scripts/validate-storage-archive-v2.mjs "$recovered/storage-contract"; then
            echo "tampered storage archive was incorrectly accepted"
            exit 1
          fi
          echo "storage archive tamper detection passed"
