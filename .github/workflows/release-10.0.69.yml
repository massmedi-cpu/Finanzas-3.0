name: Release 10.0.69

on:
  push:
    branches:
      - release/10.0.69-reflow-accessibility
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-progressive-home:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify progressive Home contract
        run: npm run verify:home-progressive-loading

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Progressive Home browser gate
        run: npx playwright test tests/e2e/inicio-progressive-loading-10.0.69.spec.ts --project=chromium-desktop --project=chromium-mobile --workers=2

      - name: Reflow 200 and 400 percent regression
        run: npx playwright test tests/e2e/reflow-accessibility-10.0.69.spec.ts --project=chromium-desktop --workers=1

      - name: Existing UX continuity gate
        run: npm run test:ux-continuity

      - name: Existing responsive matrix
        run: npm run test:responsive-matrix

      - name: Activation continuity gate
        run: npm run test:activation
