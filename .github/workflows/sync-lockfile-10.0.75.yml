name: Sync Lockfile 10.0.75

on:
  push:
    branches:
      - rebuild/phase-7-forecast-10.0.75

permissions:
  contents: write

concurrency:
  group: sync-lockfile-10.0.75
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/phase-7-forecast-10.0.75
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Sync package-lock identity
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(release): sincronizar package-lock 10.0.75"
          git push origin HEAD:rebuild/phase-7-forecast-10.0.75
