name: RECUPERACION-PRODUCTO PR570 presupuesto verificacion aislada

on:
  push:
    branches:
      - chat/budgets-product-recovery-20261009
    paths:
      - 'app/budgets/**'
      - 'tests/e2e/budgets.spec.ts'
      - '.github/workflows/product-recovery-budget-pr570.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-budget-pr570-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Dependencias bloqueadas
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Comprobar tipos
        run: npm run typecheck
      - name: Compilar y ejecutar guardas existentes
        run: npm run build
      - name: Preparar navegador
        run: npx playwright install --with-deps chromium
      - name: Experiencia de usuario de Presupuestos en escritorio y movil
        run: >-
          npx playwright test tests/e2e/budgets.spec.ts
          --grep RECUPERACION-PRODUCTO
          --project=chromium-desktop --project=chromium-mobile
          --workers=1
