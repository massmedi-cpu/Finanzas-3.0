name: REL-10097 Postflight Dispatch

on:
  push:
    branches:
      - release/10.0.97-backup-dispatch
    paths:
      - .github/workflows/rel10097-postflight-dispatch.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-postflight:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Production Postflight for 10.0.97
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run production-postflight.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f production_url=https://financialapp-home.vercel.app/ \
            -f expected_version=10.0.97 \
            -f deployment_commit=d3d0d43c13b53d5886c6f196822b8a37ae73f457 \
            -f deployment_id=dpl_6Pbh6YvJVcRQP2RPMpnBrHrAAV8E
