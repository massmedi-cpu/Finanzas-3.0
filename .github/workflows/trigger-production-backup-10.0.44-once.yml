name: Trigger Production Backup 10.0.47 Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trigger-production-backup-10.0.44-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact Production Backup v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Dispatching immutable Financial App 10.0.47 production backup before 10.0.48 release"
          gh workflow run production-backup-v2.yml \
            --ref main \
            -f source_commit="b1eb6edd872732dc6c954ad3913fae91ae48283c" \
            -f expected_app_version=10.0.47
