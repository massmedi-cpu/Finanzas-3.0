name: REL-066 Sync Version

on:
  push:
    branches:
      - release/10.0.66-ux-quality
    paths:
      - .github/workflows/rel066-sync-version.yml

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/10.0.66-ux-quality

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Synchronize package identity
        run: npm version 10.0.66 --no-git-tag-version

      - name: Verify synchronized identity
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.version !== '10.0.66') throw new Error(`package.json=${pkg.version}`);
          if (lock.version !== '10.0.66') throw new Error(`package-lock.json=${lock.version}`);
          if (lock.packages?.['']?.version !== '10.0.66') throw new Error(`package-lock root=${lock.packages?.['']?.version}`);
          console.log('Release identity 10.0.66 synchronized');
          NODE

      - name: Commit synchronized package identity
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Package identity already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "REL-066 · sincronizar identidad de versión 10.0.66"
          git push origin HEAD:release/10.0.66-ux-quality
