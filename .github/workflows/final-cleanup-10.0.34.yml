name: Final Cleanup 10.0.34

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "ops/**"
      - "scripts/**"
      - "supabase/functions/financial-app-db-gateway/workspace-context.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Final cleanup contract
        run: node scripts/verify-final-cleanup-10.0.34.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
