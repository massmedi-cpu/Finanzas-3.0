name: Apply ART-001 shell migration 10.0.55

on:
  push:
    branches:
      - release/10.0.55-semantic-tokens
    paths:
      - "scripts/apply-art001-shell-10.0.55.mjs"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: release/10.0.55-semantic-tokens
          fetch-depth: 0

      - name: Apply guarded semantic migration
        run: node scripts/apply-art001-shell-10.0.55.mjs

      - name: Commit exact migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- app/app-shell.module.css && {
            echo "Expected app-shell.module.css to change"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/app-shell.module.css
          git commit -m "refactor(design): migrate app shell to ART-001 tokens"
          git push origin HEAD:release/10.0.55-semantic-tokens
