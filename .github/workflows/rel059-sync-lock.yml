name: REL-059 Sync Lock

on:
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - ".github/workflows/rel059-sync-lock.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'release/rel-059-art-006'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Sync lock identity
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(p, 'utf8'));
          lock.version = '10.0.59';
          lock.packages[''].version = '10.0.59';
          fs.writeFileSync(p, JSON.stringify(lock, null, 2) + '\n');
          NODE

      - name: Commit if needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "lock_already_synced=true"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "REL-059 · sync package-lock 10.0.59"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
