name: One Shot Inicio Sync Feedback

on:
  push:
    branches:
      - 'audit/inicio-sync-feedback-10.0.8'
    paths:
      - '.github/workflows/one-shot-inicio-sync-feedback.yml'
      - 'scripts/apply-inicio-sync-feedback.py'

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout stacked candidate
        uses: actions/checkout@v6
        with:
          ref: audit/inicio-sync-feedback-10.0.8
          fetch-depth: 0

      - name: Align guarded audit marker with both Inicio gates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-inicio-sync-feedback.py')
          text = path.read_text()
          old = '''marker = "          tests/e2e/inicio-utility.spec.ts\\n"
          if workflow_text.count(marker) != 1:
              raise SystemExit("Unexpected Inicio audit test marker")
          workflow.write_text(workflow_text.replace(marker, marker + "          tests/e2e/inicio-sync-feedback.spec.ts\\n", 1))'''
          new = '''marker = "          tests/e2e/inicio-utility.spec.ts\\n"
          if workflow_text.count(marker) != 2:
              raise SystemExit("Unexpected Inicio audit test marker")
          workflow.write_text(workflow_text.replace(marker, marker + "          tests/e2e/inicio-sync-feedback.spec.ts\\n", 2))'''
          if text.count(old) != 1:
              raise SystemExit('Unexpected patcher audit-marker block')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply guarded patch
        run: python3 scripts/apply-inicio-sync-feedback.py

      - name: Keep workflow files for connector-side gate update
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows/inicio-audit-10x10.yml
          git checkout HEAD -- .github/workflows/one-shot-inicio-sync-feedback.yml

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: surface source sync warnings on Inicio"
          git push origin HEAD:audit/inicio-sync-feedback-10.0.8
