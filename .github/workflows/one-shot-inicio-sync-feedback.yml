name: One Shot Inicio Sync Feedback

on:
  push:
    branches:
      - 'audit/inicio-sync-feedback-10.0.8'
    paths:
      - '.github/workflows/one-shot-inicio-sync-feedback.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout stacked candidate
        uses: actions/checkout@v6
        with:
          ref: audit/inicio-sync-feedback-10.0.8
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 scripts/apply-inicio-sync-feedback.py

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: surface source sync warnings on Inicio"
          git push origin HEAD:audit/inicio-sync-feedback-10.0.8
