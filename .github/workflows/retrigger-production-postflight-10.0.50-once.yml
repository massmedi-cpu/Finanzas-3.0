name: Retrigger Production Postflight 10.0.50 Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/retrigger-production-postflight-10.0.50-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected exact Production Postflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-postflight.yml \
            --ref main \
            -f production_url="https://financialapp-home.vercel.app/" \
            -f expected_version="10.0.50" \
            -f deployment_commit="987a3051c366db759900fe13985b6f4e715af69b" \
            -f deployment_id="dpl_GyosB3UoP3DUYPaU1dHjwKZbK4K7"
