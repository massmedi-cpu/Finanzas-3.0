name: Source Incident Trace 10.0.27

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/configuration/source/source-client.tsx"
      - "app/configuration/source/source.module.css"
      - "app/review/review-client.tsx"
      - "app/globals.css"
      - "tests/e2e/source-incident-trace.spec.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/source-incident-trace-10.0.27.yml"
      - ".github/workflows/review-sign-mismatch-10.0.26.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Version consistency
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!=='10.0.27'||l.version!==p.version||l.packages[''].version!==p.version)process.exit(1)"

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Source incident contracts and UX
        run: npx playwright test tests/e2e/source-incident-trace.spec.ts --project=chromium-desktop --project=chromium-mobile --workers=2
