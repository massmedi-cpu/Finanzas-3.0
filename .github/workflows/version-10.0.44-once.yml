name: Version Financial App 10.0.44 Once

on:
  push:
    branches:
      - feature/global-search-10.0.44
    paths:
      - ".github/workflows/version-10.0.44-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-search-10.0.44
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Version package metadata
        run: npm version 10.0.44 --no-git-tag-version
      - name: Commit version checkpoint and retire workflow
        run: |
          rm .github/workflows/version-10.0.44-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/version-10.0.44-once.yml
          git commit -m "chore(release): version Financial App 10.0.44"
          git push origin HEAD:feature/global-search-10.0.44
