name: Financial App Release Gateway Routing
on:
  pull_request:
    branches:
      - main
      - chat/twenty-one-routes-responsive-shell-20261010
    paths:
      - 'src/infrastructure/persistence/release-gateway-target.ts'
      - 'src/infrastructure/persistence/vercel-supabase-gateway.ts'
      - 'src/application/source-sync-runtime-contract.ts'
      - 'supabase/functions/financial-app-db-gateway/**'
      - 'tests/unit/release-gateway-target.test.mjs'
      - 'scripts/aud-e2e-local-network.cjs'
      - 'tests/e2e/source-runtime-contract.spec.ts'
      - '.github/workflows/release-gateway-routing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node.js 24 without additional dependencies
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Confirm production/preview rollback routing and v3 contract
        run: node --experimental-strip-types --test tests/unit/release-gateway-target.test.mjs
