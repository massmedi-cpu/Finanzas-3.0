name: Repair Financial App production identity
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  repair:
    if: github.head_ref == 'financial-app-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      VERCEL_TEAM_SLUG: massmedi-9832s-projects
      VERCEL_TEAM_ID: team_xrSskbkRKwQkyYc0vvLVGUnb
      VERCEL_PROJECT_ID: prj_SbZ64E02YhCK4ds24Yi7qf5CeQjo
      SUPABASE_PROJECT_REF: ulxsvuksrghjgcjfuegv
    steps:
      - name: Check required admin secrets without exposing values
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${VERCEL_TOKEN:-}" ] && echo "vercel=yes" >> "$GITHUB_OUTPUT" || echo "vercel=no" >> "$GITHUB_OUTPUT"
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && echo "supabase=yes" >> "$GITHUB_OUTPUT" || echo "supabase=no" >> "$GITHUB_OUTPUT"
          [ -n "${GOOGLE_CLIENT_ID:-}" ] && [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "google=yes" >> "$GITHUB_OUTPUT" || echo "google=no" >> "$GITHUB_OUTPUT"
          echo "Vercel admin token present: $([ -n "${VERCEL_TOKEN:-}" ] && echo yes || echo no)"
          echo "Supabase admin token present: $([ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && echo yes || echo no)"
          echo "Google OAuth credentials present: $([ -n "${GOOGLE_CLIENT_ID:-}" ] && [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo yes || echo no)"
      - name: Rename Vercel project to Financial App
        if: steps.secrets.outputs.vercel == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest project rename finanzas-3-0 financial-app --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
      - name: Resolve canonical Financial App domain
        if: steps.secrets.outputs.vercel == 'yes'
        id: domain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains?teamId=$VERCEL_TEAM_ID&limit=100" \
            -H "Authorization: Bearer $VERCEL_TOKEN" > /tmp/domains.json
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const data=require('/tmp/domains.json');
          const names=(data.domains||[]).map(d=>d.name).filter(Boolean);
          const preferred=names.find(n=>n==='financial-app.vercel.app')
            || names.filter(n=>n.endsWith('.vercel.app')&&!n.includes('-git-')).sort((a,b)=>a.length-b.length)[0]
            || names[0];
          if(!preferred) process.exit(1);
          console.log(`host=${preferred}`);
          console.log(`url=https://${preferred}`);
          NODE
          echo "Resolved Financial App production domain."
      - name: Enable Google OAuth in Supabase and align redirect URL
        if: steps.secrets.outputs.supabase == 'yes' && steps.secrets.outputs.google == 'yes' && steps.secrets.outputs.vercel == 'yes'
        shell: bash
        env:
          SITE_URL: ${{ steps.domain.outputs.url }}
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/auth.json
          const body={
            site_url: process.env.SITE_URL,
            uri_allow_list: `${process.env.SITE_URL}/auth/callback`,
            external_google_enabled: true,
            external_google_client_id: process.env.GOOGLE_CLIENT_ID,
            external_google_secret: process.env.GOOGLE_CLIENT_SECRET,
            external_google_skip_nonce_check: false
          };
          process.stdout.write(JSON.stringify(body));
          NODE
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/auth.json > /tmp/auth-response.json
          node - <<'NODE'
          const data=require('/tmp/auth-response.json');
          if(data.external_google_enabled!==true) throw new Error('Google provider was not enabled');
          console.log('Supabase Google OAuth enabled and production redirect aligned.');
          NODE
      - name: Report unresolved requirements
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.secrets.outputs.vercel }}" != "yes" ]; then echo "MISSING: VERCEL_TOKEN"; fi
          if [ "${{ steps.secrets.outputs.supabase }}" != "yes" ]; then echo "MISSING: SUPABASE_ACCESS_TOKEN"; fi
          if [ "${{ steps.secrets.outputs.google }}" != "yes" ]; then echo "MISSING: GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET"; fi
