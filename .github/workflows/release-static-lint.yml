name: Financial App Release Static Lint

on:
  pull_request:
    branches:
      - main
      - chat/twenty-one-routes-responsive-shell-20261010
      - chat/integrated-b-e-c-visual-20261010
    paths:
      - 'app/**'
      - 'src/**'
      - 'proxy.ts'
      - 'scripts/release-lint.mjs'
      - 'tests/unit/release-lint.test.mjs'
      - 'package.json'
      - '.github/workflows/release-static-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-static-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-release-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node.js 24 from project engine
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install exactly locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove static linter rejects unsafe fixture code
        run: npm run test:lint
      - name: Lint all production app and source files
        run: npm run lint
      - name: TypeScript full type safety
        run: npm run typecheck
