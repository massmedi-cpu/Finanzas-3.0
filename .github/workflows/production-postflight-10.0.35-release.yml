name: Production Postflight Release 10.0.35

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-postflight-10.0.35-release.yml"
      - "vercel.json"

permissions:
  contents: read

jobs:
  desktop-mobile-security-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCTION_URL: https://financialapp-home.vercel.app
      EXPECTED_APP_VERSION: "10.0.35"
      EXPECTED_COMMIT_SHA: 122a87023cd6a7a9bb16518ba199d50cfe4ee760
      EXPECTED_DEPLOYMENT_ID: dpl_HRkRCQHAR2UdM3AKrHFdXRNb9DND
    steps:
      - name: Checkout closing main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify deployed commit remains in this main history
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "10.0.35"
          git merge-base --is-ancestor "$EXPECTED_COMMIT_SHA" "$GITHUB_SHA"
          deployed_version="$(git show "$EXPECTED_COMMIT_SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          test "$deployed_version" = "10.0.35"

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run exact desktop and mobile Production postflight
        run: npx playwright test --config=playwright.production-postflight.config.ts

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-postflight-browser-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  real-data-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FINANCIAL_APP_DB_PASSWORD: ${{ secrets.FINANCIAL_APP_DB_PASSWORD }}
      FINANCIAL_APP_SUPABASE_PROJECT_REF: btzukbfesxdratqnxuoj
    steps:
      - name: Checkout closing main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Require and mask database password
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FINANCIAL_APP_DB_PASSWORD"
          echo "::add-mask::$FINANCIAL_APP_DB_PASSWORD"

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Resolve authenticated production database route read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const password = process.env.FINANCIAL_APP_DB_PASSWORD ?? '';
          if (!password) process.exit(1);
          process.stdout.write(`::add-mask::${password}\n`);
          const ref = process.env.FINANCIAL_APP_SUPABASE_PROJECT_REF;
          const candidates = [
            { host: `db.${ref}.supabase.co`, user: 'postgres', name: 'direct' },
            { host: 'aws-1-eu-west-3.pooler.supabase.com', user: `postgres.${ref}`, name: 'session_pooler' },
          ];
          for (const candidate of candidates) {
            const attempts = candidate.name === 'session_pooler' ? 5 : 1;
            for (let round = 1; round <= attempts; round += 1) {
              const result = spawnSync('psql', [
                '--host', candidate.host, '--port', '5432', '--username', candidate.user,
                '--dbname', 'postgres', '--no-password', '--tuples-only', '--command', 'SELECT 1;'
              ], {
                encoding: 'utf8',
                env: { ...process.env, PGPASSWORD: password, PGSSLMODE: 'require', PGOPTIONS: '-c default_transaction_read_only=on' },
              });
              if (result.status === 0) {
                const url = new URL('postgresql://postgres@localhost/postgres');
                url.hostname = candidate.host;
                url.port = '5432';
                url.username = candidate.user;
                url.password = password;
                url.searchParams.set('sslmode', 'require');
                const value = url.toString();
                process.stdout.write(`::add-mask::${value}\n`);
                fs.appendFileSync(process.env.GITHUB_ENV, `FINANCIAL_APP_DB_URL=${value}\n`);
                console.log(`production_postflight_db_route=${candidate.name}`);
                process.exit(0);
              }
              if (round < attempts) Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 15000);
            }
          }
          throw new Error('production_postflight_database_route_unavailable');
          NODE

      - name: Verify real financial data with forced read-only session
        env:
          PGOPTIONS: -c default_transaction_read_only=on
        run: node scripts/verify-production-data-readonly-10.0.35.mjs

  postflight-complete:
    if: always()
    needs:
      - desktop-mobile-security-pwa
      - real-data-readonly
    runs-on: ubuntu-latest
    steps:
      - name: Require every Production postflight gate
        env:
          BROWSER_RESULT: ${{ needs.desktop-mobile-security-pwa.result }}
          DATA_RESULT: ${{ needs.real-data-readonly.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BROWSER_RESULT" = "success"
          test "$DATA_RESULT" = "success"
          echo "production_postflight_release_10_0_35=success"
