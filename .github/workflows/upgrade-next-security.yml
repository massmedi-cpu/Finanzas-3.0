name: Upgrade Next.js security patch

on:
  push:
    branches:
      - 'release/10.0.1'
    paths:
      - '.github/workflows/upgrade-next-security.yml'

permissions:
  contents: write

jobs:
  upgrade-next:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/10.0.1
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Generate canonical lockfile for Next.js 16.3.4
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact next@16.3.4

      - name: Refresh semantic lock fingerprint gate
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, writeFileSync } = require('node:fs');
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const normalized = structuredClone(lock);
          normalized.version = '__RELEASE_VERSION__';
          if (normalized.packages?.['']) normalized.packages[''].version = '__RELEASE_VERSION__';
          const fingerprint = createHash('sha256').update(JSON.stringify(normalized)).digest('hex');
          const path = 'tests/e2e/release-version.spec.ts';
          const source = readFileSync(path, 'utf8');
          const next = source.replace(
            /const EXPECTED_LOCK_SEMANTIC_FINGERPRINT = "[a-f0-9]+";/,
            `const EXPECTED_LOCK_SEMANTIC_FINGERPRINT = "${fingerprint}";`,
          );
          if (next === source) throw new Error('release fingerprint marker not found');
          writeFileSync(path, next);
          console.log(`LOCK_FINGERPRINT=${fingerprint}`);
          NODE

      - name: Verify canonical versions
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.version !== '10.0.1') throw new Error(`unexpected app version ${pkg.version}`);
          if (pkg.dependencies?.next !== '16.3.4') throw new Error(`unexpected Next version ${pkg.dependencies?.next}`);
          if (lock.packages?.['']?.dependencies?.next !== '16.3.4') throw new Error('root lock dependency not 16.3.4');
          if (lock.packages?.['node_modules/next']?.version !== '16.3.4') throw new Error(`locked Next version ${lock.packages?.['node_modules/next']?.version}`);
          NODE

      - name: Commit generated security patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json tests/e2e/release-version.spec.ts
          if git diff --cached --quiet; then
            echo 'No dependency changes required.'
            exit 0
          fi
          git commit -m 'security(deps): upgrade Next.js to 16.3.4'
          git push origin HEAD:release/10.0.1
