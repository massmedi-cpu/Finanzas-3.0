name: One-shot V2.0.2 Version Bump

on:
  push:
    branches: [develop/v2.0.2-hardening]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: develop/v2.0.2-hardening

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump package and lock atomically
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "2.0.1" ]; then
            echo "Version is already $CURRENT; nothing to do."
            exit 0
          fi
          npm version 2.0.2 --no-git-tag-version
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'src/version.ts';
          const current = readFileSync(path, 'utf8');
          writeFileSync(path, current.replace("APP_VERSION = '2.0.1'", "APP_VERSION = '2.0.2'"));
          NODE
          git add package.json package-lock.json src/version.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: bump Finanzas 3.0 to V2.0.2"
          git push origin HEAD:develop/v2.0.2-hardening
