name: Forecast Zero Axis 10.0.95

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/design/forecast-balance-chart.tsx"
      - "src/design/forecast-balance-chart.module.css"
      - "tests/e2e/forecast.spec.ts"
      - "scripts/verify-forecast-zero-axis-10.0.95.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/forecast-zero-axis-10.0.95.yml"
  push:
    branches:
      - "qa/user-audit-p4-10.0.92"

permissions:
  contents: read

concurrency:
  group: forecast-zero-axis-10.0.95-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run verify:forecast-zero-axis
      - run: npm run build

  qa21-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: QA-21 · cero financiero real en Previsión
        run: >-
          npx playwright test tests/e2e/forecast.spec.ts
          --grep "QA-21"
          --project=chromium-desktop --project=chromium-mobile --workers=1
