name: REL-065 Production Postflight Dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rel065-production-postflight-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact 10.0.65 production postflight
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-postflight.yml \
            --ref main \
            -f production_url=https://financialapp-home.vercel.app/ \
            -f expected_version=10.0.65 \
            -f deployment_commit=f8d212adb813785f78bff00cc3f8246c040614c7 \
            -f deployment_id=dpl_7Q8Jj7bAivsfNCyMuJ2S1hQcsEMj
