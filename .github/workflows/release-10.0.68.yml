name: Release 10.0.68

on:
  push:
    branches:
      - release/10.0.68-accessibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify accessibility contract
        run: node scripts/verify-accessibility-transactions-10.0.68.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Focused accessibility browser gate
        run: npx playwright test tests/e2e/accessibility-transactions-10.0.68.spec.ts --project=chromium-desktop --project=chromium-mobile --workers=2

      - name: Full Transactions regression
        run: npx playwright test tests/e2e/transactions.spec.ts --project=chromium-desktop --workers=1

      - name: Existing UX continuity gate
        run: npm run test:ux-continuity

      - name: Existing responsive matrix
        run: npm run test:responsive-matrix
