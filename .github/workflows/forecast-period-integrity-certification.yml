name: Forecast Period Integrity Certification

on:
  pull_request:
    paths:
      - "app/forecast/**"
      - "app/api/forecast/**"
      - "src/application/forecast/**"
      - "src/design/forecast-**"
      - "src/infrastructure/persistence/vercel-supabase-gateway.ts"
      - "supabase/functions/financial-app-db-gateway/forecast-logic.ts"
      - "supabase/functions/financial-app-db-gateway/workspace-context.ts"
      - "supabase/functions/financial-app-db-gateway/index.ts"
      - "supabase/migrations/20260906171000_phase8_forecast_engine_core.sql"
      - "supabase/migrations/20260906172500_phase8_forecast_audit_contract.sql"
      - "supabase/migrations/20260906174500_phase8_reconciliation_candidates.sql"
      - "supabase/migrations/20260906180000_phase8_reactivate_system_superseded_forecasts.sql"
      - "supabase/migrations/20260906181500_phase8_nonzero_manual_forecasts.sql"
      - "supabase/migrations/20260909061000_pre007_forecast_write_integrity.sql"
      - "supabase/migrations/20260926180500_cover_forecast_workspace_foreign_keys.sql"
      - "tests/e2e/forecast*.spec.ts"
      - "tests/e2e/recurrence-forecast-flow.spec.ts"
      - "tests/e2e/module-context-navigation.spec.ts"
      - "tests/e2e/visual-system-forecast.spec.ts"
      - "tests/e2e/premium-forecast-visual.spec.ts"
      - ".github/workflows/forecast-period-integrity-certification.yml"
      - ".github/workflows/forecast-premium-targeted-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "app/forecast/**"
      - "app/api/forecast/**"
      - "src/application/forecast/**"
      - "src/design/forecast-**"
      - "src/infrastructure/persistence/vercel-supabase-gateway.ts"
      - "supabase/functions/financial-app-db-gateway/forecast-logic.ts"
      - "supabase/functions/financial-app-db-gateway/workspace-context.ts"
      - "supabase/functions/financial-app-db-gateway/index.ts"
      - "supabase/migrations/20260906171000_phase8_forecast_engine_core.sql"
      - "supabase/migrations/20260906172500_phase8_forecast_audit_contract.sql"
      - "supabase/migrations/20260906174500_phase8_reconciliation_candidates.sql"
      - "supabase/migrations/20260906180000_phase8_reactivate_system_superseded_forecasts.sql"
      - "supabase/migrations/20260906181500_phase8_nonzero_manual_forecasts.sql"
      - "supabase/migrations/20260909061000_pre007_forecast_write_integrity.sql"
      - "supabase/migrations/20260926180500_cover_forecast_workspace_foreign_keys.sql"
      - "tests/e2e/forecast*.spec.ts"
      - "tests/e2e/recurrence-forecast-flow.spec.ts"
      - "tests/e2e/module-context-navigation.spec.ts"
      - "tests/e2e/visual-system-forecast.spec.ts"
      - "tests/e2e/premium-forecast-visual.spec.ts"
      - ".github/workflows/forecast-period-integrity-certification.yml"
      - ".github/workflows/forecast-premium-targeted-e2e.yml"

concurrency:
  group: forecast-period-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Typecheck, build and Forecast regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Forecast period, write and visual regressions on desktop and mobile
        run: npx playwright test tests/e2e/forecast-period-integrity.spec.ts tests/e2e/forecast-boundaries.spec.ts tests/e2e/forecast.spec.ts tests/e2e/forecast-scenarios-10.0.82.spec.ts tests/e2e/forecast-period-race.spec.ts tests/e2e/forecast-accessibility.spec.ts tests/e2e/forecast-write-integrity.spec.ts tests/e2e/recurrence-forecast-flow.spec.ts tests/e2e/module-context-navigation.spec.ts tests/e2e/visual-system-forecast.spec.ts tests/e2e/premium-forecast-visual.spec.ts tests/e2e/release-version.spec.ts --project=chromium-desktop --project=chromium-mobile --workers=2
