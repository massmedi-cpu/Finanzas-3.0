name: REL-066 Production Postflight Dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rel066-production-postflight-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact 10.0.66 Production postflight
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-postflight.yml \
            --ref main \
            -f production_url=https://financialapp-home.vercel.app/ \
            -f expected_version=10.0.66 \
            -f deployment_commit=a97545ef75d654467e4a466b737089c6d98130e9 \
            -f deployment_id=dpl_934XNmy4wzaJ4Vs5PaYD7teH9b2J
