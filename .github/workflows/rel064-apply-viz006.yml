name: REL-064 Apply VIZ-006

on:
  push:
    branches: [release/rel-064-viz-006]
    paths:
      - .github/workflows/rel064-apply-viz006.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rel-064-viz-006
          fetch-depth: 0

      - name: Apply focused scale-reference patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          home_path = Path("src/design/financial-bar-chart.tsx")
          home = home_path.read_text()
          home_old = '''        <span>{valuesVisible ? "Toca un mes para ver las cifras exactas" : "Importes ocultos · proporciones protegidas"}</span>'''
          home_new = '''        <span>{valuesVisible ? "Toca un mes para ver las cifras exactas" : "Importes ocultos · proporciones protegidas"}</span>\n        <span data-testid="financial-bar-scale-reference">\n          {valuesVisible ? `Escala máxima ${formatMoney(maxValue)}` : "Escala protegida por privacidad"}\n        </span>'''
          if home_old not in home:
              raise SystemExit("financial-bar-chart target not found")
          home_path.write_text(home.replace(home_old, home_new, 1))

          accounts_path = Path("app/accounts/accounts-client.tsx")
          accounts = accounts_path.read_text()
          legend_old = '''                    <div className={styles.legend} aria-hidden="true">\n                      <span><i className={styles.incomeDot} />Ingresos</span>\n                      <span><i className={styles.expenseDot} />Gastos</span>\n                      <span><i className={styles.netDot} />Neto</span>\n                    </div>'''
          legend_new = '''                    <div className={styles.legend} aria-label="Leyenda y escala de la actividad mensual">\n                      <span><i className={styles.incomeDot} aria-hidden="true" />Ingresos</span>\n                      <span><i className={styles.expenseDot} aria-hidden="true" />Gastos</span>\n                      <span><i className={styles.netDot} aria-hidden="true" />Neto</span>\n                      <span data-testid="accounts-monthly-scale-reference">Escala máxima {formatMoney(scale)}</span>\n                    </div>'''
          if legend_old not in accounts:
              raise SystemExit("accounts legend target not found")
          accounts = accounts.replace(legend_old, legend_new, 1)

          row_old = '''                        <div className={styles.monthRow} role="listitem" key={row.monthStart}>'''
          row_new = '''                        <div\n                          className={styles.monthRow}\n                          role="listitem"\n                          key={row.monthStart}\n                          aria-label={`${formatMonth(row.monthStart)}: ingresos ${formatMoney(row.incomeCents)}, gastos ${formatMoney(row.expenseCents)}, balance neto ${formatMoney(row.operatingNetCents)}`}\n                        >'''
          if row_old not in accounts:
              raise SystemExit("accounts month row target not found")
          accounts_path.write_text(accounts.replace(row_old, row_new, 1))

          verify_path = Path("scripts/verify-data-visualization-10.0.64.mjs")
          verify_path.write_text('''import { readFileSync } from "node:fs";\n\nconst home = readFileSync("src/design/financial-bar-chart.tsx", "utf8");\nconst accounts = readFileSync("app/accounts/accounts-client.tsx", "utf8");\nconst accountsCss = readFileSync("app/accounts/accounts.module.css", "utf8");\nconst trend = readFileSync("src/design/financial-trend-chart.tsx", "utf8");\nconst forecast = readFileSync("src/design/forecast-balance-chart.tsx", "utf8");\n\nconst requireText = (source, text, label) => {\n  if (!source.includes(text)) throw new Error(`REL-064 missing ${label}: ${text}`);\n};\n\nrequireText(home, "financial-bar-scale-reference", "Home scale reference");\nrequireText(home, "Escala máxima", "Home visible scale copy");\nrequireText(home, "Escala protegida por privacidad", "Home privacy-safe scale copy");\nrequireText(accounts, "accounts-monthly-scale-reference", "Accounts scale reference");\nrequireText(accounts, "Escala máxima {formatMoney(scale)}", "Accounts numeric maximum");\nrequireText(accounts, "aria-label={`${formatMonth(row.monthStart)}: ingresos", "Accounts exact monthly accessible summary");\nrequireText(accountsCss, ".barTrack:nth-child(3) .netBar{left:50%;transform-origin:left center}", "positive net right of zero");\nrequireText(accountsCss, ".barTrack:nth-child(3) .negativeBar{right:50%;transform-origin:right center}", "negative net left of zero");\nrequireText(trend, "const ticks = Array.from({ length: 5 }", "Analysis scale ticks");\nrequireText(trend, "Datos de la comparativa financiera", "Analysis table alternative");\nrequireText(forecast, "Datos de la curva de saldo", "Forecast table alternative");\n\nconsole.log("REL-064 VIZ-006 visualization scale contract: OK");\n''')
          PY

          git rm .github/workflows/rel064-apply-viz006.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/design/financial-bar-chart.tsx app/accounts/accounts-client.tsx scripts/verify-data-visualization-10.0.64.mjs
          git commit -m "REL-064: add visible financial scale references"
          git push origin HEAD:release/rel-064-viz-006
