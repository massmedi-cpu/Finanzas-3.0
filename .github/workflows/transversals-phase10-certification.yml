name: Transversals Phase 10 Certification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/action-feedback.tsx"
      - "app/action-feedback.css"
      - "app/loading.tsx"
      - "app/loading.module.css"
      - "app/error.tsx"
      - "app/app-shell.tsx"
      - "app/app-shell.module.css"
      - "app/mobile-navigation.tsx"
      - "app/alerts/**"
      - "scripts/verify-transversals-phase10-10.0.78.mjs"
      - "scripts/verify-navigation-performance-10.0.30.mjs"
      - "scripts/verify-responsive-breakpoints.mjs"
      - "tests/e2e/action-feedback-10.0.48.spec.ts"
      - "tests/e2e/navigation-performance-10.0.30.spec.ts"
      - "tests/e2e/responsive-matrix-10.0.49.spec.ts"
      - "tests/e2e/mobile-quality-10.0.65.spec.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/transversals-phase10-certification.yml"

permissions:
  contents: read

concurrency:
  group: transversals-phase10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Phase 10 static contract
        run: npm run verify:transversals-phase10

      - name: TypeScript
        run: npm run typecheck

      - name: Production build and cumulative gates
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Transversal desktop and mobile regression
        run: >-
          npx playwright test
          tests/e2e/action-feedback-10.0.48.spec.ts
          tests/e2e/navigation-performance-10.0.30.spec.ts
          tests/e2e/responsive-matrix-10.0.49.spec.ts
          tests/e2e/mobile-quality-10.0.65.spec.ts
          --project=chromium-desktop
          --project=chromium-mobile
          --workers=2
