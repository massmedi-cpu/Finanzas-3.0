name: F13 Production Backup

on:
  push:
    branches:
      - rebuild/phase-13-production

permissions:
  contents: read

jobs:
  production-backup:
    if: contains(github.event.head_commit.message, '[production-backup]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FINANCIAL_APP_DB_URL: ${{ secrets.FINANCIAL_APP_DB_URL }}
      FINANCIAL_APP_SOURCE_COMMIT: ${{ github.sha }}
      FINANCIAL_APP_SCHEMA_VERSION: "14"
      FINANCIAL_APP_STORAGE_BUCKET_COUNT: "1"
      FINANCIAL_APP_STORAGE_OBJECT_COUNT: "0"
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6

      - name: Verify private database secret exists
        shell: bash
        run: |
          if [ -z "$FINANCIAL_APP_DB_URL" ]; then
            echo "FINANCIAL_APP_DB_URL is not configured as a GitHub Actions secret."
            exit 1
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate and normalize Session pooler URI
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const raw = process.env.FINANCIAL_APP_DB_URL ?? '';
          const expectedHost = 'aws-1-eu-west-3.pooler.supabase.com';
          const expectedUser = 'postgres.btzukbfesxdratqnxuoj';
          let url;
          try {
            url = new URL(raw);
          } catch {
            console.error('FINANCIAL_APP_DB_URL is not a valid PostgreSQL URI.');
            process.exit(1);
          }
          if (!['postgres:', 'postgresql:'].includes(url.protocol)) {
            console.error('FINANCIAL_APP_DB_URL must use postgres/postgresql.');
            process.exit(1);
          }
          if (url.hostname !== expectedHost || url.port !== '5432' || url.pathname !== '/postgres') {
            console.error('FINANCIAL_APP_DB_URL must be the Financial App Session pooler URI.');
            process.exit(1);
          }
          if (!url.password || /YOUR-PASSWORD/i.test(url.password)) {
            console.error('FINANCIAL_APP_DB_URL does not contain a real database password.');
            process.exit(1);
          }
          url.username = expectedUser;
          const normalized = url.toString();
          process.stdout.write(`::add-mask::${raw}\n`);
          process.stdout.write(`::add-mask::${normalized}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `FINANCIAL_APP_DB_URL=${normalized}\n`);
          console.log('Session pooler URI validated and normalized without exposing credentials.');
          NODE

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Resolve usable database route after credential rotation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');

          const pooler = new URL(process.env.FINANCIAL_APP_DB_URL);
          const password = decodeURIComponent(pooler.password);
          const projectRef = 'btzukbfesxdratqnxuoj';
          const directHost = `db.${projectRef}.supabase.co`;
          const directUser = 'postgres';
          const poolerHost = 'aws-1-eu-west-3.pooler.supabase.com';
          const poolerUser = `postgres.${projectRef}`;

          process.stdout.write(`::add-mask::${password}\n`);

          function probe(host, user) {
            const result = spawnSync(
              'psql',
              [
                '--host', host,
                '--port', '5432',
                '--username', user,
                '--dbname', 'postgres',
                '--no-password',
                '--tuples-only',
                '--command', 'SELECT 1;',
              ],
              {
                encoding: 'utf8',
                env: { ...process.env, PGPASSWORD: password, PGSSLMODE: 'require' },
              },
            );
            return {
              ok: result.status === 0,
              detail: `${result.stderr || ''}\n${result.stdout || ''}`,
            };
          }

          const direct = probe(directHost, directUser);
          if (direct.ok) {
            const directUrl = new URL('postgresql://postgres@localhost/postgres');
            directUrl.hostname = directHost;
            directUrl.port = '5432';
            directUrl.username = directUser;
            directUrl.password = password;
            directUrl.searchParams.set('sslmode', 'require');
            const value = directUrl.toString();
            process.stdout.write(`::add-mask::${value}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `FINANCIAL_APP_DB_URL=${value}\n`);
            console.log('Direct PostgreSQL route is available and will be used for pg_dump.');
            process.exit(0);
          }

          console.log('Direct PostgreSQL route is unavailable from this runner; retrying Session pooler authentication.');
          let last = '';
          for (let attempt = 1; attempt <= 8; attempt += 1) {
            const pooled = probe(poolerHost, poolerUser);
            last = pooled.detail;
            if (pooled.ok) {
              console.log(`Session pooler authenticated successfully on attempt ${attempt}.`);
              process.exit(0);
            }
            if (attempt < 8) {
              console.log(`Session pooler authentication not ready on attempt ${attempt}; retrying.`);
              Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 15000);
            }
          }

          const authFailure = /password authentication failed|authentication failed/i.test(last);
          console.error(
            authFailure
              ? 'Database password authentication still fails after credential-rotation retries.'
              : 'Neither the direct PostgreSQL route nor the Session pooler became usable from the runner.',
          );
          process.exit(1);
          NODE

      - name: Create atomic production backup
        shell: bash
        run: |
          output="backups/production-${GITHUB_SHA}"
          node scripts/create-financial-backup.mjs "$output"
          node scripts/validate-financial-backup.mjs "$output"

      - name: Package validated backup
        shell: bash
        run: |
          archive="financial-app-production-backup-${GITHUB_SHA}.tgz"
          tar -czf "$archive" -C backups "production-${GITHUB_SHA}"
          sha256sum "$archive" | tee "${archive}.sha256"

      - name: Upload validated backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: financial-app-production-backup-${{ github.sha }}
          path: |
            financial-app-production-backup-${{ github.sha }}.tgz
            financial-app-production-backup-${{ github.sha }}.tgz.sha256
          if-no-files-found: error
          retention-days: 7
