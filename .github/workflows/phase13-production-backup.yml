name: F13 Production Backup

on:
  push:
    branches:
      - rebuild/phase-13-production

permissions:
  contents: read

jobs:
  production-backup:
    if: contains(github.event.head_commit.message, '[production-backup]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FINANCIAL_APP_DB_URL: ${{ secrets.FINANCIAL_APP_DB_URL }}
      FINANCIAL_APP_SOURCE_COMMIT: ${{ github.sha }}
      FINANCIAL_APP_SCHEMA_VERSION: "14"
      FINANCIAL_APP_STORAGE_BUCKET_COUNT: "1"
      FINANCIAL_APP_STORAGE_OBJECT_COUNT: "0"
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6

      - name: Verify private database secret exists
        shell: bash
        run: |
          if [ -z "$FINANCIAL_APP_DB_URL" ]; then
            echo "FINANCIAL_APP_DB_URL is not configured as a GitHub Actions secret."
            exit 1
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate Session pooler URI without changing password bytes
        shell: bash
        run: |
          node <<'NODE'
          const raw = process.env.FINANCIAL_APP_DB_URL ?? '';
          const expectedHost = 'aws-1-eu-west-3.pooler.supabase.com';
          let url;
          try {
            url = new URL(raw);
          } catch {
            console.error('FINANCIAL_APP_DB_URL is not a valid PostgreSQL URI.');
            process.exit(1);
          }
          if (!['postgres:', 'postgresql:'].includes(url.protocol)) {
            console.error('FINANCIAL_APP_DB_URL must use postgres/postgresql.');
            process.exit(1);
          }
          if (url.hostname !== expectedHost || url.port !== '5432' || url.pathname !== '/postgres') {
            console.error('FINANCIAL_APP_DB_URL must be the Financial App Session pooler URI.');
            process.exit(1);
          }
          if (!url.password || /YOUR-PASSWORD/i.test(url.password)) {
            console.error('FINANCIAL_APP_DB_URL does not contain a real database password.');
            process.exit(1);
          }
          process.stdout.write(`::add-mask::${raw}\n`);
          console.log('Session pooler URI shape validated without exposing or rewriting password bytes.');
          NODE

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Resolve exact password encoding and usable database route
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');

          const rawUrl = new URL(process.env.FINANCIAL_APP_DB_URL);
          const serializedPassword = rawUrl.password;
          const candidates = [];
          try {
            const decoded = decodeURIComponent(serializedPassword);
            if (decoded) candidates.push(decoded);
          } catch {
            // A literal percent sequence may be the password itself; test it below.
          }
          if (serializedPassword && !candidates.includes(serializedPassword)) {
            candidates.push(serializedPassword);
          }
          if (candidates.length === 0) {
            console.error('No usable password candidate could be derived from FINANCIAL_APP_DB_URL.');
            process.exit(1);
          }

          const projectRef = 'btzukbfesxdratqnxuoj';
          const directHost = `db.${projectRef}.supabase.co`;
          const directUser = 'postgres';
          const poolerHost = 'aws-1-eu-west-3.pooler.supabase.com';
          const poolerUser = `postgres.${projectRef}`;

          for (const candidate of candidates) {
            process.stdout.write(`::add-mask::${candidate}\n`);
          }

          function probe(host, user, password) {
            const result = spawnSync(
              'psql',
              [
                '--host', host,
                '--port', '5432',
                '--username', user,
                '--dbname', 'postgres',
                '--no-password',
                '--tuples-only',
                '--command', 'SELECT 1;',
              ],
              {
                encoding: 'utf8',
                env: { ...process.env, PGPASSWORD: password, PGSSLMODE: 'require' },
              },
            );
            return { ok: result.status === 0, detail: `${result.stderr || ''}\n${result.stdout || ''}` };
          }

          function publish(host, user, password, routeName) {
            const canonical = new URL('postgresql://postgres@localhost/postgres');
            canonical.hostname = host;
            canonical.port = '5432';
            canonical.username = user;
            canonical.password = password;
            canonical.searchParams.set('sslmode', 'require');
            const value = canonical.toString();
            process.stdout.write(`::add-mask::${value}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `FINANCIAL_APP_DB_URL=${value}\n`);
            console.log(`${routeName} authenticated; canonical connection prepared for pg_dump.`);
          }

          for (const password of candidates) {
            const direct = probe(directHost, directUser, password);
            if (direct.ok) {
              publish(directHost, directUser, password, 'Direct PostgreSQL route');
              process.exit(0);
            }
          }
          console.log('Direct PostgreSQL route is unavailable from this runner; testing Session pooler password encodings.');

          let last = '';
          for (let round = 1; round <= 5; round += 1) {
            for (const password of candidates) {
              const pooled = probe(poolerHost, poolerUser, password);
              last = pooled.detail;
              if (pooled.ok) {
                publish(poolerHost, poolerUser, password, 'Session pooler');
                process.exit(0);
              }
            }
            if (round < 5) {
              console.log(`Session pooler authentication not ready after round ${round}; retrying.`);
              Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 15000);
            }
          }

          const authFailure = /password authentication failed|authentication failed/i.test(last);
          console.error(
            authFailure
              ? 'All safe password encodings were rejected by the current database credentials.'
              : 'Neither the direct PostgreSQL route nor the Session pooler became usable from the runner.',
          );
          process.exit(1);
          NODE

      - name: Create atomic production backup
        shell: bash
        run: |
          output="backups/production-${GITHUB_SHA}"
          node scripts/create-financial-backup.mjs "$output"
          node scripts/validate-financial-backup.mjs "$output"

      - name: Package validated backup
        shell: bash
        run: |
          archive="financial-app-production-backup-${GITHUB_SHA}.tgz"
          tar -czf "$archive" -C backups "production-${GITHUB_SHA}"
          sha256sum "$archive" | tee "${archive}.sha256"

      - name: Upload validated backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: financial-app-production-backup-${{ github.sha }}
          path: |
            financial-app-production-backup-${{ github.sha }}.tgz
            financial-app-production-backup-${{ github.sha }}.tgz.sha256
          if-no-files-found: error
          retention-days: 7
