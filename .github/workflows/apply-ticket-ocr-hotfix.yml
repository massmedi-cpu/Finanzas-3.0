name: Apply ticket OCR hotfix
on:
  push:
    branches:
      - hotfix/v3.0.2-ticket-ocr
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ocr-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v3.0.2-ticket-ocr
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply checked hotfix
        run: node scripts/apply-ticket-ocr-hotfix.mjs
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/archivo/archive-client.tsx app/archive.css
          git diff --cached --quiet && exit 0
          git commit -m "fix(ocr): improve photographed ticket recognition [ocr-applied]"
          git push origin HEAD:hotfix/v3.0.2-ticket-ocr
